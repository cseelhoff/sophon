---
# =============================================================================
# Sophon Infrastructure Master Playbook
# =============================================================================
# Deploys all services in the correct order with automatic connectivity routing
#
# DEPLOYMENT MODES:
# ─────────────────────────────────────────────────────────────────────────────
# Online Mode (default):
#   ansible-playbook site.yml
#
# Air-Gapped Mode (after running prestage.yml and nfs-upload.yml):
#   ansible-playbook site.yml -e proxmox_airgapped=true
#
# With Cloudflared tunnel (for remote access when Bootstrap cannot reach NFS):
#   infravm_cloudflared_tunnel_token=xxx ansible-playbook site.yml
#
# Skip prompts (CI/scripting):
#   ansible-playbook site.yml \
#     -e proxmox_host=10.0.0.10 \
#     -e domain_name=sophon.local \
#     -e proxmox_password=secret
#
# WORKFLOW:
# ─────────────────────────────────────────────────────────────────────────────
# 1. Check/deploy NFS server (if not already in Proxmox)
# 2. Check Bootstrap connectivity to NFS
# 3. Deploy InfraVM (CoreOS with NFS mount + optional cloudflared container)
# 4. Load container images on InfraVM (via SSH)
# 5. Initialize Portainer
# 6. Deploy CoreDNS, Traefik, and other services via Portainer Stacks
#
# AIR-GAPPED WORKFLOW:
# ─────────────────────────────────────────────────────────────────────────────
# Phase 1 (on internet):   ansible-playbook prestage.yml
# --- SWITCH NETWORKS ---
# Phase 2 (on air-gapped): ansible-playbook nfs-upload.yml
# Phase 3 (on air-gapped): ansible-playbook site.yml -e proxmox_airgapped=true
#
# TAGS:
# ─────────────────────────────────────────────────────────────────────────────
#   ansible-playbook site.yml --tags "traefik,gitea"

- name: Deploy Sophon
  hosts: localhost
  tasks:
    - name: Authenticate with Proxmox
      ansible.builtin.include_role: { name: proxmox }

    - name: Deploy NFS Server
      ansible.builtin.include_role: { name: nfs }

    - name: Deploy InfraVM
      ansible.builtin.include_role: { name: infravm }

    - name: Deploy CoreDNS Docker Discovery
      ansible.builtin.include_role: { name: coredns }

    - name: Deploy Traefik
      ansible.builtin.include_role: { name: traefik }

    - name: Deploy OpenLDAP
      ansible.builtin.include_role: { name: openldap }

    - name: Deploy Keycloak
      ansible.builtin.include_role: { name: keycloak }


    # - name: Display final IP configuration
    #   ansible.builtin.debug:
    #     msg: |
    #       ═══════════════════════════════════════════════════════════════════
    #       IP ADDRESS CONFIGURATION
    #       ═══════════════════════════════════════════════════════════════════
    #       NFS Server IP:    {{ nfs_ip }}
    #       InfraVM IP:       {{ infravm_ip }}
    #       Gateway:          {{ vnet_gateway }}
    #       CIDR:             {{ vnet_cidr }}
    #       Vnet:             {{ vnet_interface }}
    #       ═══════════════════════════════════════════════════════════════════

    # - name: Set global SSH connection facts
    #   ansible.builtin.set_fact:
    #     infravm_ansible_host: "{{ 'infra.' ~ domain_name if infravm_cloudflared_tunnel_token | default('') != '' else infravm_ip }}"

    # =============================================================================
    # Final Summary
    # =============================================================================

    - name: Display generated passwords
      ansible.builtin.debug:
        msg: |
          ============================================================================
          SOPHON DEPLOYMENT COMPLETE
          ============================================================================

          InfraVM:
            IP:              {{ infravm_ip }}
            SSH:             ssh admin@{{ infravm_ansible_host | default(infravm_ip) }}
            NFS Mount:       /mnt/nfs -> {{ nfs_ip }}:/export

          Portainer:
            URL:             https://{{ infravm_ip }}:9443
            Username:        admin
            Password:        {{ portainer_admin_password | default('not generated') }}

          Other Credentials:
            Keycloak Admin:      {{ keycloak_admin_password | default('not generated') }}
            Gitea Admin:         {{ gitea_admin_password | default('not generated') }}
            Nexus Admin:         {{ nexus_admin_password | default('not generated') }}
            OpenLDAP Admin:      {{ openldap_admin_password | default('not generated') }}

          ============================================================================
          Store these credentials in your password manager!
          ============================================================================
      when: portainer_admin_password is defined or infravm_ip is defined
