---
# =============================================================================
# Sophon Infrastructure Master Playbook
# =============================================================================
# Deploys all services in the correct order with automatic connectivity routing
#
# DEPLOYMENT MODES:
# ─────────────────────────────────────────────────────────────────────────────
# Online Mode (default):
#   ansible-playbook site.yml
#
# Air-Gapped Mode (after running prestage.yml and nfs-upload.yml):
#   ansible-playbook site.yml -e proxmox_airgapped=true
#
# With Cloudflared tunnel (for remote access when Bootstrap cannot reach NFS):
#   infravm_cloudflared_tunnel_token=xxx ansible-playbook site.yml
#
# Skip prompts (CI/scripting):
#   ansible-playbook site.yml \
#     -e proxmox_host=10.0.0.10 \
#     -e domain_name=sophon.local \
#     -e proxmox_password=secret
#
# WORKFLOW:
# ─────────────────────────────────────────────────────────────────────────────
# 1. Check/deploy NFS server (if not already in Proxmox)
# 2. Check Bootstrap connectivity to NFS
# 3. Deploy InfraVM (CoreOS with NFS mount + optional cloudflared container)
# 4. Load container images on InfraVM (via SSH)
# 5. Initialize Portainer
# 6. Deploy CoreDNS, Traefik, and other services via Portainer Stacks
#
# AIR-GAPPED WORKFLOW:
# ─────────────────────────────────────────────────────────────────────────────
# Phase 1 (on internet):   ansible-playbook prestage.yml
# --- SWITCH NETWORKS ---
# Phase 2 (on air-gapped): ansible-playbook nfs-upload.yml
# Phase 3 (on air-gapped): ansible-playbook site.yml -e proxmox_airgapped=true
#
# TAGS:
# ─────────────────────────────────────────────────────────────────────────────
#   ansible-playbook site.yml --tags "traefik,gitea"

- name: Deploy Sophon
  hosts: localhost
  tags: [always]
  tasks:
    - name: Prompt for missing Proxmox host
      ansible.builtin.pause:
        prompt: "Proxmox API host (IP or hostname)"
      register: _ph
      when: proxmox_host == ""

    - name: Prompt for missing domain
      ansible.builtin.pause:
        prompt: "Domain name"
      register: _dn
      when: domain_name == ""

    - name: Prompt for missing password
      ansible.builtin.pause:
        prompt: "Proxmox password"
        echo: false
      register: _pp
      when: proxmox_password == ""

    - name: Set updated variable values
      ansible.builtin.set_fact:
        proxmox_host: "{{ _ph.user_input | default(proxmox_host) }}"
        domain_name: "{{ _dn.user_input | default(domain_name) }}"
        proxmox_password: "{{ _pp.user_input | default(proxmox_password) }}"
        proxmox_api: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json"

    - name: Authenticate with Proxmox
      ansible.builtin.include_role: { name: proxmox }

    - name: Deploy NFS Server
      ansible.builtin.include_role: { name: nfs }

    # -------------------------------------------------------------------------
    # InfraVM IP Discovery
    # -------------------------------------------------------------------------
    - name: Check for existing sophon-infravm VM
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/cluster/resources?type=vm"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: _vm_list
      when: infravm_ip == ""

    - name: Find sophon-infravm VM
      ansible.builtin.set_fact:
        _infravm_vm: "{{ _vm_list.json.data | selectattr('name', 'eq', 'sophon-infravm') | first | default({}) }}"
      when:
        - _vm_list is defined

    - name: Get InfraVM config for MAC address
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/nodes/{{ _infravm_vm.node }}/qemu/{{ _infravm_vm.vmid }}/config"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: _infravm_config
      when:
        - _infravm_vm is defined
        - _infravm_vm.vmid is defined

    - name: Extract InfraVM MAC address from VM config
      ansible.builtin.set_fact:
        _infravm_mac: "{{ _infravm_config.json.data.net0 | regex_search('([0-9A-Fa-f:]{17})') | lower }}"
      when:
        - _infravm_config is defined
        - _infravm_config.json.data.net0 is defined

    # -------------------------------------------------------------------------
    # Vnet Configuration for IP Scanning
    # -------------------------------------------------------------------------
    - name: Get Proxmox network configuration
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/nodes/{{ proxmox_node | default('pve') }}/network"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: _proxmox_network
      when: (nfs_ip == "") or (infravm_ip == "") or (proxmox_vnet_gateway == "") or (proxmox_cidr == "")

    - name: Find vnet configuration
      ansible.builtin.set_fact:
        _vnet_config: "{{ _proxmox_network.json.data | selectattr('iface', 'eq', proxmox_vnet_interface) | first | default({}) }}"
      when: _proxmox_network is defined

    - name: Extract network base from vnet
      ansible.builtin.set_fact:
        _network_base: "{{ _vnet_config.address | regex_replace('\\.[0-9]+$', '') }}"
        proxmox_vnet_gateway: "{{ proxmox_vnet_gateway | default(_vnet_config.gateway) }}"
      when:
        - _vnet_config is defined
        - _vnet_config | length > 0

    # -------------------------------------------------------------------------
    # ARP Scan for Network Discovery
    # -------------------------------------------------------------------------
    - name: Scan network for used IPs
      when:
        - (nfs_ip == "") or (infravm_ip == "")
      block:
        - name: Install arp-scan and discover network hosts on Proxmox
          proxmox_shell:
            api_host: "{{ proxmox_host }}"
            api_port: "{{ proxmox_port }}"
            api_user: "{{ proxmox_user }}"
            node: "{{ proxmox_node }}"
            pve_auth_cookie: "{{ proxmox_ticket }}"
            proxmox_csrf_token: "{{ proxmox_csrf }}"
            validate_certs: "{{ proxmox_validate_certs }}"
            timeout: 60
            command: >-
              apt-get update -qq && apt-get install -qq -y arp-scan >/dev/null 2>&1;
              arp-scan -I {{ proxmox_vnet_interface }} -l 2>/dev/null |
              awk '/^[0-9]+\./ {print $1, tolower($2)}'
          register: _arp_scan_result

        - name: Parse ARP scan results (IP and MAC pairs)
          ansible.builtin.set_fact:
            _arp_entries: "{{ (_arp_scan_result.stdout | default('') | trim).split('\n') | map('trim') | select() | list }}"
            _used_ips: "{{ (_arp_scan_result.stdout | default('') | trim).split('\n') | map('trim') | select() | map('split', ' ') | map('first') | list }}"

        - name: Find InfraVM IP from MAC address
          ansible.builtin.set_fact:
            infravm_ip: "{{ item.split(' ')[0] }}"
          loop: "{{ _arp_entries }}"
          when:
            - infravm_ip == ""
            - _infravm_mac is defined
            - _infravm_mac in item

        - name: Find available IPs
          ansible.builtin.set_fact:
            _available_ips: >-
              {{
                range(2, 255) | map('string') | map('regex_replace', '^(.*)$', _network_base ~ '.\1')
                | reject('in', _used_ips)
                | reject('eq', _gateway)
                | reject('eq', _vnet_config.address | default(''))
                | list
              }}
          when: _network_base is defined

        - name: Set discovered NFS IP
          ansible.builtin.set_fact:
            nfs_ip: "{{ _available_ips[0] }}"
          when:
            - nfs_ip == ""
            - _available_ips | length > 0

        - name: Remove NFS IP from available IPs
          ansible.builtin.set_fact:
            _available_ips: "{{ _available_ips | reject('eq', nfs_ip) | list }}"
          when:
            - nfs_ip != ""
            - _available_ips is defined

        - name: Set discovered InfraVM IP
          ansible.builtin.set_fact:
            infravm_ip: "{{ _available_ips[0] }}"
          when:
            - infravm_ip == ""
            - _available_ips | length > 0

    # -------------------------------------------------------------------------
    # Derive Gateway and CIDR
    # -------------------------------------------------------------------------
    - name: Set gateway and CIDR from vnet
      ansible.builtin.set_fact:
        proxmox_vnet_gateway: "{{ proxmox_vnet_gateway }}"
        proxmox_cidr: "{{ proxmox_cidr }}"
        # >-
          # {%- if _vnet_config.cidr is defined and '/' in (_vnet_config.cidr | string) -%}
          #   {{ (_vnet_config.cidr | string).split('/')[1] }}
          # {%- elif _vnet_config.cidr is defined -%}
          #   {{ _vnet_config.cidr }}
          # {%- else -%}
          #   {{ (_vnet_config.netmask | ansible.utils.ipaddr('prefix')) }}
          # {%- endif -%}
      when: (proxmox_vnet_gateway == "") or (proxmox_cidr == "")

    - name: Display final IP configuration
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          IP ADDRESS CONFIGURATION
          ═══════════════════════════════════════════════════════════════════
          NFS Server IP:    {{ nfs_ip }}
          InfraVM IP:       {{ infravm_ip }}
          Gateway:          {{ proxmox_vnet_gateway }}
          CIDR:             {{ proxmox_cidr }}
          Vnet:             {{ proxmox_vnet_interface }}
          Cloudflared:      {{ 'ENABLED' if infravm_cloudflared_tunnel_token != '' else 'DISABLED' }}
          ═══════════════════════════════════════════════════════════════════
 
    - ansible.builtin.include_role: { name: coredns }
 
    # - name: Set global SSH connection facts
    #   ansible.builtin.set_fact:
    #     infravm_ansible_host: "{{ 'infra.' ~ domain_name if infravm_cloudflared_tunnel_token | default('') != '' else infravm_ip }}"
    #   when: infravm_gateway is not defined or infravm_gateway == ""

    - name: Display final IP configuration
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          IP ADDRESS CONFIGURATION
          ═══════════════════════════════════════════════════════════════════
          NFS Server IP:    {{ nfs_ip }}
          InfraVM IP:       {{ infravm_ip }}
          Gateway:          {{ infravm_gateway }}
          CIDR:             {{ proxmox_cidr | default('24') }}
          Vnet:             {{ proxmox_vnet_interface }}
          Cloudflared:      {{ 'ENABLED' if infravm_cloudflared_tunnel_token != '' else 'DISABLED' }}
          ═══════════════════════════════════════════════════════════════════

    # - name: Set global SSH connection facts
    #   ansible.builtin.set_fact:
    #     infravm_ansible_host: "{{ 'infra.' ~ domain_name if infravm_cloudflared_tunnel_token | default('') != '' else infravm_ip }}"

# =============================================================================
# Step 2: NFS Server Detection and Deployment
# =============================================================================

    - name: Set NFS detection facts
      ansible.builtin.set_fact:
        sophon_nfs_exists: "{{ proxmox_disk_storage_id_query.json.data | selectattr('storage', 'eq', nfs_storage_name) | list | length > 0 }}"

    - name: Deploy NFS Server
      ansible.builtin.include_role:
        name: nfs
      when: not sophon_nfs_exists

# =============================================================================
# Step 3: Bootstrap Connectivity Check
# =============================================================================

    - name: Create temporary mount point
      ansible.builtin.tempfile:
        state: directory
        prefix: nfs_test_
      register: nfs_temp_mount

    - name: Test NFS mount
      ansible.builtin.shell:
        cmd: |
          # Try to mount NFS share using fuse-nfs (no root required)
          if fuse-nfs -n nfs://{{ nfs_ip }}/export {{ nfs_temp_mount.path }} 2>/dev/null; then
            echo "NFS_REACHABLE"
            exit 0
          else
            echo "NFS_UNREACHABLE"
            exit 1
          fi
      register: nfs_check_result
      failed_when: false
      changed_when: false
      delegate_to: localhost

    - name: Set NFS reachability fact
      ansible.builtin.set_fact:
        nfs_reachable: "{{ nfs_check_result.rc == 0 }}"

    - name: Set cloudflared enabled fact
      ansible.builtin.set_fact:
        cloudflared_enabled: "{{ (not nfs_reachable) and (infravm_cloudflared_tunnel_token != '') }}"

    - name: Display connectivity summary
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════
          Bootstrap Connectivity Check
          ═══════════════════════════════════════════════════════════
          NFS Server:       {{ nfs_ip }}
          NFS Reachable:    {{ nfs_reachable }}
          ───────────────────────────────────────────────────────────
          Cloudflared Token Set: {{ 'Yes' if infravm_cloudflared_tunnel_token != '' else 'No' }}
          Cloudflared Enabled:   {{ cloudflared_enabled }}
          ═══════════════════════════════════════════════════════════

    - name: Fail if NFS unreachable and no cloudflared token
      ansible.builtin.fail:
        msg: |
          ═══════════════════════════════════════════════════════════
          ERROR: Cannot reach NFS server and no cloudflared token set
          ═══════════════════════════════════════════════════════════

          Bootstrap cannot mount NFS at {{ nfs_ip }}/export

          Options:
          1. Ensure network connectivity to {{ nfs_ip }}
          2. Provide cloudflared tunnel token for tunnel access:

            ansible-playbook site.yml -e infravm_cloudflared_tunnel_token="your-tunnel-token"

          ───────────────────────────────────────────────────────────
          How to get a Cloudflare Tunnel token (requires free account):
          ───────────────────────────────────────────────────────────
          1. Log in at https://dash.cloudflare.com (create free account if needed)
          2. Open Zero Trust dashboard: https://one.dash.cloudflare.com
          3. Go to Networks > Tunnels in the left menu
          4. Click "Create a tunnel"
          5. Select "Cloudflared" as connector type, click Next
          6. Name your tunnel (e.g., "ssh-tunnel"), click "Save tunnel"
          7. Find the token in the install command (starts with "eyJ...")
          8. Copy the full token string
          9. Configure public hostname to match your infravm_ansible_host:
            - Click "Add a public hostname"
            - Subdomain: enter the hostname part (e.g., "infra" for infra.example.com)
            - Domain: select your domain from the dropdown
            - Service Type: SSH
            - URL: localhost:22
            - Click "Save hostname"

          ═══════════════════════════════════════════════════════════
      when:
        - not nfs_reachable
        - infravm_cloudflared_tunnel_token == ''


# =============================================================================
# Step 4: Deploy InfraVM
# =============================================================================
- name: Deploy InfraVM
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [infravm, infrastructure]
  roles:
    - infravm

# =============================================================================
# Step 5-10: Deploy Services via Portainer Stacks
# =============================================================================
# =============================================================================
# Core Services (The Big 7)
# =============================================================================
- name: Deploy CoreDNS
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [coredns, dns, infrastructure]
  roles:
    - coredns

- name: Deploy OpenLDAP
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [openldap, ldap, identity]
  roles:
    - openldap

- name: Deploy Keycloak
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [keycloak, sso, identity]
  roles:
    - keycloak

- name: Deploy Traefik
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [traefik, proxy, infrastructure]
  roles:
    - traefik

- name: Deploy DNS Sync
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [dns_sync, dns, infrastructure]
  roles:
    - dns_sync

- name: Deploy Nexus
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [nexus, artifacts, development]
  roles:
    - nexus

- name: Deploy Gitea
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [gitea, git, development]
  roles:
    - gitea

# =============================================================================
# Final Summary
# =============================================================================
- name: Display Generated Credentials
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Display generated passwords
      ansible.builtin.debug:
        msg: |
          ============================================================================
          SOPHON DEPLOYMENT COMPLETE
          ============================================================================

          InfraVM:
            IP:              {{ infravm_ip }}
            SSH:             ssh admin@{{ infravm_ansible_host | default(infravm_ip) }}
            NFS Mount:       /mnt/nfs -> {{ nfs_ip }}:/export

          Portainer:
            URL:             https://{{ infravm_ip }}:9443
            Username:        admin
            Password:        {{ portainer_admin_password | default('not generated') }}

          {% if infravm_cloudflared_tunnel_token != '' %}
          Cloudflared:       ENABLED (tunnel active)
          {% endif %}

          Other Credentials:
            Keycloak Admin:      {{ keycloak_admin_password | default('not generated') }}
            Gitea Admin:         {{ gitea_admin_password | default('not generated') }}
            Nexus Admin:         {{ nexus_admin_password | default('not generated') }}
            OpenLDAP Admin:      {{ openldap_admin_password | default('not generated') }}

          ============================================================================
          Store these credentials in your password manager!
          ============================================================================
      when: portainer_admin_password is defined or infravm_ip is defined
