---
# Sophon Infrastructure Master Playbook
# Deploys all services in the correct order
#
# Quick Start:
#   cd ansible && ansible-playbook -i inventories/development/inventory.yml site.yml
#   (You will be prompted for Proxmox host, domain name, and password if not configured)
#
# With explicit parameters (for scripting/CI):
#   ansible-playbook -i inventories/development/inventory.yml site.yml \
#     -e proxmox_host=pve.example.com \
#     -e domain_name=homelab.local \
#     -e proxmox_password=secret
#
# Deploy specific services:
#   ansible-playbook -i inventories/development/inventory.yml site.yml --tags "traefik,homepage"

- name: Gather Required Variables
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Load from environment or CLI
      ansible.builtin.set_fact:
        proxmox_host: "{{ proxmox_host | default(lookup('env', 'PROXMOX_HOST')) | default('', true) }}"
        domain_name: "{{ domain_name | default(lookup('env', 'DOMAIN_NAME')) | default('', true) }}"
        proxmox_password: "{{ proxmox_password | default(lookup('env', 'PROXMOX_PASSWORD')) | default('', true) }}"
        coreos_ip: "{{ coreos_ip | default(lookup('env', 'COREOS_IP')) | default('', true) }}"
        coreos_cidr: "{{ coreos_cidr | default(lookup('env', 'COREOS_CIDR')) | default('24', true) }}"
        coreos_gateway: "{{ coreos_gateway | default(lookup('env', 'COREOS_GATEWAY')) | default('', true) }}"

    - name: Prompt for missing Proxmox host
      ansible.builtin.pause:
        prompt: "Proxmox API host"
      register: _ph
      when: proxmox_host == ""

    - name: Prompt for missing domain
      ansible.builtin.pause:
        prompt: "Domain name"
      register: _dn
      when: domain_name == ""

    - name: Prompt for missing password
      ansible.builtin.pause:
        prompt: "Proxmox password"
        echo: false
      register: _pp
      when: proxmox_password == ""

    - name: Prompt for missing CoreOS IP
      ansible.builtin.pause:
        prompt: "CoreOS VM static IP"
      register: _ip
      when: coreos_ip == ""

    - name: Prompt for missing CoreOS gateway
      ansible.builtin.pause:
        prompt: "CoreOS gateway"
      register: _gw
      when: coreos_gateway == ""

    - name: Set prompted values
      ansible.builtin.set_fact:
        proxmox_host: "{{ _ph.user_input | default(proxmox_host, true) }}"
        domain_name: "{{ _dn.user_input | default(domain_name, true) }}"
        proxmox_password: "{{ _pp.user_input | default(proxmox_password, true) }}"
        coreos_ip: "{{ _ip.user_input | default(coreos_ip, true) }}"
        coreos_gateway: "{{ _gw.user_input | default(coreos_gateway, true) }}"

- name: Deploy CoreOS VM
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [coreos, infrastructure]
  roles:
    - coreos

- name: Deploy Portainer
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [portainer, infrastructure]
  roles:
    - portainer

