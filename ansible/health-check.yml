---
# Health Check Playbook
# Verifies all Sophon services are running and accessible
#
# Usage:
#   ansible-playbook -i inventories/development/inventory.yml health-check.yml
#   ansible-playbook -i inventories/production/inventory.yml health-check.yml

- name: Sophon Health Check
  hosts: coreos
  gather_facts: true
  vars:
    health_check_timeout: 10
    health_results: []

  tasks:
    - name: Check Portainer
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ portainer_port | default(9443) }}/api/status"
        method: GET
        validate_certs: false
        timeout: "{{ health_check_timeout }}"
      register: portainer_health
      failed_when: false
      when: portainer_enabled | default(true)

    - name: Check Traefik
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ traefik_port_ui | default(8080) }}/api/overview"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: traefik_health
      failed_when: false
      when: traefik_enabled | default(true)

    - name: Check CoreDNS
      ansible.builtin.command:
        cmd: "dig @{{ ansible_host }} {{ coredns_domain | default('example.local') }} +short +time=2"
      register: coredns_health
      failed_when: false
      changed_when: false
      delegate_to: localhost
      when: coredns_enabled | default(true)

    - name: Check Homepage
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ homepage_port | default(3000) }}"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: homepage_health
      failed_when: false
      when: homepage_enabled | default(true)

    - name: Check Gitea
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ gitea_port_http | default(3001) }}/api/v1/version"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: gitea_health
      failed_when: false
      when: gitea_enabled | default(true)

    - name: Check Nexus
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ nexus_port | default(8081) }}/service/rest/v1/status"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: nexus_health
      failed_when: false
      when: nexus_enabled | default(true)

    - name: Check OpenLDAP
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ openldap_port_admin | default(8089) }}"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: openldap_health
      failed_when: false
      when: openldap_enabled | default(true)

    - name: Check Keycloak
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ keycloak_port | default(8180) }}/health"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: keycloak_health
      failed_when: false
      when: keycloak_enabled | default(true)

    - name: Check Nextcloud
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ nextcloud_port | default(8083) }}/status.php"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: nextcloud_health
      failed_when: false
      when: nextcloud_enabled | default(true)

    - name: Check n8n
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ n8n_port | default(5678) }}/healthz"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: n8n_health
      failed_when: false
      when: n8n_enabled | default(true)

    - name: Check Guacamole
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ guacamole_port | default(8090) }}/guacamole/"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: guacamole_health
      failed_when: false
      when: guacamole_enabled | default(true)

    - name: Check Kopia
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ kopia_port | default(51515) }}"
        method: GET
        timeout: "{{ health_check_timeout }}"
      register: kopia_health
      failed_when: false
      when: kopia_enabled | default(true)

    - name: Display Health Check Results
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════╗
          ║                    SOPHON HEALTH CHECK                       ║
          ╠══════════════════════════════════════════════════════════════╣
          ║ Service       │ Status │ Details                             ║
          ╠═══════════════╪════════╪═════════════════════════════════════╣
          ║ Portainer     │ {{ '✅ UP  ' if portainer_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ portainer_port | default(9443) }}{{ ' - ' + (portainer_health.msg | default('')) if portainer_health.status | default(0) != 200 else '' }}
          ║ Traefik       │ {{ '✅ UP  ' if traefik_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ traefik_port_ui | default(8080) }}
          ║ CoreDNS       │ {{ '✅ UP  ' if coredns_health.rc | default(1) == 0 else '❌ DOWN' }} │ Port 53
          ║ Homepage      │ {{ '✅ UP  ' if homepage_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ homepage_port | default(3000) }}
          ║ Gitea         │ {{ '✅ UP  ' if gitea_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ gitea_port_http | default(3001) }}
          ║ Nexus         │ {{ '✅ UP  ' if nexus_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ nexus_port | default(8081) }}
          ║ OpenLDAP      │ {{ '✅ UP  ' if openldap_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ openldap_port_admin | default(8089) }}
          ║ Keycloak      │ {{ '✅ UP  ' if keycloak_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ keycloak_port | default(8180) }}
          ║ Nextcloud     │ {{ '✅ UP  ' if nextcloud_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ nextcloud_port | default(8083) }}
          ║ n8n           │ {{ '✅ UP  ' if n8n_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ n8n_port | default(5678) }}
          ║ Guacamole     │ {{ '✅ UP  ' if guacamole_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ guacamole_port | default(8090) }}
          ║ Kopia         │ {{ '✅ UP  ' if kopia_health.status | default(0) == 200 else '❌ DOWN' }} │ Port {{ kopia_port | default(51515) }}
          ╚══════════════════════════════════════════════════════════════╝

    - name: Fail if critical services are down
      ansible.builtin.fail:
        msg: "Critical service {{ item.name }} is not responding!"
      when: item.check.status | default(0) != 200
      loop:
        - { name: "Portainer", check: "{{ portainer_health }}" }
        - { name: "Traefik", check: "{{ traefik_health }}" }
      loop_control:
        label: "{{ item.name }}"
      ignore_errors: true
      tags: [critical]
