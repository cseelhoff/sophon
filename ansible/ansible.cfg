[defaults]
# Disable retry files
retry_files_enabled = False

# Disable deprecated auto-injection of facts as top-level vars
inject_facts_as_vars = False

# Fact caching for performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/sophon_facts_cache
fact_caching_timeout = 7200

# Roles path
roles_path = ./roles

# Inventory
inventory = ./inventories/development/inventory.yml

# Output formatting
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True

# SSH settings
host_key_checking = False
timeout = 30

# Parallelism
forks = 10

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
