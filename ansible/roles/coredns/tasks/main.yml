---
# Deploy CoreDNS to Portainer

- name: Deploy CoreDNS
  when: coredns_enabled is true
  block:
    - name: Set deployment variables
      ansible.builtin.set_fact:
        coredns_validate_certs: false
        coredns_file_server_ip: "{{ ansible_default_ipv4.address }}"

    - name: Check if CoreDNS image exists
      ansible.builtin.raw: podman images | grep -q "{{ coredns_image_name }}[ ]*{{ coredns_image_tag }}"
      delegate_to: "{{ coreos_ip }}"
      register: coredns_image_exists
      failed_when: false
      changed_when: false

    - name: Download and load CoreDNS image from HTTP file server
      ansible.builtin.raw: |
        cd /tmp &&
        curl -o coredns.tar http://{{ coredns_file_server_ip }}:{{ http_file_server_port }}/coredns.tar &&
        podman load -i coredns.tar &&
        rm -f coredns.tar
      delegate_to: "{{ coreos_ip }}"
      when: coredns_image_exists.rc != 0

    - name: Create CoreDNS config directory
      ansible.builtin.raw: mkdir -p {{ coredns_config_dir }}
      delegate_to: "{{ coreos_ip }}"
      become: true

    - name: Create Corefile configuration
      ansible.builtin.raw: |
        cat > {{ coredns_config_dir }}/Corefile << 'COREFILE'
        {{ lookup('template', 'Corefile.j2') }}
        COREFILE
      delegate_to: "{{ coreos_ip }}"
      become: true

    - name: Create new resolved.conf with DNSStubListener disabled
      ansible.builtin.raw: |
        echo '[Resolve]' > /etc/systemd/resolved.conf
        echo 'DNSStubListener=no' >> /etc/systemd/resolved.conf
      become: true
      delegate_to: "{{ coreos_ip }}"

    - name: Restart systemd-resolved service
      ansible.builtin.raw: systemctl restart systemd-resolved
      become: true
      delegate_to: "{{ coreos_ip }}"

    - name: Generate docker-compose content in base64
      ansible.builtin.set_fact:
        coredns_compose_base64: "{{ lookup('template', 'templates/docker-compose.yml.j2') | b64encode }}"

    - name: Deploy CoreDNS stack using portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_url: "https://{{ coreos_ip }}:{{ portainer_port }}"
        portainer_stack_name: "coredns"
        portainer_stack_compose_content: "{{ coredns_compose_base64 | b64decode }}"
