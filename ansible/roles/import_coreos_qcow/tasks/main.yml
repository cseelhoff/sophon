---
- block:
    - name: Create destination directory
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: directory
        mode: '0755'

    - name: Get base file name from url
      ansible.builtin.set_fact:
        coreos_qcow_xz_path: "{{ dest_dir }}/{{ coreos_url | basename }}"

    - name: Set extracted qcow file name
      ansible.builtin.set_fact:
        coreos_qcow_path: "{{ coreos_qcow_xz_path | regex_replace('.xz$', '') }}"
 
    - name: Check if qcow exists in /var/lib/vz/template/qcow/fedora-coreos-39.20240304.3.0-qemu.x86_64.qcow2
      ansible.builtin.stat:
        path: "{{ coreos_qcow_path }}"
      register: local_file_stat

    - name : Download CoreOS image
      ansible.builtin.get_url:
        url: "{{ coreos_url }}"
        dest: "{{ coreos_qcow_xz_path }}"
        timeout: 600
      when: not local_file_stat.stat.exists

    - name: Extract file from the .xz
      ansible.builtin.command:
        cmd: "xz -d {{ coreos_qcow_xz_path }}"
      when: 
        - not local_file_stat.stat.exists

    - name: Attach CoreOS qcow2 via qm importdisk
      ansible.builtin.command:
        cmd: "qm importdisk {{ vm_id }} {{ coreos_qcow_path }} {{ storage }} --format qcow2"
      
  delegate_to: "{{ proxmox_host }}"
  vars:
    ansible_ssh_password: "{{ pass2 }}"
    ansible_ssh_user: root