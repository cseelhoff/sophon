---
- name: Deploy Stack to Portainer
  tasks:
    - name: Authenticate with Portainer
      uri:
        url: "{{ portainer_url }}/api/auth"
        method: POST
        body_format: json
        body:
          Username: "admin"
          Password: "{{ portainer_admin_password }}"
        status_code: 200
        validate_certs: "{{ validate_certs }}"
      register: auth_response
    
    - name: Set auth token variable
      set_fact:
        auth_token: "{{ auth_response.json.jwt }}"
    
    - name: Get endpoints
      uri:
        url: "{{ portainer_url }}/api/endpoints"
        method: GET
        headers:
          Authorization: "Bearer {{ auth_token }}"
        status_code: 200
        validate_certs: "{{ validate_certs }}"
      register: endpoints_response
    
    - name: Find local endpoint ID
      set_fact:
        local_endpoint_id: "{{ endpoints_response.json[0].Id }}"
      when: endpoints_response.json | length > 0
    
    - name: Create local endpoint if it doesn't exist
      uri:
        url: "{{ portainer_url }}/api/endpoints"
        method: POST
        headers:
          Authorization: "Bearer {{ auth_token }}"
        body_format: form-urlencoded
        body:
          Name: "local"
          EndpointCreationType: 1
        status_code: 200
        validate_certs: "{{ validate_certs }}"
      register: endpoint_create_response
      when: local_endpoint_id is not defined or local_endpoint_id == 'null'
    
    - name: Set endpoint ID from creation response
      set_fact:
        local_endpoint_id: "{{ endpoint_create_response.json.Id }}"
      when: endpoint_create_response is defined and endpoint_create_response.json is defined

    - name: Set docker compose content from variable
      set_fact:
        docker_compose_content_decoded: "{{ docker_compose_base64 | b64decode }}"
        
    - name: Deploy stack to Portainer
      uri:
        url: "{{ portainer_url }}/api/stacks/create/standalone/string?endpointId={{ local_endpoint_id }}"
        method: POST
        headers:
          Authorization: "Bearer {{ auth_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          env: "{{ stack_env_vars | default([]) }}"
          fromAppTemplate: false
          name: "{{ stack_name }}"
          stackFileContent: "{{ docker_compose_content_decoded }}"
        status_code: 200
        validate_certs: "{{ validate_certs }}"
