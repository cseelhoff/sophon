- name: Create download directory {{ local_download_dir }}
  ansible.builtin.file:
    path: "{{ local_download_dir }}"
    state: directory
    mode: '0755'

- name: Start Python HTTP server on port {{ http_file_server_port }} in {{ local_download_dir }}
  ansible.builtin.command:
    cmd: "python3 -m http.server {{ http_file_server_port }}"
    chdir: "{{ local_download_dir }}"
  async: 600  # Keep running for 10 minutes
  poll: 0
  register: http_server_registration

- name: Check if {{ local_download_dir }}/{{ local_filename }} exists locally
  ansible.builtin.stat:
    path: "{{ local_download_dir }}/{{ local_filename }}"
  register: local_file_stat

- name: Download {{ file_download_url }} to {{ local_download_dir }}/{{ file_download_filename }} locally
  ansible.builtin.get_url:
    url: "{{ file_download_url }}"
    dest: "{{ local_download_dir }}/{{ file_download_filename }}"
    timeout: 600
  when: not local_file_stat.stat.exists

- name: Extract file from {{ local_download_dir }}/{{ file_download_filename }} locally 
  ansible.builtin.command:
    cmd: "xz -d {{ local_download_dir }}/{{ file_download_filename }}"
  when: 
    - not local_file_stat.stat.exists
    - extracted_filename is defined

- name: Rename extracted file to {{ local_download_dir }}/{{ renamed_filename }}
  ansible.builtin.command:
    cmd: "mv {{ local_download_dir }}/{{ extracted_filename }} {{ local_download_dir }}/{{ renamed_filename }}"
  when: 
    - not local_file_stat.stat.exists
    - extracted_filename is defined
    - renamed_filename is defined
