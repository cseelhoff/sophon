    src: "{{ coreos_qcow2_img_filename }}"
    dest: "/tmp/{{ coreos_qcow2_img_filename }}"
  delegate_to: "{{ proxmox_api_host }}"
  vars:
    ansible_user: "{{ proxmox_api_username }}"
    ansible_password: "{{ proxmox_api_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  when: not core_qcow_exists.stat.exists
    
