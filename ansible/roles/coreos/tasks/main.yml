---
# =============================================================================
# CoreOS VM Deployment on Proxmox
# =============================================================================

# -----------------------------------------------------------------------------
# Pre-flight: Validate required variables
# -----------------------------------------------------------------------------
- name: Validate coreos_proxmox_api_host is defined
  ansible.builtin.fail:
    msg: |
      ERROR: coreos_proxmox_api_host is required but not defined.

      Quick Start Usage:
        ansible-playbook -i localhost, ansible/site.yml \
          -e coreos_proxmox_api_host=YOUR_PROXMOX_IP \
          -e domain_name=homelab.local
  when: coreos_proxmox_api_host is not defined or coreos_proxmox_api_host == ""

# -----------------------------------------------------------------------------
# SSH Key Setup
# -----------------------------------------------------------------------------
- name: Check if SSH key exists
  ansible.builtin.stat:
    path: "{{ coreos_ssh_private_key_path }}"
  register: coreos_ssh_key_stat

- name: Generate SSH key if missing
  ansible.builtin.command:
    cmd: "ssh-keygen -t rsa -b 4096 -f {{ coreos_ssh_private_key_path }} -N ''"
  when: not coreos_ssh_key_stat.stat.exists

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ coreos_ssh_public_key_path }}"
  register: coreos_ssh_key

# -----------------------------------------------------------------------------
# Proxmox Authentication
# -----------------------------------------------------------------------------
- name: Check for Proxmox API password in environment
  ansible.builtin.set_fact:
    coreos_proxmox_api_password: "{{ lookup('env', 'PROXMOX_API_PASSWORD') }}"
  when: lookup('env', 'PROXMOX_API_PASSWORD') != ""

- name: Prompt for Proxmox API password if not set
  ansible.builtin.pause:
    prompt: "Enter Proxmox password for {{ coreos_proxmox_api_user }}"
    echo: false
  register: coreos_proxmox_password_prompt
  when: coreos_proxmox_api_password is not defined or coreos_proxmox_api_password == ""

- name: Set Proxmox API password from prompt
  ansible.builtin.set_fact:
    coreos_proxmox_api_password: "{{ coreos_proxmox_password_prompt.user_input }}"
  when: coreos_proxmox_password_prompt.user_input is defined

- name: Obtain Proxmox API ticket
  ansible.builtin.uri:
    url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/access/ticket"
    method: POST
    body:
      username: "{{ coreos_proxmox_api_user }}"
      password: "{{ coreos_proxmox_api_password }}"
    body_format: form-urlencoded
    validate_certs: false
  register: coreos_pve_ticket

- name: Set authentication facts
  ansible.builtin.set_fact:
    coreos_pve_auth_cookie: "{{ coreos_pve_ticket.json.data.ticket }}"
    coreos_pve_csrf_token: "{{ coreos_pve_ticket.json.data.CSRFPreventionToken }}"

# -----------------------------------------------------------------------------
# CoreOS Image: Check if exists on Proxmox
# -----------------------------------------------------------------------------
- name: Check if QCOW2 exists on Proxmox
  ansible.builtin.uri:
    url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/local/content"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
    validate_certs: false
  register: coreos_storage_content
  failed_when: false

- name: Set image exists fact
  ansible.builtin.set_fact:
    coreos_image_exists: "{{ coreos_storage_content.json.data | default([]) | selectattr('volid', 'search', coreos_qcow2_img_filename) | list | length > 0 }}"

# -----------------------------------------------------------------------------
# CoreOS Image: Download (non-airgapped mode)
# -----------------------------------------------------------------------------
- name: Download and prepare CoreOS image
  when: not coreos_image_exists and not (coreos_airgapped_mode | default(false))
  block:
    - name: Create temp directory on Proxmox
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/execute"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
          CSRFPreventionToken: "{{ coreos_pve_csrf_token }}"
        body:
          command: "mkdir -p /tmp/sophon"
        body_format: form-urlencoded
        validate_certs: false
      failed_when: false

    - name: Attempt to download CoreOS image via Proxmox API
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/local/download-url"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
          CSRFPreventionToken: "{{ coreos_pve_csrf_token }}"
        body:
          content: "iso"
          filename: "{{ coreos_qcow2_xz_filename }}"
          url: "{{ coreos_qcow2_url }}"
        body_format: json
        validate_certs: false
        status_code: [200, 500]
      register: coreos_download_attempt
      failed_when: false

    - name: Display SSH instructions if API download not available
      ansible.builtin.fail:
        msg: |

          ============================================================================
          MANUAL STEP REQUIRED: CoreOS Image Download
          ============================================================================

          The Proxmox API cannot directly download and extract QCOW2 images.
          Please run ONE of the following commands on your Proxmox server:

          Option 1 - SSH (if SSH access is available):
          ----------------------------------------------------------------------------
          ssh {{ coreos_proxmox_api_user }}@{{ coreos_proxmox_api_host }} 'cd /tmp && curl -LO {{ coreos_qcow2_url }} && xz -d {{ coreos_qcow2_xz_filename }} && mv {{ coreos_qcow2_final_filename }} {{ coreos_qcow2_img_filename }}'

          Option 2 - Console (run directly on Proxmox shell):
          ----------------------------------------------------------------------------
          cd /tmp && curl -LO {{ coreos_qcow2_url }} && xz -d {{ coreos_qcow2_xz_filename }} && mv {{ coreos_qcow2_final_filename }} {{ coreos_qcow2_img_filename }}

          After the download completes, re-run this playbook.
          ============================================================================
      when: coreos_download_attempt.status != 200

    - name: Wait for download task to complete
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/local/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
        validate_certs: false
      register: coreos_download_check
      until: coreos_download_check.json.data | selectattr('volid', 'search', coreos_qcow2_xz_filename) | list | length > 0
      retries: 60
      delay: 10
      when: coreos_download_attempt.status == 200

# -----------------------------------------------------------------------------
# CoreOS Image: Air-gapped mode (HTTP file server)
# -----------------------------------------------------------------------------
- name: Prepare image via HTTP file server (air-gapped mode)
  when: not coreos_image_exists and (coreos_airgapped_mode | default(false))
  block:
    - name: Get local IP for HTTP server
      ansible.builtin.set_fact:
        coreos_local_ip: "{{ ansible_default_ipv4.address }}"

    - name: Include HTTP file server role
      ansible.builtin.include_role:
        name: http_file_server
      vars:
        http_file_server_port: "{{ coreos_http_file_server_port }}"
        http_file_server_local_download_dir: "{{ coreos_local_download_dir }}"
        http_file_server_local_filename: "{{ coreos_qcow2_img_filename }}"
        http_file_server_download_url: "{{ coreos_qcow2_url }}"
        http_file_server_download_filename: "{{ coreos_qcow2_xz_filename }}"
        http_file_server_extracted_filename: "{{ coreos_qcow2_final_filename }}"
        http_file_server_renamed_filename: "{{ coreos_qcow2_img_filename }}"

    - name: Trigger Proxmox to download from local HTTP server
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/local/download-url"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
          CSRFPreventionToken: "{{ coreos_pve_csrf_token }}"
        body:
          content: "iso"
          filename: "{{ coreos_qcow2_img_filename }}"
          url: "http://{{ coreos_local_ip }}:{{ coreos_http_file_server_port }}/{{ coreos_qcow2_img_filename }}"
        body_format: json
        validate_certs: false
      register: coreos_local_download

    - name: Wait for local download to complete
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/local/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
        validate_certs: false
      register: coreos_local_download_check
      until: coreos_local_download_check.json.data | selectattr('volid', 'search', coreos_qcow2_img_filename) | list | length > 0
      retries: 30
      delay: 10

# -----------------------------------------------------------------------------
# Ignition Configuration
# -----------------------------------------------------------------------------
- name: Create DHCP network config
  ansible.builtin.set_fact:
    coreos_network_config: |
      [connection]
      id=Wired connection 1
      type=ethernet

      [ipv4]
      method=auto
  when: coreos_network_mode == "dhcp"

- name: Create static network config
  ansible.builtin.set_fact:
    coreos_network_config: |
      [connection]
      id=Wired connection 1
      type=ethernet

      [ipv4]
      address1={{ coreos_ip }}/{{ coreos_cidr }},{{ coreos_gateway }}
      method=manual
  when: coreos_network_mode == "static"

- name: Create ignition config
  ansible.builtin.set_fact:
    coreos_ignition_config: >-
      {
        "ignition": {"version": "3.0.0"},
        "passwd": {
          "users": [{
            "name": "{{ coreos_username }}",
            "passwordHash": "$y$j9T$icTH9ilSsldG.Sew1Ipk./$P4/ewJbHmjiKy99l7Z9bcen5dVYRf0SetM3C2l8VKn2",
            "sshAuthorizedKeys": ["{{ coreos_ssh_key['content'] | b64decode | trim }}"],
            "groups": ["sudo", "docker"]
          }]
        },
        "storage": {
          "files": [{
            "path": "/etc/NetworkManager/system-connections/eth0.nmconnection",
            "mode": 384,
            "contents": {"source": "data:text/plain;charset=utf-8;base64,{{ coreos_network_config | b64encode }}"}
          }]
        }
      }

- name: Escape ignition config for Proxmox args
  ansible.builtin.set_fact:
    # Proxmox parses "args" as a comma-separated list and requires literal commas
    # inside a single argument to be escaped by doubling them (",,"). We JSON-encode
    # and quote the ignition config, then replace "," with ",," to satisfy this
    # Proxmox API/CLI escaping requirement.
    coreos_ignition_config_escaped: "{{ coreos_ignition_config | to_json | quote | regex_replace(',', ',,') }}"

# -----------------------------------------------------------------------------
# VM Creation
# -----------------------------------------------------------------------------
- name: Create CoreOS VM on Proxmox
  community.general.proxmox_kvm:
    api_host: "{{ coreos_proxmox_api_host }}"
    api_user: "{{ coreos_proxmox_api_user }}"
    api_password: "{{ coreos_proxmox_api_password }}"
    node: "{{ coreos_proxmox_node_name }}"
    name: "{{ coreos_vm_name }}"
    cores: "{{ coreos_cores }}"
    memory: "{{ coreos_memory }}"
    ostype: "l26"
    onboot: true
    autostart: true
    net:
      net0: "virtio,bridge=vmbr0"
    state: present
    timeout: 600
    virtio:
      virtio0: "{{ coreos_proxmox_storage }}:0,import-from=/tmp/{{ coreos_qcow2_img_filename }},size={{ coreos_disk_size }}"
    boot: "order=virtio0"
    args: "-fw_cfg name=opt/com.coreos/config,string={{ coreos_ignition_config_escaped }}"
  register: coreos_vm_create

- name: Start CoreOS VM
  community.general.proxmox_kvm:
    api_host: "{{ coreos_proxmox_api_host }}"
    api_user: "{{ coreos_proxmox_api_user }}"
    api_password: "{{ coreos_proxmox_api_password }}"
    node: "{{ coreos_proxmox_node_name }}"
    vmid: "{{ coreos_vm_create.vmid }}"
    state: started

# -----------------------------------------------------------------------------
# Post-Creation: Get VM IP and wait for SSH
# -----------------------------------------------------------------------------
- name: Wait for VM to get IP address (DHCP mode)
  when: coreos_network_mode == "dhcp"
  block:
    - name: Wait for QEMU guest agent to report IP
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:8006/api2/json/nodes/{{ coreos_proxmox_node_name }}/qemu/{{ coreos_vm_create.vmid }}/agent/network-get-interfaces"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
        validate_certs: false
        status_code: [200, 500]
      register: coreos_vm_network
      until: >
        coreos_vm_network.status == 200 and
        coreos_vm_network.json.data.result | default([]) | selectattr('name', 'ne', 'lo') |
        map(attribute='ip-addresses') | flatten | selectattr('ip-address-type', 'eq', 'ipv4') | list | length > 0
      retries: 30
      delay: 10
      failed_when: false

    - name: Extract VM IP address
      ansible.builtin.set_fact:
        coreos_ip: "{{ (coreos_vm_network.json.data.result | selectattr('name', 'ne', 'lo') | map(attribute='ip-addresses') | flatten | selectattr('ip-address-type', 'eq', 'ipv4') | first)['ip-address'] }}"
      when: coreos_vm_network.status == 200

    - name: Display VM IP
      ansible.builtin.debug:
        msg: "CoreOS VM IP address: {{ coreos_ip }}"
      when: coreos_ip is defined

- name: Wait for SSH to be available
  ansible.builtin.wait_for:
    host: "{{ coreos_ip }}"
    port: 22
    delay: 5
    timeout: 300
    state: started
  when: coreos_ip is defined

- name: Add CoreOS VM to inventory
  ansible.builtin.add_host:
    name: "{{ coreos_ip }}"
    groups: coreos
    ansible_user: "{{ coreos_username }}"
    ansible_ssh_private_key_file: "{{ coreos_ssh_private_key_path }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  when: coreos_ip is defined

- name: Save coreos_ip for subsequent plays
  ansible.builtin.set_fact:
    coreos_ip: "{{ coreos_ip }}"
  delegate_to: localhost
  delegate_facts: true
  when: coreos_ip is defined
