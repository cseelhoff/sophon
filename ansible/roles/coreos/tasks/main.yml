---
# =============================================================================
# CoreOS VM Deployment on Proxmox
# =============================================================================

# -----------------------------------------------------------------------------
# Proxmox Authentication
# -----------------------------------------------------------------------------
- name: Obtain Proxmox API ticket
  ansible.builtin.uri:
    url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/access/ticket"
    method: POST
    body:
      username: "{{ coreos_proxmox_api_user }}"
      password: "{{ coreos_proxmox_api_password }}"
    body_format: form-urlencoded
    validate_certs: false
  register: coreos_pve_ticket

- name: Set authentication facts
  ansible.builtin.set_fact:
    coreos_pve_auth_cookie: "{{ coreos_pve_ticket.json.data.ticket }}"
    coreos_pve_csrf_token: "{{ coreos_pve_ticket.json.data.CSRFPreventionToken }}"

# -----------------------------------------------------------------------------
# CoreOS Image: Check if exists on Proxmox via API
# -----------------------------------------------------------------------------
- name: Check if CoreOS image already exists in Proxmox storage
  ansible.builtin.uri:
    url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/{{ coreos_image_storage }}/content"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
    validate_certs: false
  register: coreos_storage_content

- name: Set image exists fact
  ansible.builtin.set_fact:
    coreos_image_exists: "{{ coreos_storage_content.json.data | selectattr('volid', 'search', coreos_qcow2_iso_filename) | list | length > 0 }}"

- name: Display image status
  ansible.builtin.debug:
    msg: "{{ 'CoreOS image found in storage, skipping download' if coreos_image_exists else 'CoreOS image not found, will download' }}"

# -----------------------------------------------------------------------------
# CoreOS Image: Download (non-airgapped mode)
# -----------------------------------------------------------------------------
- name: Download and prepare CoreOS image
  when: not coreos_image_exists and not (coreos_airgapped_mode | default(false))
  block:
    - name: Attempt to download CoreOS image via Proxmox API
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/local/download-url"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
          CSRFPreventionToken: "{{ coreos_pve_csrf_token }}"
        body:
          content: "iso"
          filename: "{{ coreos_qcow2_img_filename }}"
          url: "{{ coreos_qcow2_url }}"
        body_format: json
        validate_certs: false
        status_code: [200, 500]
      register: coreos_download_attempt
      failed_when: false

    - name: Display SSH instructions if API download not available
      ansible.builtin.fail:
        msg: |

          ============================================================================
          MANUAL STEP REQUIRED: CoreOS Image Download
          ============================================================================

          The Proxmox API cannot directly download and extract QCOW2 images.
          Please run ONE of the following commands on your Proxmox server:

          Option 1 - SSH (if SSH access is available):
          ----------------------------------------------------------------------------
          ssh {{ coreos_proxmox_api_username }}@{{ coreos_proxmox_api_host }} \
            'cd {{ coreos_image_storage_path }} && \
            curl -LO {{ coreos_qcow2_url }} && \
            xz -d {{ coreos_qcow2_xz_filename }} && \
            ln {{ coreos_qcow2_img_filename }} {{ coreos_qcow2_iso_filename }}'

          Option 2 - Console (run directly on Proxmox shell):
          ----------------------------------------------------------------------------
          cd {{ coreos_image_storage_path }} && \
            curl -LO {{ coreos_qcow2_url }} && \
            xz -d {{ coreos_qcow2_xz_filename }} && \
            ln {{ coreos_qcow2_img_filename }} {{ coreos_qcow2_iso_filename }}

          The hardlink (.iso) makes the image visible in Proxmox GUI.
          Deleting the .iso from GUI removes both files when done.

          After the download completes, re-run this playbook.
          ============================================================================
      when: coreos_download_attempt.status != 200

    - name: Wait for download task to complete
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/{{ coreos_image_storage }}/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
        validate_certs: false
      register: coreos_download_check
      until: coreos_download_check.json.data | selectattr('volid', 'search', coreos_qcow2_iso_filename) | list | length > 0
      retries: 60
      delay: 10
      when: coreos_download_attempt.status == 200

# -----------------------------------------------------------------------------
# CoreOS Image: Air-gapped mode (HTTP file server)
# -----------------------------------------------------------------------------
- name: Prepare image via HTTP file server (air-gapped mode)
  when: not coreos_image_exists and (coreos_airgapped_mode | default(false))
  block:
    - name: Get local IP for HTTP server
      ansible.builtin.set_fact:
        coreos_local_ip: "{{ coreos_controller_ip }}"

    - name: Include HTTP file server role
      ansible.builtin.include_role:
        name: http_file_server
      vars:
        http_file_server_port: "{{ coreos_http_file_server_port }}"
        http_file_server_local_download_dir: "{{ coreos_local_download_dir }}"
        http_file_server_local_filename: "{{ coreos_qcow2_img_filename }}"
        http_file_server_download_url: "{{ coreos_qcow2_url }}"
        http_file_server_download_filename: "{{ coreos_qcow2_xz_filename }}"
        http_file_server_extracted_filename: "{{ coreos_qcow2_img_filename }}"
        http_file_server_renamed_filename: "{{ coreos_qcow2_img_filename }}"

    - name: Trigger Proxmox to download from local HTTP server
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/{{ coreos_image_storage }}/download-url"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
          CSRFPreventionToken: "{{ coreos_pve_csrf_token }}"
        body:
          content: "iso"
          filename: "{{ coreos_qcow2_iso_filename }}"
          url: "http://{{ coreos_local_ip }}:{{ coreos_http_file_server_port }}/{{ coreos_qcow2_img_filename }}"
        body_format: json
        validate_certs: false
      register: coreos_local_download

    - name: Wait for local download to complete
      ansible.builtin.uri:
        url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/nodes/{{ coreos_proxmox_node_name }}/storage/{{ coreos_image_storage }}/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
        validate_certs: false
      register: coreos_local_download_check
      until: coreos_local_download_check.json.data | selectattr('volid', 'search', coreos_qcow2_iso_filename) | list | length > 0
      retries: 30
      delay: 10

# -----------------------------------------------------------------------------
# Ignition Configuration (via Butane)
# -----------------------------------------------------------------------------
# Download qemu-guest-agent RPM and base64 encode it
- name: Ensure local cache directory exists
  ansible.builtin.file:
    path: "{{ coreos_local_cache_dir }}"
    state: directory
    mode: "0755"

- name: Download qemu-guest-agent RPM
  ansible.builtin.get_url:
    url: "{{ coreos_qemu_guest_agent_rpm_url }}"
    dest: "{{ coreos_local_cache_dir }}/{{ coreos_qemu_guest_agent_rpm_filename }}"
    mode: "0644"
  register: coreos_qga_download

- name: Base64 encode qemu-guest-agent RPM
  ansible.builtin.shell:
    cmd: "base64 -w0 {{ coreos_local_cache_dir }}/{{ coreos_qemu_guest_agent_rpm_filename }}"
  register: coreos_qga_b64_result
  changed_when: false

- name: Set qemu-guest-agent base64 fact
  ansible.builtin.set_fact:
    coreos_qemu_guest_agent_rpm_b64: "{{ coreos_qga_b64_result.stdout }}"

# Generate Butane config from template
- name: Generate Butane config
  ansible.builtin.template:
    src: coreos.bu.j2
    dest: "{{ coreos_local_cache_dir }}/coreos.bu"
    mode: "0644"

# Convert Butane to Ignition JSON
- name: Convert Butane to Ignition
  ansible.builtin.command:
    cmd: "butane --strict {{ coreos_local_cache_dir }}/coreos.bu"
  register: coreos_ignition_result
  changed_when: false

- name: Set ignition JSON fact
  ansible.builtin.set_fact:
    coreos_ignition_json: "{{ coreos_ignition_result.stdout }}"

# Base64 encode and wrap for fw_cfg escaping
- name: Base64 encode the ignition config
  ansible.builtin.set_fact:
    coreos_ignition_b64: "{{ coreos_ignition_json | b64encode }}"

- name: Create wrapper ignition config that merges the base64 config
  ansible.builtin.set_fact:
    coreos_wrapper_config:
      ignition:
        version: "3.4.0"
        config:
          merge:
            - source: "data:;base64,{{ coreos_ignition_b64 }}"

- name: Convert wrapper to compact JSON (no spaces)
  ansible.builtin.set_fact:
    coreos_wrapper_json: "{{ coreos_wrapper_config | to_json | regex_replace(': ', ':') | regex_replace(', ', ',') }}"

# -----------------------------------------------------------------------------
# VM Creation
# -----------------------------------------------------------------------------
- name: Check if VM with same name already exists
  ansible.builtin.uri:
    url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
    validate_certs: false
  register: coreos_existing_vms

- name: Set existing VM fact
  ansible.builtin.set_fact:
    coreos_existing_vm: "{{ coreos_existing_vms.json.data | selectattr('name', 'eq', coreos_vm_name) | list | first | default(none) }}"

- name: Display existing VM info
  ansible.builtin.debug:
    msg: "Found existing VM '{{ coreos_vm_name }}' with VMID {{ coreos_existing_vm.vmid }}"
  when: coreos_existing_vm is not none

- name: Create CoreOS VM on Proxmox
  community.proxmox.proxmox_kvm:
    api_host: "{{ coreos_proxmox_api_host }}"
    api_port: "{{ coreos_proxmox_api_port }}"
    api_user: "{{ coreos_proxmox_api_user }}"
    api_password: "{{ coreos_proxmox_api_password }}"
    node: "{{ coreos_proxmox_node_name }}"
    name: "{{ coreos_vm_name }}"
    cores: "{{ coreos_cores }}"
    memory: "{{ coreos_memory }}"
    ostype: "l26"
    onboot: true
    autostart: true
    agent: "enabled=1"
    net:
      net0: "virtio,bridge=vmbr0"
    state: present
    timeout: 600
    virtio:
      virtio0: "{{ coreos_proxmox_storage }}:0,import-from={{ coreos_image_storage_path }}/{{ coreos_qcow2_img_filename }},size={{ coreos_disk_size }}"
    boot: "order=virtio0"
  register: coreos_vm_create
  when: coreos_existing_vm is none

- name: Use existing VM ID if VM already exists
  ansible.builtin.set_fact:
    coreos_vm_create:
      vmid: "{{ coreos_existing_vm.vmid }}"
  when: coreos_existing_vm is not none

# Set args via direct API call to bypass Ansible module escaping issues
# Only commas INSIDE the JSON string value need to be doubled, not the fw_cfg separator comma
- name: Escape quotes in wrapper JSON
  ansible.builtin.set_fact:
    coreos_wrapper_quoted: "{{ coreos_wrapper_json | regex_replace('\"', '\\\\\"') }}"

- name: Double commas inside the JSON value only
  ansible.builtin.set_fact:
    coreos_json_escaped: "{{ coreos_wrapper_quoted | regex_replace(',', ',,') }}"

- name: Build args string (single comma for fw_cfg separator, doubled commas in JSON)
  ansible.builtin.set_fact:
    coreos_args_escaped: "-fw_cfg name=opt/com.coreos/config,string={{ coreos_json_escaped }}"

- name: Set VM args via Proxmox API
  ansible.builtin.uri:
    url: "https://{{ coreos_proxmox_api_host }}:{{ coreos_proxmox_api_port }}/api2/json/nodes/{{ coreos_proxmox_node_name }}/qemu/{{ coreos_vm_create.vmid }}/config"
    method: PUT
    headers:
      Cookie: "PVEAuthCookie={{ coreos_pve_auth_cookie }}"
      CSRFPreventionToken: "{{ coreos_pve_csrf_token }}"
    body:
      args: "{{ coreos_args_escaped }}"
    body_format: form-urlencoded
    validate_certs: false

- name: Start CoreOS VM
  community.proxmox.proxmox_kvm:
    api_host: "{{ coreos_proxmox_api_host }}"
    api_port: "{{ coreos_proxmox_api_port }}"
    api_user: "{{ coreos_proxmox_api_user }}"
    api_password: "{{ coreos_proxmox_api_password }}"
    node: "{{ coreos_proxmox_node_name }}"
    vmid: "{{ coreos_vm_create.vmid }}"
    state: started

# -----------------------------------------------------------------------------
# Post-Creation: Get VM IP and wait for Serial
# -----------------------------------------------------------------------------

- name: Run uptime on VM/container
  proxmox_shell:
    api_host: "{{ coreos_proxmox_api_host }}"
    api_port: "{{ coreos_proxmox_api_port }}"
    node: "{{ coreos_proxmox_node_name }}"
    vmid: "{{ coreos_vm_create.vmid }}"
    vmtype: "{{ coreos_vm_type }}"
    vm_user: "{{ coreos_vm_user | default('root') }}"
    vm_password: "{{ coreos_vm_password | default(omit) }}"
    pve_auth_cookie: "{{ coreos_pve_auth_cookie }}"
    pve_csrf_token: "{{ coreos_pve_csrf_token }}"
    command: uptime
  register: vm_result
