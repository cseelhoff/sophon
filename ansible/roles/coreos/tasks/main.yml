---
# Find the IP address that Proxmox can reach
- name: Get local IP address
  set_fact:
    local_ip: "{{ ansible_default_ipv4.address }}"    
    # if running WSL2
    # netsh interface portproxy add v4tov4 listenport=8000 listenaddress=0.0.0.0 connectport=8000 connectaddress=172.22.33.97
    # netsh advfirewall firewall add rule name="Allow TCP Port 8000" dir=in action=allow protocol=TCP localport=8000
    # TURN OFF WHEN DONE:
    # netsh interface portproxy delete v4tov4 listenport=8000 listenaddress=0.0.0.0
    # netsh interface portproxy show all
    # local_ip: "10.0.3.123"

# Prepare local download cache directory
- name: Host CoreOS qcow2 image {{ coreos_qcow2_img_filename }} via HTTP file server
  include_role:
    name: http_file_server
  vars:
    file_to_serve: "{{ coreos_qcow2_img_filename }}"
    server_port: "{{ http_file_server_port }}"
    local_filename: "{{ coreos_qcow2_img_filename }}"
    file_download_url: "{{ coreos_qcow2_url }}"
    file_download_filename: "{{ coreos_qcow2_xz_filename }}"
    extracted_filename: "{{ coreos_qcow2_final_filename }}"
    renamed_filename: "{{ coreos_qcow2_img_filename }}"
    # http_file_server_port: "{{ http_file_server_port }}"
  # when: not core_qcow_exists or wrong_size_file

- name: Ensure SSH key exists
  ansible.builtin.command:
    cmd: "ssh-keygen -t rsa -b 4096 -f {{ ssh_private_key_path }} -N ''"
  args:
    creates: "{{ ssh_public_key_path }}"

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_public_key_path }}"
  register: ssh_key

- name: Check for Proxmox API password in environment
  set_fact:
    proxmox_api_password: "{{ lookup('env', 'PROXMOX_API_PASSWORD') }}"
  when: lookup('env', 'PROXMOX_API_PASSWORD') != ""

- name: Prompt for Proxmox API password if not set
  pause:
    prompt: "Please enter the Proxmox password"
    echo: no
  register: proxmox_api_password_prompt
  when: proxmox_api_password is not defined or proxmox_api_password == ""

- name: Set Proxmox API password from prompt
  set_fact:
    proxmox_api_password: "{{ proxmox_api_password_prompt.user_input }}"
  when: proxmox_api_password_prompt is defined and proxmox_api_password_prompt.user_input is defined

- name: Obtain Proxmox API ticket
  uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/access/ticket"
    method: POST
    body:
      username: "{{ proxmox_api_user }}"
      password: "{{ proxmox_api_password }}"
    body_format: form-urlencoded
    validate_certs: false
  register: pve_ticket
  
- name: Set authentication cookies and CSRF token
  set_fact:
    pve_auth_cookie: "{{ pve_ticket.json.data.ticket }}"
    pve_csrf_token: "{{ pve_ticket.json.data.CSRFPreventionToken }}"

