---
# Portainer Role Tasks

- name: Check if portainer is installed
  ansible.builtin.raw: podman images -q docker.io/portainer/portainer-ce:latest
  register: portainer_image_check
  # changed_when: false

- name: Download and load portainer image from HTTP file server
  ansible.builtin.raw: |
    cd /tmp &&
    curl -o portainer-ce.tar http://{{ http_file_server_ip }}:{{ http_file_server_port }}/portainer-ce.tar &&
    podman load -i portainer-ce.tar &&
    rm -f portainer-ce.tar
  when: portainer_image_check.stdout | trim == ""

- name: Check if portainer service exists
  ansible.builtin.raw: test -f /etc/systemd/system/portainer.service && echo "exists" || echo "not found"
  register: portainer_service_check
  # changed_when: false

- name: Set initial admin password from environment if available
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ lookup('env', 'PORTAINER_ADMIN_PASSWORD') }}"
  when: lookup('env', 'PORTAINER_ADMIN_PASSWORD') | default('') != ""

- name: Prompt for admin password if not set from environment
  ansible.builtin.pause:
    prompt: "Please enter the Portainer admin password"
    echo: false
  register: portainer_password_prompt
  when: portainer_admin_password is not defined or portainer_admin_password == ""

- name: Set final admin password
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ portainer_password_prompt.user_input | default(portainer_admin_password) }}"
  when: portainer_password_prompt is defined and portainer_password_prompt.user_input is defined

- name: Create bcrypt password for portainer admin
  ansible.builtin.shell:
    cmd: "set -o pipefail && htpasswd -bnB admin {{ portainer_admin_password }} | cut -d ':' -f 2 | sed -e 's/\\$/\\$\\$/g'"
    executable: /bin/bash
  register: portainer_admin_password_bcrypt
  changed_when: false
  delegate_to: localhost
  when: portainer_service_check.stdout | trim == "not found"

- name: Enable and start podman.socket
  ansible.builtin.raw: systemctl enable --now podman.socket
  become: true
  when: portainer_service_check.stdout | trim == "not found"

- name: Create portainer systemd service file
  ansible.builtin.raw: |
    cat > /etc/systemd/system/portainer.service << 'EOF'
    EOF
    chmod 644 /etc/systemd/system/portainer.service
  when: portainer_service_check.stdout | trim == "not found"
  become: true
  delegate_to: "{{ coreos_ip }}"

- name: Reload systemd daemon
  ansible.builtin.raw: systemctl daemon-reload
  when: portainer_service_check.stdout | trim == "not found"
  become: true
  delegate_to: "{{ coreos_ip }}"

- name: Start portainer and set to autostart
  ansible.builtin.raw: systemctl enable --now portainer
  register: portainer_start
  become: true
  delegate_to: "{{ coreos_ip }}"
