---
# Molecule base configuration for Sophon roles
# Individual role tests extend this with role-specific settings

dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-fedora39-ansible:latest
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Core settings
        domain_name: sophon.test
        traefik_domain: sophon.test
        coreos_ip: localhost
        timezone: UTC

        # Service directories
        docker_home: /tmp/sophon/docker

        # Portainer settings
        portainer_port: 9443
        validate_certs: false

        # HTTP file server (disabled for molecule tests)
        http_file_server_ip: localhost
        http_file_server_port: 8000
  playbooks:
    prepare: ../../../../tests/molecule/resources/playbooks/prepare.yml
    converge: ../../../../tests/molecule/resources/playbooks/converge.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
