---
# Sophon Infrastructure Master Playbook
# Deploys all services in the correct order
#
# Quick Start:
#   cd ansible && ansible-playbook -i inventories/development/inventory.yml site.yml
#   (You will be prompted for Proxmox host, domain name, and password if not configured)
#
# With explicit parameters (for scripting/CI):
#   ansible-playbook -i inventories/development/inventory.yml site.yml \
#     -e coreos_proxmox_api_host=pve.example.com \
#     -e domain_name=homelab.local \
#     -e coreos_proxmox_api_password=secret
#
# Deploy specific services:
#   ansible-playbook -i inventories/development/inventory.yml site.yml --tags "traefik,homepage"

- name: Gather Required Variables
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Load from environment or CLI
      ansible.builtin.set_fact:
        coreos_proxmox_api_host: "{{ coreos_proxmox_api_host | default(lookup('env', 'PROXMOX_HOST')) | default('', true) }}"
        domain_name: "{{ domain_name | default(lookup('env', 'DOMAIN_NAME')) | default('', true) }}"
        coreos_proxmox_api_password: "{{ coreos_proxmox_api_password | default(lookup('env', 'PROXMOX_PASSWORD')) | default('', true) }}"

    - name: Prompt for missing Proxmox host
      ansible.builtin.pause:
        prompt: "Proxmox API host"
      register: _ph
      when: coreos_proxmox_api_host == ""

    - name: Prompt for missing domain
      ansible.builtin.pause:
        prompt: "Domain name"
      register: _dn
      when: domain_name == ""

    - name: Prompt for missing password
      ansible.builtin.pause:
        prompt: "Proxmox password"
        echo: false
      register: _pp
      when: coreos_proxmox_api_password == ""

    - name: Set prompted values
      ansible.builtin.set_fact:
        coreos_proxmox_api_host: "{{ _ph.user_input | default(coreos_proxmox_api_host, true) }}"
        domain_name: "{{ _dn.user_input | default(domain_name, true) }}"
        coreos_proxmox_api_password: "{{ _pp.user_input | default(coreos_proxmox_api_password, true) }}"

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - coreos_proxmox_api_host is defined and coreos_proxmox_api_host | length > 0
          - domain_name is defined and domain_name | length > 0
          - coreos_proxmox_api_password is defined and coreos_proxmox_api_password | length > 0
        fail_msg: |
          Missing required variables. Provide via:
          - Interactive prompt (run playbook without -e flags)
          - Command line: -e coreos_proxmox_api_host=... -e domain_name=... -e coreos_proxmox_api_password=...
          - Inventory group_vars/all.yml or vault.yml

- name: Deploy CoreOS VM
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [coreos, infrastructure]
  roles:
    - coreos

- name: Deploy Portainer
  hosts: coreos
  gather_facts: false
  tags: [portainer, infrastructure]
  roles:
    - portainer

- name: Deploy CoreDNS
  hosts: coreos
  gather_facts: false
  tags: [coredns, dns, infrastructure]
  roles:
    - coredns

- name: Deploy Traefik
  hosts: coreos
  gather_facts: false
  tags: [traefik, proxy, infrastructure]
  roles:
