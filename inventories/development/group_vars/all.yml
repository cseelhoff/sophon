---
# =============================================================================
# Sophon Development Environment Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Ansible Configuration
# -----------------------------------------------------------------------------
# Explicitly set Python interpreter to avoid discovery warnings (Nix flake provides consistent Python)
ansible_python_interpreter: python3

# -----------------------------------------------------------------------------
# Proxmox Configuration
# -----------------------------------------------------------------------------
proxmox_host: "10.20.177.99"
proxmox_user: "root@pam"
# proxmox_password: "" # Set via environment or vault

# -----------------------------------------------------------------------------
# CoreOS VM Configuration
# -----------------------------------------------------------------------------
coreos_ip: "10.20.177.111"
coreos_cidr: "24"
coreos_gateway: "10.20.177.1"
coreos_username: "admin"
ssh_private_key_path: "~/.ssh/id_rsa"

# -----------------------------------------------------------------------------
# HTTP File Server (for air-gapped image distribution)
# -----------------------------------------------------------------------------
# http_file_server_ip is set dynamically by the coreos role from localhost facts
http_file_server_port: 8000

# -----------------------------------------------------------------------------
# Domain Configuration
# -----------------------------------------------------------------------------
domain_name: "sophon.local"
traefik_domain: "{{ domain_name }}"

# -----------------------------------------------------------------------------
# Portainer Configuration
# -----------------------------------------------------------------------------
portainer_port: 9443
# portainer_admin_password: "" # Set via environment or vault

# -----------------------------------------------------------------------------
# Service Ports
# -----------------------------------------------------------------------------
coredns_dns_port: 53
traefik_port_http: 80
traefik_port_https: 443
traefik_port_ui: 8080
homepage_port: 3000
gitea_port_http: 3001
gitea_port_ssh: 222
guacamole_port: 8090
nexus_port: 8081
keycloak_port: 8082
nextcloud_port: 8083
n8n_port: 5678

# -----------------------------------------------------------------------------
# TLS/ACME Configuration
# -----------------------------------------------------------------------------
traefik_acme_email: "admin@{{ domain_name }}"
traefik_dns_provider: "cloudflare"
# traefik_cf_dns_api_token: "" # Set via environment or vault

# -----------------------------------------------------------------------------
# NFS Storage Configuration
# -----------------------------------------------------------------------------
# NFS server for shared storage (container images, RPMs, nexus blob store, etc.)
nfs_server_ip: "10.1.1.35"
# Path on NFS server for docker images (used as Nexus docker proxy blob store backend)
nfs_docker_images_path: "/exports/nexus/docker-proxy"
# Path on NFS server for RPM packages (used as Nexus yum proxy blob store backend)
nfs_rpm_packages_path: "/exports/nexus/yum-proxy"

# -----------------------------------------------------------------------------
# Validate Certs (set false for self-signed)
# -----------------------------------------------------------------------------
validate_certs: false
