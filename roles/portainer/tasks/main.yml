---
# =============================================================================
# Portainer Role Tasks
# =============================================================================
# The CoreOS VM is created by the coreos_base dependency (see meta/main.yml).
# Portainer container is deployed at boot via systemd in the Butane config.
# This role waits for Portainer and initializes admin password via API.

- name: Generate Portainer admin password
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  when: portainer_admin_password is not defined

- name: Validate Portainer password meets requirements
  ansible.builtin.assert:
    that:
      - portainer_admin_password | length >= 12
    fail_msg: "Portainer requires password of at least 12 characters. Got {{ portainer_admin_password | length }}."

- name: Wait for Portainer API to be ready
  ansible.builtin.uri:
    url: "https://{{ coreos_base_ip }}:{{ portainer_port }}/api/status"
    method: GET
    validate_certs: false
    status_code: 200
  register: portainer_status
  until: portainer_status.status == 200
  retries: 60
  delay: 3

- name: Initialize Portainer admin user
  ansible.builtin.uri:
    url: "https://{{ coreos_base_ip }}:{{ portainer_port }}/api/users/admin/init"
    method: POST
    validate_certs: false
    body_format: json
    body:
      Username: admin
      Password: "{{ portainer_admin_password }}"
    status_code: [200, 409]
  register: portainer_init

- name: Warn if admin already exists and password was auto-generated
  ansible.builtin.debug:
    msg: "WARNING: Admin already exists. If auth fails, set -e portainer_admin_password=<existing_password>"
  when: portainer_init.status == 409

- name: Display Portainer access info
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      Portainer Deployed Successfully
      ═══════════════════════════════════════════════════════════════════
      
      URL: https://{{ coreos_base_ip }}:{{ portainer_port }}
      Version: {{ portainer_status.json.Version }}
      
      Credentials:
        Username: admin
        Password: {{ portainer_admin_password }}
        {{ '(existing admin - password unchanged)' if portainer_init.status == 409 else '' }}
      
      VM ID: {{ coreos_base_vmid }}
      
      ═══════════════════════════════════════════════════════════════════
