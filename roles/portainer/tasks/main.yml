---
# Portainer Role Tasks
# Portainer is deployed at boot via systemd (defined in CoreOS Butane config)
# This role just verifies it's running and displays access info

- name: Wait for Portainer to be accessible
  ansible.builtin.uri:
    url: "https://{{ coreos_ip }}:{{ portainer_port }}/api/status"
    method: GET
    validate_certs: false
    status_code: [200, 401, 404]
  register: portainer_status
  retries: 30
  delay: 10
  until: portainer_status.status in [200, 401, 404]
  failed_when: false

- name: Check Portainer status
  ansible.builtin.debug:
    msg: "Portainer is running and accessible at https://{{ coreos_ip }}:{{ portainer_port }}"
  when: portainer_status.status in [200, 401]

- name: Warn if Portainer not accessible
  ansible.builtin.debug:
    msg: "Warning: Portainer may not be running yet. Check VM status."
  when: portainer_status.status not in [200, 401]

- name: Display Portainer access info
  ansible.builtin.debug:
    msg: |
      ============================================
      Portainer is available at:
      https://{{ coreos_ip }}:{{ portainer_port }}
      
      First-time setup:
      Create your admin account on first access.
      ============================================
  when: portainer_status.status in [200, 401]
