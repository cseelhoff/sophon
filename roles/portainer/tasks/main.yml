---
# Portainer Role Tasks
# Portainer is deployed at boot via systemd (defined in CoreOS Butane config)
# This role waits for Portainer and initializes admin password via direct API calls
# (QGA network calls are blocked by permissions)

- name: Generate Portainer admin password
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  when: portainer_admin_password is not defined

- name: Wait for Portainer API to be ready
  ansible.builtin.uri:
    url: "https://{{ coreos_ip }}:{{ portainer_port }}/api/status"
    method: GET
    validate_certs: false
    status_code: 200
  register: portainer_status
  until: portainer_status.status == 200
  retries: 60
  delay: 3

- name: Show Portainer version
  ansible.builtin.debug:
    msg: "Portainer version: {{ portainer_status.json.Version }}"

- name: Initialize Portainer admin user
  ansible.builtin.uri:
    url: "https://{{ coreos_ip }}:{{ portainer_port }}/api/users/admin/init"
    method: POST
    validate_certs: false
    body_format: json
    body:
      Username: admin
      Password: "{{ portainer_admin_password }}"
    status_code: [200, 409]
  register: portainer_init

- name: Display admin init result
  ansible.builtin.debug:
    msg: "{{ portainer_init.json | default('Admin already initialized') }}"

- name: Display Portainer access info
  ansible.builtin.debug:
    msg: |
      ============================================
      Portainer is available at:
      https://{{ coreos_ip }}:{{ portainer_port }}

      Admin credentials:
      Username: admin
      Password: {{ portainer_admin_password }}
      ============================================
