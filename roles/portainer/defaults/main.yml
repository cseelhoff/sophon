---
# =============================================================================
# Portainer Role - CoreOS VM running Portainer
# =============================================================================
# This role creates a CoreOS VM and deploys Portainer container.
# Depends on: coreos_base role (via meta/main.yml)

# Enable/disable this role
portainer_enabled: true

# =============================================================================
# VM Configuration (passed to coreos_base)
# =============================================================================
coreos_base_vm_name: "sophon-portainer"
coreos_base_cores: 2
coreos_base_memory: 4096
coreos_base_disk_size: "32G"

# Network (required - prompted if not set)
# coreos_base_ip: "10.0.1.10"
# coreos_base_gateway: "10.0.1.1"
coreos_base_cidr: "24"

# User Configuration
coreos_base_username: "admin"
# Default password hash for 'admin' user (password: changeme)
# Generate new hash with: mkpasswd --method=yescrypt 'yourpassword'
coreos_base_password_hash: "$y$j9T$wf0/OmORycv3Xxlk9UeqM1$mgpcsOS5y9GPMgHfDxrpDoimDMM9wuIY4efuYmvRcqA"

# Butane template location (for coreos_base)
coreos_base_butane_template: "{{ role_path }}/templates/portainer.bu.j2"

# =============================================================================
# Portainer Application Settings
# =============================================================================
portainer_image_tag: "2.27.1"
portainer_port: 9443

# Container image settings
portainer_image: "docker.io/portainer/portainer-ce"
portainer_image_tar: "portainer-ce-{{ portainer_image_tag }}.tar"
portainer_local_cache_dir: "/tmp/sophon_cache"

# =============================================================================
# NFS-based Container Images (loaded at boot from NFS share)
# =============================================================================
# NFS mount point on CoreOS for docker images
portainer_nfs_docker_mount_point: "/mnt/nfs/docker-images"
# NFS mount point on CoreOS for RPM packages
portainer_nfs_rpm_mount_point: "/mnt/nfs/rpm-packages"
# NFS mount options
portainer_nfs_mount_options: "ro,noatime,vers=4.1"

# =============================================================================
# QEMU Guest Agent RPMs (loaded from NFS at boot)
# =============================================================================
portainer_qemu_guest_agent_rpm_filename: "qemu-guest-agent-10.1.3-1.fc43.x86_64.rpm"
portainer_liburing_rpm_filename: "liburing-2.9-2.fc43.x86_64.rpm"

# =============================================================================
# Container Images to Pre-load from NFS (air-gapped mode)
# =============================================================================
portainer_container_images:
  - name: "portainer/portainer-ce"
    tag: "2.27.1"
    tar_filename: "portainer-ce.tar"
  - name: "coredns/coredns"
    tag: "1.12.0"
    tar_filename: "coredns.tar"
  - name: "traefik"
    tag: "v3.2"
    tar_filename: "traefik.tar"
  - name: "osixia/openldap"
    tag: "1.5.0"
    tar_filename: "openldap.tar"
  - name: "osixia/phpldapadmin"
    tag: "0.9.0"
    tar_filename: "phpldapadmin.tar"
  - name: "sonatype/nexus3"
    tag: "3.72.0"
    tar_filename: "nexus3.tar"
