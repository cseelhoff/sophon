---
- name: Deploy Gitea Compose stack
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_name: "gitea"
    compose_stack_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    compose_stack_image_tars: "{{ gitea_image_tars }}"
    compose_stack_deploy_timeout: 300

- name: Wait for Gitea initialization to finish
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
      - container
      - inspect
      - --format
      - "{{ '{{.State.Status}} {{.State.ExitCode}}' }}"
      - gitea-init
  register: gitea_init_inspect
  changed_when: false
  failed_when: false
  until: >-
    gitea_init_inspect.rc == 0 and
    (gitea_init_inspect.stdout | trim).split(' ')[0] in ['exited', 'dead']
  retries: 60
  delay: 5
  no_log: true

- name: Require successful Gitea initialization
  ansible.builtin.assert:
    that:
      - gitea_init_inspect.rc == 0
      - (gitea_init_inspect.stdout | trim) == 'exited 0'
    fail_msg: >-
      Gitea initialization failed ({{ gitea_init_inspect.stdout | default('missing') | trim }}).
      Check the gitea-init container logs in Arcane or via podman logs gitea-init, correct the failure,
      and re-run service deployment.

- name: Display Gitea status
  ansible.builtin.debug:
    msg: |
      Gitea deployed at {{ gitea_root_url }}
      Admin user:     {{ gitea_admin_user }}
      Admin password: {{ gitea_admin_password }}
      OIDC SSO:       {{ 'enabled (Keycloak)' if gitea_oauth_enabled else 'disabled' }}
