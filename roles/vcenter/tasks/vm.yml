---
- name: Resolve optional InfraVM secrets ISO
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ explicit_secrets_iso_path }}"
    - "{{ secrets_iso_default_path }}"
  when: item | length > 0 and (item == explicit_secrets_iso_path or (attach_secrets_iso | bool))
  register: infravm_secret_candidates

- name: Require explicit secrets ISO when SOPHON_SECRETS_ISO was supplied
  ansible.builtin.assert:
    that: infravm_secret_candidates.results[0].stat.exists | default(false)
    fail_msg: "SOPHON_SECRETS_ISO was set to '{{ explicit_secrets_iso_path }}', but that file does not exist."
  when: explicit_secrets_iso_path | length > 0

- name: Provision a blank InfraVM with immutable ISOs on vCenter
  vcenter_vm:
    url: "{{ vcenter_url }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    ca_file: "{{ vcenter_ca_file }}"
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
    datastore: "{{ vcenter_datastore }}"
    network: "{{ vcenter_network }}"
    folder: "{{ vcenter_folder }}"
    name: "{{ infravm_vm_name }}"
    cores: "{{ infravm_cores }}"
    memory: "{{ infravm_memory }}"
    disk_gb: "{{ infravm_disk_gb }}"
    coreos_iso: "{{ installer_iso_path }}"
    bundle_iso: "{{ bundle_iso_path }}"
    secrets_iso: >-
      {{ (infravm_secret_candidates.results
          | selectattr('stat', 'defined')
          | selectattr('stat.exists', 'equalto', true)
          | map(attribute='stat.path')
          | list
          | first) | default('') }}
  register: infravm_vcenter

- name: Show the selected vCenter VM
  ansible.builtin.debug:
    msg: "Continue in the hypervisor console for {{ infravm_vcenter.vm_path }}."
