---
- name: Hot-insert secrets ISO on vCenter VM
  vcenter_vm:
    action: mount_secrets
    url: "{{ vcenter_url }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    ca_file: "{{ vcenter_ca_file }}"
    datacenter: "{{ vcenter_datacenter }}"
    datastore: "{{ vcenter_datastore }}"
    folder: "{{ vcenter_folder }}"
    name: "{{ mount_secrets_vm_name }}"
    marker: "{{ mount_secrets_vm_marker }}"
    secrets_iso: "{{ mount_secrets_iso_path }}"
