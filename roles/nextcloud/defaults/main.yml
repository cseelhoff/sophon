---
# Nextcloud configuration
nextcloud_enabled: false  # TODO: Rewrite to use portainer_stack
nextcloud_image_name: "nextcloud"
nextcloud_image_tag: "29"

# Database
nextcloud_db_image_name: "postgres"
nextcloud_db_image_tag: "16-alpine"

# Directories
nextcloud_data_dir: "/opt/nextcloud"

# Network
nextcloud_port: 8082

# Domain
nextcloud_hostname: "cloud"
nextcloud_domain: "{{ traefik_domain | default('example.local') }}"

# Database credentials (set via vault in production)
nextcloud_db_name: "nextcloud"
nextcloud_db_user: "nextcloud"
# nextcloud_db_password: ""
# nextcloud_db_root_password: ""

# Admin credentials (set via vault in production)
# nextcloud_admin_user: "admin"
# nextcloud_admin_password: ""

# Trusted domains
nextcloud_trusted_domains: "{{ nextcloud_hostname }}.{{ nextcloud_domain }}"

# LDAP integration
nextcloud_ldap_enabled: false

# Keycloak OIDC integration
nextcloud_oidc_enabled: false
# nextcloud_oidc_client_id: "nextcloud"
# nextcloud_oidc_client_secret: "{{ vault_keycloak_nextcloud_client_secret }}"
# nextcloud_oidc_provider_url: "https://keycloak.{{ domain_name }}/realms/{{ keycloak_realm }}"
