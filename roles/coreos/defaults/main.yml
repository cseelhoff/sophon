---
# Enable/disable this role
coreos_enabled: true

# =============================================================================
# CoreOS VM Configuration
# =============================================================================
coreos_vm_name: "sophon-coreos"
coreos_vm_type: "qemu"
coreos_cores: 2
coreos_memory: 4096
coreos_disk_size: "32G"
coreos_username: "admin"
# Default password hash for 'admin' user (password: changeme)
# Generate new hash with: mkpasswd --method=yescrypt 'yourpassword'
coreos_password_hash: "$y$j9T$wf0/OmORycv3Xxlk9UeqM1$mgpcsOS5y9GPMgHfDxrpDoimDMM9wuIY4efuYmvRcqA"

# Network (static IP required - prompted if not set):
# coreos_ip: "10.0.1.10"
coreos_cidr: "24"
# coreos_gateway: "10.0.1.1"

# =============================================================================
# CoreOS Image
# =============================================================================
coreos_qcow2_url: "https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/43.20251214.3.0/x86_64/fedora-coreos-43.20251214.3.0-qemu.x86_64.qcow2.xz"
coreos_qcow2_xz_filename: "{{ coreos_qcow2_url | basename }}"
coreos_qcow2_img_filename: "{{ coreos_qcow2_xz_filename | regex_replace('\\.xz$', '') }}"
# Hardlink with .iso extension so it appears in Proxmox GUI ISO list
coreos_qcow2_iso_filename: "{{ coreos_qcow2_img_filename }}.iso"

# Proxmox storage for the CoreOS image (ISO storage is queryable via API)
coreos_image_storage: "local"
coreos_image_storage_path: "/var/lib/vz/template/iso"

# =============================================================================
# QEMU Guest Agent RPMs (loaded from NFS at boot)
# =============================================================================
# RPM filenames to install from NFS share (qemu-guest-agent and dependencies)
# These should be pre-staged on the NFS server at {{ nfs_rpm_packages_path }}
coreos_qemu_guest_agent_rpm_filename: "qemu-guest-agent-10.1.3-1.fc43.x86_64.rpm"
coreos_liburing_rpm_filename: "liburing-2.9-2.fc43.x86_64.rpm"
coreos_local_cache_dir: "/tmp/sophon_cache"

# =============================================================================
# NFS-based Container Images (loaded at boot from NFS share)
# =============================================================================
# NFS mount point on CoreOS for docker images
coreos_nfs_docker_mount_point: "/mnt/nfs/docker-images"
# NFS mount point on CoreOS for RPM packages
coreos_nfs_rpm_mount_point: "/mnt/nfs/rpm-packages"
# NFS mount options
coreos_nfs_mount_options: "ro,noatime,vers=4.1"

# List of container images to load from NFS share at boot
# The .tar files should be pre-staged on the NFS server at {{ nfs_docker_images_path }}
coreos_container_images:
  - name: "portainer/portainer-ce"
    tag: "2.27.1"
    tar_filename: "portainer-ce.tar"
  - name: "coredns/coredns"
    tag: "1.12.0"
    tar_filename: "coredns.tar"
  - name: "traefik"
    tag: "v3.2"
    tar_filename: "traefik.tar"
  - name: "osixia/openldap"
    tag: "1.5.0"
    tar_filename: "openldap.tar"
  - name: "osixia/phpldapadmin"
    tag: "0.9.0"
    tar_filename: "phpldapadmin.tar"
  - name: "sonatype/nexus3"
    tag: "3.72.0"
    tar_filename: "nexus3.tar"

# =============================================================================
# Local Download Directory (used for fallback when Proxmox cannot download)
# =============================================================================
coreos_local_download_dir: "/tmp/sophon_images"
