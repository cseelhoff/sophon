---
- name: Upload Controller artifact using multipart curl configuration on stdin
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/upload.py"
    stdin: >-
      {{ {'url': proxmox_api ~ '/nodes/' ~ proxmox_node ~ '/storage/' ~ proxmox_iso_storage_id ~ '/upload',
          'ticket': proxmox_ticket, 'csrf': proxmox_csrf,
          'validate_certs': proxmox_validate_certs | bool,
          'path': controller_upload_source, 'filename': controller_upload_filename} | to_json }}
  register: controller_upload_result
  changed_when: true
  no_log: true

- name: Wait for uploaded Controller artifact
  ansible.builtin.include_tasks: wait_task.yml
  vars:
    controller_upid: "{{ (controller_upload_result.stdout | from_json).data }}"

- name: Verify uploaded artifact is visible in Proxmox ISO storage
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content?content=iso"
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: controller_uploaded_content
  until: >-
    (controller_uploaded_content.json.data
      | selectattr('volid', 'eq', proxmox_iso_storage_id ~ ':iso/' ~ controller_upload_filename)
      | list | length) == 1
  retries: 12
  delay: 5
  no_log: true
