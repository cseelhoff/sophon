---
# Re-fetch and rebuild every input even if it is cached.
prepare_force: false

# Every image any role deploys. A stack whose image is missing here cannot start
# without egress (compose files use pull_policy: never).
prepare_container_images:
  - "{{ portainer_image }}"
  - "docker.io/library/traefik:v3.7.16"
  - "docker.io/cloudflare/cloudflared:2026.10.6"
  - "docker.io/gitea/gitea:28.2.0"
  - "docker.io/library/postgres:18.6-alpine3.24"
  - "docker.io/vegardit/openldap:2.6.10"
  - "docker.io/ldez/traefik-certs-dumper:v2.11.4"
  - "quay.io/keycloak/keycloak:26.8.1"
# <vendor>-<image>_<tag>.tar, the name every role and the installer expect.
prepare_image_tars: >-
  {{ prepare_container_images
     | map('regex_replace', '^(?:.*/)?([^/:]+)/([^/:]+):(.+)$', '\1-\2_\3.tar') | list }}

# CoreDNS is a custom build (coredns-dockerdiscovery), not an upstream image.
prepare_coredns_repo: "https://github.com/cseelhoff-ms/coredns-dockerdiscovery.git"
prepare_coredns_src: "{{ artifacts_dir }}/cache/coredns-dockerdiscovery"
prepare_coredns_image: "localhost/coredns-dockerdiscovery:{{ coredns_image_tag }}"
prepare_coredns_tar: "{{ sophon_containers_dir }}/coredns-dockerdiscovery_{{ coredns_image_tag }}.tar"
prepare_coredns_version: "1.15.0"

prepare_coreos_version: "44.20260928.3.2"
prepare_coreos_metadata_url: "https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/{{ prepare_coreos_version }}/x86_64/meta.json"
prepare_coreos_metadata_path: "{{ artifacts_dir }}/coreos/{{ prepare_coreos_version }}.json"

prepare_bootstrap_dir: "{{ artifacts_dir }}/bootstrap"
prepare_runner_image: "sophon:latest"
prepare_busybox_image: "docker.io/library/busybox:1.38.0-musl"
prepare_runner_path: "{{ prepare_bootstrap_dir }}/runner.tar"
prepare_busybox_path: "{{ prepare_bootstrap_dir }}/busybox-{{ prepare_busybox_image.split(':')[-1] }}"
prepare_manifest_path: "{{ sophon_containers_dir }}/manifest.json"
