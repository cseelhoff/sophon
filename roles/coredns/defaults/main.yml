---
# Enable/disable this role
coredns_enabled: true

# CoreDNS runs a custom build (coredns-dockerdiscovery) from prestage.yml,
# not an upstream image.
coredns_image_path: "{{ sophon_containers_dir }}/coredns-dockerdiscovery.tar"

coredns_image_tars:
  - "{{ coredns_image_path }}"

# CoreDNS configuration
coredns_dns_port: 53
coredns_config_dir: "/opt/coredns"

# DNS forwarding settings
coredns_forward_dns: "9.9.9.9"
coredns_domain_name: "{{ domain_name | default('', true) }}"

# FQDN the Controller preflight resolves (ADR-0007). traefik.<domain> is the
# static anchor CoreDNS serves from TRAEFIK_CNAME/HOST_IP, so it answers as
# soon as the container is up; every other service name is a CNAME to it that
# only appears once discovery sees that container.
coredns_preflight_fqdn: "traefik.{{ coredns_domain_name }}"

# Cloudflare settings
coredns_cf_account_id: ""
coredns_cf_tunnel_id: ""

# Local zones (synced by dns_sync sidecar)
# coredns_local_zones:
#   - name: "homelab.local"
#     file: "homelab.local.zone"
