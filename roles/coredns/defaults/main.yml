---
# Enable/disable this role
coredns_enabled: true

coredns_image_name: "coredns/coredns"
coredns_image_tag: "1.12.0"

# Init container image (writes Corefile into shared volume)
coredns_init_image: "library/busybox"
coredns_init_image_tag: "stable"

# Pre-staged container image tarballs directory
coredns_image_path: "{{ playbook_dir }}/artifacts/containers/coredns-dockerdiscovery.tar"

# Image tar filenames (relative to coredns_image_tar_dir)
# coredns_image_tars:
#   - "coredns-coredns_{{ coredns_image_tag }}.tar"
#   - "library-busybox_{{ coredns_init_image_tag }}.tar"

# CoreDNS configuration
coredns_dns_port: 53
coredns_config_dir: "/opt/coredns"

# DNS forwarding settings
coredns_forward_dns: "9.9.9.9"
coredns_domain_name: "{{ domain_name | default('', true) }}"

# Cloudflare settings
coredns_cf_account_id: ""
coredns_cf_tunnel_id: ""

# Local zones (synced by dns_sync sidecar)
# coredns_local_zones:
#   - name: "homelab.local"
#     file: "homelab.local.zone"
