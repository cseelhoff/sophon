---
# CoreDNS is a custom build (coredns-dockerdiscovery) made by the prepare role.
coredns_image_tars:
  - "{{ sophon_containers_dir }}/coredns-dockerdiscovery_{{ coredns_image_tag }}.tar"

coredns_dns_port: 53
coredns_domain_name: "{{ domain_name | default('', true) }}"
# Where everything outside the zone is forwarded: the operator's upstream DNS,
# or public resolvers when none was given.
coredns_forward_dns: "{{ vnet_dns if vnet_dns | length > 0 else '9.9.9.9 1.1.1.1' }}"

# traefik.<domain> is the static anchor CoreDNS serves from TRAEFIK_CNAME/HOST_IP,
# so it answers as soon as the container is up; every other service name is a
# CNAME to it that only appears once discovery sees that container.
coredns_preflight_fqdn: "traefik.{{ coredns_domain_name }}"

# Cloudflare settings. Zone and account ids are read back from the API.
coredns_cf_api_base: "https://api.cloudflare.com/client/v4"
coredns_cf_token: ""
coredns_cf_zone_id: ""
coredns_cf_account_id: ""
coredns_cf_tunnel_id: ""
# Looked up by name so a recreated tunnel is picked up without editing an id.
# Set SOPHON_CF_TUNNEL_ENABLED=false (or SOPHON_CF_TUNNEL_NAME="") to keep public tunnel routes and CNAMEs untouched.
coredns_cf_tunnel_name: "{{ lookup('env', 'SOPHON_CF_TUNNEL_NAME') | default('sophon', true) }}"
coredns_cf_tunnel_enabled: >-
  {{ (cf_tunnel_enabled | default(true) | bool) and ((coredns_cf_tunnel_name | default('', true) | trim) != '') }}
# Require Cloudflare Zero Trust Access whenever a brand-new tunnel is created so
# anonymous-read services (such as Nexus registries) are never exposed unauthenticated
# by accident. Existing tunnels are left untouched; set SOPHON_CF_ACCESS_ENABLED=false to opt out.
coredns_cf_access_enabled: "{{ cf_access_enabled | default(true) | bool }}"
coredns_cf_access_emails_raw: >-
  {{ cf_access_emails if (cf_access_emails | default('', true) | trim) != '' else (traefik_acme_email | default('', true)) }}
coredns_cf_access_session_duration: "24h"
coredns_cf_oidc_hostname: "{{ keycloak_hostname | default('auth', true) }}"
# Written and deleted by the preflight to prove the token holds Zone:DNS:Edit.
coredns_cf_probe_record: "_sophon-preflight.{{ coredns_domain_name }}"
# Service names published through the tunnel (<name>.<domain>).
coredns_published_hosts: [traefik, auth, ldap, git, nexus, registry, registry-push, arcane, dns, kopia]
# Must equal dnsRecordOwnerComment in coredns-dockerdiscovery: CoreDNS only
# edits records that carry it.
coredns_cf_owner_comment: "managed by coredns-dockerdiscovery"
