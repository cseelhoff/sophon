---
# CoreDNS is a custom build (coredns-dockerdiscovery) made by the prepare role.
coredns_image_tars:
  - "{{ sophon_containers_dir }}/coredns-dockerdiscovery.tar"

coredns_dns_port: 53
coredns_domain_name: "{{ domain_name | default('', true) }}"
# Where everything outside the zone is forwarded: the operator's upstream DNS,
# or public resolvers when none was given.
coredns_forward_dns: "{{ vnet_dns if vnet_dns | length > 0 else '9.9.9.9 1.1.1.1' }}"

# traefik.<domain> is the static anchor CoreDNS serves from TRAEFIK_CNAME/HOST_IP,
# so it answers as soon as the container is up; every other service name is a
# CNAME to it that only appears once discovery sees that container.
coredns_preflight_fqdn: "traefik.{{ coredns_domain_name }}"

# Cloudflare settings. Zone and account ids are read back from the API.
coredns_cf_token: ""
coredns_cf_zone_id: ""
coredns_cf_account_id: ""
coredns_cf_tunnel_id: ""
# Looked up by name so a recreated tunnel is picked up without editing an id.
coredns_cf_tunnel_name: "{{ lookup('env', 'SOPHON_CF_TUNNEL_NAME') | default('sophon', true) }}"
# Written and deleted by the preflight to prove the token holds Zone:DNS:Edit.
coredns_cf_probe_record: "_sophon-preflight.{{ coredns_domain_name }}"
