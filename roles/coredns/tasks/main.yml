---

- name: Prompt for missing domain
  ansible.builtin.pause:
    prompt: "Domain name"
  register: _coredns_dn
  when: coredns_domain_name == ""

- name: Set updated variable values
  ansible.builtin.set_fact:
    coredns_domain_name: "{{ _coredns_dn.user_input | default(coredns_domain_name) }}"

- name: Deploy CoreDNS
  when: coredns_enabled | default(true)
  block:

    # -----------------------------------------------------------------
    # Upload container images to Docker via Portainer API
    # -----------------------------------------------------------------

    - name: Upload container image tars to Docker via Portainer
      ansible.builtin.uri:
        url: "{{ infravm_portainer_url }}/api/endpoints/{{ portainer_local_endpoint_id }}/docker/images/load"
        method: POST
        headers:
          Authorization: "Bearer {{ portainer_auth.json.jwt }}"
          Content-Type: "application/x-tar"
        src: "{{ coredns_image_path }}"
        remote_src: false
        validate_certs: false
        status_code: [200]
      register: _coredns_image_load

    # - name: Render Corefile and encode for init container
    #   ansible.builtin.set_fact:
    #     _coredns_corefile_b64: "{{ lookup('template', 'Corefile.j2') | b64encode }}"

    - name: Deploy CoreDNS stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "coredns"
        portainer_stack_compose_content: |
          services:
            coredns:
              image: coredns-dockerdiscovery:latest
              container_name: coredns
              restart: always
              cap_add:
                - NET_BIND_SERVICE
              security_opt:
                - label:disable
              ports:
                - "53:53/udp"
                - "53:53/tcp"
                - "8081:8081/tcp"
              networks:
                - proxy
              volumes:
                - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
              environment:
                - TRAEFIK_CNAME=traefik.{{ coredns_domain_name }}
                - HOST_IP={{ infravm_ip }}
                - CF_TOKEN={{ coredns_cf_token }}
                - CF_ACCOUNT_ID={{ coredns_cf_account_id }}
                - CF_TUNNEL_ID={{ coredns_cf_tunnel_id }}
                - CF_TUNNEL_TARGET=https://traefik.{{ coredns_domain_name }}
                - INVENTORY_ADDR=:8081
                - FORWARD_DNS=9.9.9.9 1.1.1.1
                - CACHE_TTL=30
              labels:
                - traefik.enable=true
                - traefik.http.routers.coredns.rule=Host(`dns.177cpt.com`)
                - traefik.http.routers.coredns.entrypoints=websecure
                - traefik.http.routers.coredns.tls=true
                - traefik.http.routers.coredns.tls.certresolver=letsencrypt
                - traefik.http.routers.coredns.service=coredns
                - traefik.http.services.coredns.loadbalancer.server.port=8081
          networks:
            proxy:
              external: true

    # - name: Wait for CoreDNS to be listening on port {{ coredns_dns_port }}
    #   ansible.builtin.wait_for:
    #     host: "{{ infravm_ip }}"
    #     port: "{{ coredns_dns_port }}"
    #     timeout: 60

    # - name: Test DNS resolution through CoreDNS
    #   ansible.builtin.command:
    #     cmd: "dig @{{ infravm_ip }} google.com +short +timeout=3"
    #   register: coredns_dns_check
    #   until: coredns_dns_check.rc == 0 and coredns_dns_check.stdout | trim | length > 0
    #   retries: 30
    #   delay: 3
    #   changed_when: false

    - name: Display CoreDNS status
      ansible.builtin.debug:
        msg: "CoreDNS ready at {{ infravm_ip }}:{{ coredns_dns_port }}"
