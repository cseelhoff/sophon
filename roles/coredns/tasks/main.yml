---
# Deploy CoreDNS via Portainer stack
# Image is pre-loaded at boot from ISO

- name: Deploy CoreDNS
  when: coredns_enabled | default(true)
  block:
    - name: Create CoreDNS config volume and populate Corefile
      ansible.builtin.raw: |
        # Create volume if not exists
        podman volume create coredns_config 2>/dev/null || true

        # Get volume mount point
        VOLPATH=$(podman volume inspect coredns_config --format '{{ '{{' }} .Mountpoint {{ '}}' }}')

        # Write Corefile to volume
        cat > "${VOLPATH}/Corefile" << 'COREFILE'
        . {
            forward . {{ coredns_forward_dns }}
            log
            errors
            cache 30
            reload
        }
        COREFILE

        chmod 644 "${VOLPATH}/Corefile"
        echo "Corefile created at ${VOLPATH}/Corefile"
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      changed_when: true

    - name: Deploy CoreDNS stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "coredns"
        portainer_stack_compose_content: |
          version: '3'
          services:
            coredns:
              image: docker.io/{{ coredns_image_name }}:{{ coredns_image_tag }}
              pull_policy: never
              container_name: coredns
              restart: unless-stopped
              network_mode: host
              volumes:
                - coredns_config:/config:ro
              command:
                - -conf
                - /config/Corefile
          volumes:
            coredns_config:
              external: true

    - name: Wait for CoreDNS to be ready
      ansible.builtin.wait_for:
        host: "{{ infravm_ip }}"
        port: "{{ coredns_dns_port }}"
        timeout: 60
      delegate_to: localhost

    - name: Test DNS resolution via CoreDNS
      ansible.builtin.raw: |
        nslookup google.com 127.0.0.1 || dig @127.0.0.1 google.com
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      register: dns_test
      changed_when: false
      failed_when: dns_test.rc != 0

    - name: Display CoreDNS status
      ansible.builtin.debug:
        msg: "CoreDNS ready at {{ infravm_ip }}:{{ coredns_dns_port }}"
