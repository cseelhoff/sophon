---

- name: Prompt for missing domain
  ansible.builtin.pause:
    prompt: "Domain name"
  register: _coredns_dn
  when: coredns_domain_name == ""

- name: Set updated variable values
  ansible.builtin.set_fact:
    coredns_domain_name: "{{ _coredns_dn.user_input | default(coredns_domain_name) }}"

- name: Deploy CoreDNS
  when: coredns_enabled | default(true)
  block:

    # - name: Render Corefile and encode for init container
    #   ansible.builtin.set_fact:
    #     _coredns_corefile_b64: "{{ lookup('template', 'Corefile.j2') | b64encode }}"

    - name: Deploy CoreDNS stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "coredns"
        portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
        portainer_stack_image_tars: "{{ coredns_image_tars }}"

    # - name: Wait for CoreDNS to be listening on port {{ coredns_dns_port }}
    #   ansible.builtin.wait_for:
    #     host: "{{ infravm_ip }}"
    #     port: "{{ coredns_dns_port }}"
    #     timeout: 60

    # - name: Test DNS resolution through CoreDNS
    #   ansible.builtin.command:
    #     cmd: "dig @{{ infravm_ip }} google.com +short +timeout=3"
    #   register: coredns_dns_check
    #   until: coredns_dns_check.rc == 0 and coredns_dns_check.stdout | trim | length > 0
    #   retries: 30
    #   delay: 3
    #   changed_when: false

    # ADR-0007. Deploy addresses services by FQDN over validated TLS from here
    # on -- keycloak/tasks/configure.yml alone makes 27 such calls -- so the
    # Controller's own resolver has to answer for <domain>. getent goes through
    # NSS, the same path urllib uses inside the uri module, so this fails in the
    # same way the real calls would.
    - name: Preflight Controller resolution of the service domain
      ansible.builtin.command:
        cmd: "getent ahostsv4 {{ coredns_preflight_fqdn }}"
      register: coredns_preflight
      changed_when: false
      failed_when: false

    # Matching the address matters as much as resolving at all: a Controller
    # with internet access resolves these names through public DNS and hairpins
    # out via the Cloudflare tunnel, which works until the site loses egress.
    - name: Fail if the Controller does not resolve the service domain to InfraVM
      when: infravm_ip not in coredns_preflight.stdout
      ansible.builtin.fail:
        msg: |
          The Controller cannot resolve {{ coredns_preflight_fqdn }} to {{ infravm_ip }}.

          getent returned: {{ coredns_preflight.stdout | trim | replace('\n', ' / ') | default('(no answer)', true) }}

          CoreDNS is up and authoritative for {{ coredns_domain_name }} -- verify with:
              dig @{{ infravm_ip }} {{ coredns_preflight_fqdn }} +short

          Deploy addresses every remaining service by FQDN, so point this
          machine's resolver at {{ infravm_ip }} and re-run. Sophon does not
          edit the Controller's network configuration itself.

    - name: Display CoreDNS status
      ansible.builtin.debug:
        msg: "CoreDNS ready at {{ infravm_ip }}:{{ coredns_dns_port }}, Controller resolution verified"
