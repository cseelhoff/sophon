---

- name: Deploy CoreDNS
  block:

    # Bad Cloudflare credentials fail silently and late: lego logs "zone could
    # not be found" inside the Traefik container, Traefik serves its self-signed
    # default, and the deploy still reports success. Checking here, before
    # anything is deployed, turns that into one actionable message.
    #
    # Missing egress must not fail the deploy (docs/decisions.md #5), so an
    # unreachable API is a warning, not an error -- only an authoritative
    # negative from Cloudflare fails.
    - name: Preflight Cloudflare credentials
      when: coredns_cf_token | default('', true) != ""
      block:

        # The zone lookup is the authoritative check, deliberately not
        # /user/tokens/verify: account-owned tokens (the cfat_ format) are
        # rejected by verify with "Invalid API Token" while working correctly
        # everywhere else, so checking there rejects good credentials. A token
        # scoped to a zone that has since been deleted -- what a lapsed and
        # re-registered domain leaves behind -- lists no zones here, and lego
        # needs the zone id before it can write the challenge record.
        - name: Look up the zone the Cloudflare token can see
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones?name={{ coredns_domain_name }}"
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            timeout: 10
          register: coredns_cf_zones
          failed_when: false
          changed_when: false

        # The healthy branch emits the literal "ok" rather than nothing: under
        # native Jinja a template that renders empty comes back as None, which
        # trips any "is it blank" test written the obvious way.
        - name: Diagnose the Cloudflare preflight result
          vars:
            _api: "{{ coredns_cf_zones.json | default({}, true) }}"
            _zones: "{{ coredns_cf_zones.json.result | default([], true) }}"
            _zone: "{{ coredns_cf_zones.json.result | default([], true) | first | default({}, true) }}"
          ansible.builtin.set_fact:
            coredns_cf_diagnosis: >-
              {%- if not (_api.success | default(false)) -%}
              Cloudflare rejected the request:
              {{ _api.errors | default([], true) | map(attribute='message') | join('; ') | default('no error detail returned', true) }}
              {%- elif (_zones | length) == 0 -%}
              The token works but can see no zones at all. Most likely it is still
              scoped to a zone that no longer exists -- a domain that lapsed and was
              re-added to Cloudflare gets a brand new zone with a new zone id -- or it
              was created without the Zone:Read permission.
              {%- elif (_zone.status | default('')) != 'active' -%}
              Zone {{ _zone.id }} exists but its status is "{{ _zone.status }}", not "active".
              Point your registrar's nameservers at the pair Cloudflare assigned to it.
              {%- elif coredns_cf_zone_id | default('', true) not in ['', _zone.id] -%}
              coredns_cf_zone_id is set to {{ coredns_cf_zone_id }}, but the live zone for
              {{ coredns_domain_name }} is {{ _zone.id }}. Leave it unset to adopt the live
              value automatically.
              {%- else -%}
              ok
              {%- endif -%}
          when: coredns_cf_zones.json is defined

        - name: Fail with remediation if Cloudflare cannot serve the zone
          when: coredns_cf_diagnosis | default('ok', true) | trim != 'ok'
          ansible.builtin.fail:
            msg: |
              Cloudflare preflight failed for {{ coredns_domain_name }}.

              {{ coredns_cf_diagnosis | trim }}

              Until this is fixed, Traefik cannot complete the Let's Encrypt DNS-01
              challenge, so every service falls back to TRAEFIK DEFAULT CERT, and
              CoreDNS cannot publish the CNAME records or tunnel routes that make
              those names reachable from outside.

              Create a replacement token at
                  https://dash.cloudflare.com/profile/api-tokens
              via "Create Token" -> "Create Custom Token", granting:

                  Zone    / Zone              / Read    (zone lookup, needed by lego)
                  Zone    / DNS               / Edit    (_acme-challenge TXT and CNAMEs)
                  Account / Cloudflare Tunnel / Edit    (tunnel ingress routes)

              Zone Resources:    Include -> Specific zone -> {{ coredns_domain_name }}
              Account Resources: Include -> the account that owns that zone

              Then re-run with the new token in place:

                  export SOPHON_CF_TOKEN=<new token>

              The zone and account ids are read back from Cloudflare, so they never
              need supplying. Sophon never creates or edits Cloudflare credentials.

        # Deriving these is what stops the stale-id failure recurring: the ids
        # change whenever the zone is recreated, the token does not.
        - name: Adopt the zone id Cloudflare reports
          vars:
            _zone: "{{ coredns_cf_zones.json.result | first }}"
          ansible.builtin.set_fact:
            coredns_cf_zone_id: "{{ coredns_cf_zone_id if (coredns_cf_zone_id | default('', true) != '') else _zone.id }}"
            coredns_cf_discovered_account_id: "{{ _zone.account.id }}"
          when: coredns_cf_zones.json is defined

        # Zone:Read is not enough. lego needs Zone:DNS:Edit to publish the
        # _acme-challenge TXT, and a token without it fails every DNS-01 with
        # "Authentication error (10000)" -- burning five authorization failures
        # per hostname before Let's Encrypt locks that name out for an hour.
        # Writing a throwaway record is the only way to know before Traefik
        # starts spending that quota.
        - name: Probe whether the token may write DNS records
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ coredns_cf_zone_id }}/dns_records"
            method: POST
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            body_format: json
            body:
              type: TXT
              name: "{{ coredns_cf_probe_record }}"
              content: "sophon dns-01 write probe"
              ttl: 60
            timeout: 10
          register: coredns_cf_probe
          failed_when: false
          changed_when: false
          when: coredns_cf_zones.json is defined

        - name: Remove the probe record
          ansible.builtin.uri:
            url: >-
              https://api.cloudflare.com/client/v4/zones/{{ coredns_cf_zone_id }}/dns_records/{{ coredns_cf_probe.json.result.id }}
            method: DELETE
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            timeout: 10
          register: coredns_cf_probe_cleanup
          failed_when: false
          changed_when: false
          when: coredns_cf_probe.json.success | default(false)

        - name: Warn if the probe record could not be removed
          when:
            - coredns_cf_probe.json.success | default(false)
            - not (coredns_cf_probe_cleanup.json.success | default(false))
          ansible.builtin.debug:
            msg: >-
              Left a stray TXT record at {{ coredns_cf_probe_record }}; delete it by hand.

        - name: Fail if the token cannot write the ACME challenge record
          when:
            - coredns_cf_probe.json is defined
            - not (coredns_cf_probe.json.success | default(false))
          ansible.builtin.fail:
            msg: |
              The Cloudflare token can read zone {{ coredns_domain_name }} but cannot write
              to it:

              {{ coredns_cf_probe.json.errors | default([], true) | map(attribute='message') | join('; ') | default('no error detail returned', true) }}

              Traefik would fail every DNS-01 challenge with "Authentication error (10000)",
              and five failures per hostname earns a one-hour Let's Encrypt lockout, so the
              deploy stops here instead.

              The token is missing Zone / DNS / Edit. Add it at
                  https://dash.cloudflare.com/profile/api-tokens
              so the token holds all of:

                  Zone    / Zone              / Read    (zone lookup)
                  Zone    / DNS               / Edit    (_acme-challenge TXT and CNAMEs)
                  Account / Cloudflare Tunnel / Edit    (only if using tunnels)

              Then re-run with the new token in place:

                  export SOPHON_CF_TOKEN=<new token>

        - name: Look up the Cloudflare tunnel by name
          ansible.builtin.uri:
            url: >-
              https://api.cloudflare.com/client/v4/accounts/{{ coredns_cf_discovered_account_id }}/cfd_tunnel?is_deleted=false&name={{ coredns_cf_tunnel_name }}
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            timeout: 10
          register: coredns_cf_tunnels
          failed_when: false
          changed_when: false
          when:
            - coredns_cf_discovered_account_id | default('', true) != ''
            - coredns_cf_tunnel_id | default('', true) == ''

        # Only a lookup Cloudflare answered successfully with no match creates a
        # tunnel; an API error must never make a duplicate. config_src=cloudflare
        # makes it remotely managed, which the ingress routes CoreDNS publishes
        # and the connector token both require.
        - name: Create the Cloudflare tunnel when none has that name
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/accounts/{{ coredns_cf_discovered_account_id }}/cfd_tunnel"
            method: POST
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            body_format: json
            body:
              name: "{{ coredns_cf_tunnel_name }}"
              config_src: cloudflare
            timeout: 10
          register: coredns_cf_tunnel_created
          failed_when: false
          changed_when: coredns_cf_tunnel_created.json.success | default(false)
          when:
            - coredns_cf_tunnels.json.success | default(false)
            - coredns_cf_tunnels.json.result | default([], true) | length == 0

        - name: Warn that the Cloudflare tunnel could not be created
          when:
            - coredns_cf_tunnel_created.json is defined
            - not (coredns_cf_tunnel_created.json.success | default(false))
          ansible.builtin.debug:
            msg: >-
              Could not create the Cloudflare tunnel "{{ coredns_cf_tunnel_name }}":
              {{ coredns_cf_tunnel_created.json.errors | default([], true) | map(attribute='message') | join('; ') | default('no error detail returned', true) }}

        # setup.go treats cf_account_id and cf_tunnel_id as one group: supplying
        # either without the other aborts CoreDNS at startup, taking the whole
        # site's DNS with it. So the account id is only published once a tunnel
        # id is known, and both stay empty otherwise.
        - name: Adopt the tunnel and account ids only as a matched pair
          vars:
            _tunnel: "{{ coredns_cf_tunnels.json.result | default([], true) | first | default(coredns_cf_tunnel_created.json.result | default({}, true), true) }}"
            _tunnel_id: "{{ coredns_cf_tunnel_id if (coredns_cf_tunnel_id | default('', true) != '') else _tunnel.id | default('', true) }}"
          ansible.builtin.set_fact:
            coredns_cf_tunnel_id: "{{ _tunnel_id }}"
            coredns_cf_account_id: "{{ coredns_cf_discovered_account_id if _tunnel_id != '' else '' }}"
          when: coredns_cf_zones.json is defined

        # CoreDNS never edits a DNS record it did not create. A CNAME left on
        # another tunnel by an earlier setup therefore keeps the name pointing at
        # a tunnel with no connector, and Cloudflare answers 530. Repointing it
        # here is the project's job. Only CNAMEs aimed at a tunnel target are
        # taken over; any other record on these names (A, MX, a CNAME to a real
        # host) is left alone. The ownership comment hands the record to
        # CoreDNS, which then keeps it in sync.
        - name: Look up the CNAMEs already on the service names
          ansible.builtin.uri:
            url: >-
              https://api.cloudflare.com/client/v4/zones/{{ coredns_cf_zone_id }}/dns_records?type=CNAME&name={{ item }}.{{ coredns_domain_name | lower | regex_replace('\.$', '') }}
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            timeout: 10
          loop: "{{ coredns_published_hosts }}"
          register: coredns_cf_existing_cnames
          failed_when: false
          changed_when: false
          when: coredns_cf_tunnel_id | default('', true) != ''

        - name: Repoint CNAMEs that still target another tunnel
          vars:
            _record: "{{ item.json.result | default([], true) | first | default({}, true) }}"
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ coredns_cf_zone_id }}/dns_records/{{ _record.id }}"
            method: PATCH
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
            body_format: json
            body:
              type: CNAME
              content: "{{ coredns_cf_tunnel_id }}.cfargotunnel.com"
              proxied: true
              ttl: 1
              comment: "{{ coredns_cf_owner_comment }}"
            timeout: 10
          loop: "{{ coredns_cf_existing_cnames.results | default([], true) }}"
          loop_control:
            label: "{{ item.item }}"
          register: coredns_cf_repointed
          failed_when: false
          changed_when: coredns_cf_repointed.json.success | default(false)
          when:
            - item.json is defined
            - item.json.result | default([], true) | length > 0
            - _record.content | lower is match('.*\.cfargotunnel\.com$')
            - _record.content | lower != coredns_cf_tunnel_id | lower ~ '.cfargotunnel.com'

        - name: Warn about CNAMEs that could not be repointed
          ansible.builtin.debug:
            msg: >-
              Could not repoint {{ item.item }}.{{ coredns_domain_name }} to the tunnel:
              {{ item.json.errors | default([], true) | map(attribute='message') | join('; ') | default('no error detail returned', true) }}
          loop: "{{ coredns_cf_repointed.results | default([], true) }}"
          loop_control:
            label: "{{ item.item.item }}"
          when:
            - item.json is defined
            - not (item.json.success | default(false))

        - name: Display the Cloudflare coordinates in use
          when: coredns_cf_zones.json is defined
          ansible.builtin.debug:
            msg: >-
              Cloudflare zone {{ coredns_cf_zone_id }} for {{ coredns_domain_name }};
              {{ 'tunnel ' ~ coredns_cf_tunnel_id ~ ' in account ' ~ coredns_cf_account_id
                    ~ (' (created just now)' if coredns_cf_tunnel_created is changed else '')
                 if coredns_cf_tunnel_id != ''
                 else 'no tunnel named "' ~ coredns_cf_tunnel_name ~ '" exists or could be created, so public CNAMEs and
                      ingress routes are not published and every name must be resolved from CoreDNS
                      directly. Certificates are unaffected.' }}

        - name: Warn that the Cloudflare preflight could not run
          when: coredns_cf_zones.json is not defined
          ansible.builtin.debug:
            msg: >-
              Could not reach the Cloudflare API to validate the token, so the check was
              skipped. If this site has no egress that is expected; certificate
              renewal and tunnel publishing stay down until egress returns.

    - name: Deploy CoreDNS stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "coredns"
        portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
        portainer_stack_image_tars: "{{ coredns_image_tars }}"

    # The runner's resolver must answer the way Ansible's uri module does:
    # everything after this addresses services by FQDN over validated TLS
    # (keycloak/tasks/configure.yml alone makes 27 such calls).
    - name: Preflight resolution of the service domain
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - "import socket, sys; print('\\n'.join(sorted({address[4][0] for address in socket.getaddrinfo(sys.argv[1], None, socket.AF_INET)})))"
          - "{{ coredns_preflight_fqdn }}"
      register: coredns_preflight
      changed_when: false
      failed_when: false

    # Matching the address matters as much as resolving at all: a runner with
    # internet access would resolve these names through public DNS and hairpin
    # out via the Cloudflare tunnel, which works until the site loses egress.
    - name: Fail if the runner does not resolve the service domain to InfraVM
      when: infravm_ip not in coredns_preflight.stdout_lines
      ansible.builtin.fail:
        msg: |
          The runner cannot resolve {{ coredns_preflight_fqdn }} to {{ infravm_ip }}.

          Python resolution returned: {{ coredns_preflight.stdout | trim | replace('\n', ' / ') | default('(no answer)', true) }}
          {{ coredns_preflight.stderr | default('') }}

          CoreDNS is up and authoritative for {{ coredns_domain_name }} -- verify with:
              dig @{{ infravm_ip }} {{ coredns_preflight_fqdn }} +short

          Deploy addresses every remaining service by FQDN. Re-run through
          sophon-deploy so the runner's managed /etc/hosts entries are
          refreshed, and check that they contain the correct InfraVM address.

    - name: Display CoreDNS status
      ansible.builtin.debug:
        msg: "CoreDNS ready at {{ infravm_ip }}:{{ coredns_dns_port }}, runner resolution verified"
