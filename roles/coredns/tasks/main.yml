---
# Deploy CoreDNS via Portainer stack
# Image is pre-loaded at boot from ISO

- name: Deploy CoreDNS
  when: coredns_enabled | default(true)
  block:
    - name: Create CoreDNS config volume and populate Corefile
      ansible.builtin.raw: |
        # Create volume in system namespace (where Portainer/root podman runs)
        sudo podman volume create coredns_config 2>/dev/null || true

        # Get volume mount point
        VOLPATH=$(sudo podman volume inspect coredns_config --format '{{ '{{' }} .Mountpoint {{ '}}' }}')

        # Write Corefile to volume
        sudo tee "${VOLPATH}/Corefile" > /dev/null << 'COREFILE'
        . {
            forward . {{ coredns_forward_dns }}
            log
            errors
            cache 30
            reload
        }
        COREFILE

        sudo chmod 644 "${VOLPATH}/Corefile"
        echo "Corefile created at ${VOLPATH}/Corefile"
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      changed_when: true

    - name: Disable systemd-resolved stub listener for CoreDNS
      ansible.builtin.raw: |
        sudo mkdir -p /etc/systemd/resolved.conf.d
        echo -e '[Resolve]\nDNSStubListener=no' | sudo tee /etc/systemd/resolved.conf.d/nostub.conf > /dev/null
        sudo systemctl restart systemd-resolved
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      changed_when: true

    - name: Deploy CoreDNS stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "coredns"
        portainer_stack_compose_content: |
          services:
            coredns:
              image: docker.io/{{ coredns_image_name }}:{{ coredns_image_tag }}
              pull_policy: never
              container_name: coredns
              restart: unless-stopped
              network_mode: host
              volumes:
                - coredns_config:/config:ro
              command:
                - -conf
                - /config/Corefile
          volumes:
            coredns_config:
              external: true

    - name: Wait for CoreDNS and test DNS resolution
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if nslookup google.com 127.0.0.1 2>/dev/null || dig @127.0.0.1 google.com +short 2>/dev/null | grep -q .; then
            echo "CoreDNS ready - DNS resolution successful"
            exit 0
          fi
          sleep 2
        done
        echo "CoreDNS not ready after 60s"
        exit 1
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      changed_when: false

    - name: Display CoreDNS status
      ansible.builtin.debug:
        msg: "CoreDNS ready at {{ infravm_ip }}:{{ coredns_dns_port }}"
