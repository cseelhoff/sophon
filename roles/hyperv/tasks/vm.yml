---
- name: Provision a blank InfraVM with two immutable ISOs on Hyper-V
  hyperv_vm:
    host: "{{ hyperv_host }}"
    port: "{{ hyperv_port }}"
    username: "{{ hyperv_username }}"
    password: "{{ hyperv_password }}"
    ca_file: "{{ hyperv_ca_file }}"
    switch: "{{ hyperv_switch }}"
    path: "{{ hyperv_path }}"
    name: "{{ infravm_vm_name }}"
    cores: "{{ infravm_cores }}"
    memory: "{{ infravm_memory }}"
    disk_gb: "{{ infravm_disk_gb }}"
    coreos_iso: "{{ coreos_iso_path }}"
    bundle_iso: "{{ bundle_iso_path }}"
  register: infravm_hyperv

- name: Show the selected Hyper-V VM
  ansible.builtin.debug:
    msg: "Continue in the Hyper-V console for {{ infravm_hyperv.vm_path }} (Hyper-V Manager > Connect)."
