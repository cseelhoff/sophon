---
- name: Hot-insert secrets ISO on Hyper-V VM
  hyperv_vm:
    action: mount_secrets
    host: "{{ hyperv_host }}"
    port: "{{ hyperv_port }}"
    username: "{{ hyperv_username }}"
    password: "{{ hyperv_password }}"
    ca_file: "{{ hyperv_ca_file }}"
    switch: "{{ hyperv_switch | default('') }}"
    path: "{{ hyperv_path }}"
    name: "{{ mount_secrets_vm_name }}"
    marker: "{{ mount_secrets_vm_marker }}"
    secrets_iso: "{{ mount_secrets_iso_path }}"
