global
    log stdout format raw local0
    maxconn 32

defaults
    mode http
    timeout connect 5s
    timeout client 900s
    timeout server 900s

frontend engine
    bind :2375
    acl read_method method GET
    acl write_method method POST
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/containers/json$ ^(/v[0-9]+\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/json$ ^(/v[0-9]+\.[0-9]+)?/exec/[a-zA-Z0-9_.-]+/json$
    acl write_path path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/(exec|stop|start)$ ^(/v[0-9]+\.[0-9]+)?/exec/[a-zA-Z0-9_.-]+/start$
    http-request allow if read_method read_path
    http-request allow if write_method write_path
    http-request deny deny_status 403
    default_backend podman

backend podman
    server engine /socket/podman.sock
