global
    log stdout format raw local0
    maxconn 32

defaults
    mode http
    timeout connect 5s
    timeout client 900s
    timeout server 900s

frontend engine
    bind :2375
    acl read_method method GET
    acl write_method method POST
    acl list_path path_reg ^/v[0-9]+\.[0-9]+/libpod/containers/json$
    acl control_path path_reg ^/v[0-9]+\.[0-9]+/containers/[a-f0-9]{64}/(stop|start)$
    http-request allow if read_method list_path
    http-request allow if write_method control_path
    http-request deny deny_status 403
    default_backend podman

backend podman
    server engine /socket/podman.sock
