---
# Kopia backup configuration for filesystem-level backups
kopia_enabled: false  # TODO: Rewrite to use portainer_stack
kopia_image_name: "kopia/kopia"
kopia_image_tag: "0.17"

# Ports
kopia_port: 51515

# Directories
kopia_data_dir: "/opt/kopia"
kopia_config_dir: "{{ kopia_data_dir }}/config"
kopia_cache_dir: "{{ kopia_data_dir }}/cache"
kopia_logs_dir: "{{ kopia_data_dir }}/logs"

# Repository configuration
# Supported: filesystem, s3, sftp, rclone, azure, gcs, b2
kopia_repository_type: "filesystem"
kopia_repository_path: "/repository"

# S3 configuration (if using S3/MinIO)
# kopia_s3_endpoint: ""
# kopia_s3_bucket: ""
# kopia_s3_access_key: ""
# kopia_s3_secret_key: ""

# Server mode
kopia_server_enabled: true
kopia_server_username: "kopia"
# kopia_server_password: ""  # Set via vault

# TLS (optional - can use Traefik instead)
kopia_tls_enabled: false

# Backup sources to mount (host paths to backup)
kopia_backup_sources:
  - "/opt"
  - "/home"

# Retention policy
kopia_retention_keep_latest: 10
kopia_retention_keep_hourly: 24
kopia_retention_keep_daily: 7
kopia_retention_keep_weekly: 4
kopia_retention_keep_monthly: 12
kopia_retention_keep_annual: 3
