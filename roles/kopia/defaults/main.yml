---
# =============================================================================
# Kopia role defaults
# =============================================================================
# Kopia is the encrypted, deduplicated, content-addressed snapshot engine
# Sophon uses as the *transport + retention* layer for service backups.
# Service-specific consistent dumps (e.g. `gitea dump`) land in a podman
# named volume on the InfraVM (`kopia_backups`) which kopia mounts at
# /source. Kopia snapshots that tree into an encrypted SFTP repository on
# the NFS VM at {{ kopia_sftp_path }} and enforces retention.
#
# SFTP — not NFS bind-mount — is the storage backend, because the kernel
# downgrades NFS bind-mounts to read-only inside any non-init user namespace
# (which rootless containers always live in). SFTP is a kopia-native backend
# and avoids the entire userns/permissions class of bug.
#
# Most knobs that form the *integration contract* with the SFTP-provisioning
# role (kopia_enabled, kopia_sftp_host/port/username/path, key + known_hosts
# paths) live in group_vars/all.yml so both roles see the same values
# regardless of include order. This file holds kopia's *operational*
# defaults only.

# Image
kopia_image_name: "docker.io/kopia/kopia"
kopia_image_tag: "0.21.1"
kopia_image: "{{ kopia_image_name }}:{{ kopia_image_tag }}"

# Domain / URLs
kopia_hostname: "kopia"
kopia_domain: "{{ domain_name }}"
kopia_root_url: "https://{{ kopia_hostname }}.{{ kopia_domain }}/"

# Web UI auth (kopia server username/password). Independent of repo password.
kopia_admin_user: "admin"
kopia_admin_password: "{{ portainer_admin_password }}"

# Repository encryption password. Anyone with this passphrase can read all
# snapshots; treat as a vault-managed secret in production. Defaults to the
# generated portainer admin password so a fresh deploy "just works".
kopia_repository_password: "{{ portainer_admin_password }}"

# -----------------------------------------------------------------------------
# SFTP backend
# -----------------------------------------------------------------------------
# The kopia role is loosely coupled from the storage backend. The shared
# integration contract lives in group_vars/all.yml and defines:
#   kopia_sftp_host / kopia_sftp_port / kopia_sftp_username / kopia_sftp_path
#   kopia_ssh_keydir / kopia_ssh_keyfile / kopia_known_hosts_file
#
# The kopia role itself only READS those artifact files at runtime — it
# does not provision the SFTP user, the repo dir, or the host key. For the
# default Alpine NFS-VM backend the nfs role does that provisioning during
# its own deployment. Swap it for a real SAN/NAS by setting
# `nfs_provision_kopia_user: false` and populating the artifact files
# out-of-band.
#
# kopia_sftp_private_key + kopia_sftp_known_hosts are facts the kopia
# tasks set at runtime by slurping the artifact files; they are consumed
# by the compose template.

# Server listen port (proxied by Traefik).
kopia_port: 51515

# Snapshot policy applied to /source. The kopia server's in-process
# scheduler honors this cron expression.
kopia_snapshot_cron: "0 */6 * * *"        # every 6h
kopia_keep_latest: 10
kopia_keep_hourly: 24
kopia_keep_daily: 14
kopia_keep_weekly: 8
kopia_keep_monthly: 12
kopia_keep_annual: 3

# Maintenance (compaction / GC) — run by kopia's owner client.
kopia_maintenance_full_cron: "0 3 * * 0"  # Sunday 03:00
kopia_maintenance_quick_cron: "0 3 * * *" # daily 03:00
