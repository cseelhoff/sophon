---
- name: Validate optional coarse backup host paths
  ansible.builtin.assert:
    that:
      - kopia_coarse_volumes_dir is match('^/[A-Za-z0-9_./-]+$') and kopia_coarse_volumes_dir != '/'
      - kopia_coarse_work_dir is match('^/[A-Za-z0-9_./-]+$') and kopia_coarse_work_dir != '/'
      - "'..' not in kopia_coarse_volumes_dir.split('/') and '..' not in kopia_coarse_work_dir.split('/')"
      - kopia_coarse_volumes_dir != kopia_coarse_work_dir
      - not kopia_coarse_volumes_dir.startswith(kopia_coarse_work_dir.rstrip('/') ~ '/')
      - not kopia_coarse_work_dir.startswith(kopia_coarse_volumes_dir.rstrip('/') ~ '/')
    fail_msg: "Coarse backups need disjoint absolute host volume/work directories on the same filesystem."
  when: kopia_coarse_enabled | bool

- name: Validate Podman volumes directory path
  ansible.builtin.assert:
    that:
      - kopia_volumes_dir is match('^/[A-Za-z0-9_./-]+$') and kopia_volumes_dir != '/'
      - "'..' not in kopia_volumes_dir.split('/')"
    fail_msg: "kopia_volumes_dir must be a normalized absolute host directory path."

- name: Deploy the v3 backup stack
  ansible.builtin.include_role:
    name: compose_stack
    apply:
      no_log: true
  vars:
    compose_stack_name: kopia
    compose_stack_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    compose_stack_image_tars: "{{ kopia_image_tars }}"
    compose_stack_env_vars: "{{ kopia_environment }}"
    compose_stack_deploy_timeout: 300
  no_log: true

- name: Check backup startup and report redacted failures
  block:
    - name: Wait for the repository-connected backup service
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
          - container
          - inspect
          - --format
          - "{{ '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' }}"
          - kopia
      register: kopia_health
      until: >-
        kopia_health.rc == 0 and
        (kopia_health.stdout | trim) in ['healthy', 'unhealthy']
      failed_when: >-
        kopia_health.rc == 0 and
        (kopia_health.stdout | trim) == 'unhealthy'
      retries: 60
      delay: 5
      no_log: true
      changed_when: false
  rescue:
    - name: Read startup logs privately for a structured diagnostic
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
          - container
          - logs
          - --tail
          - "50"
          - kopia
      register: kopia_startup_logs
      failed_when: false
      changed_when: false
      no_log: true
    - name: Extract only the structured startup diagnostic
      ansible.builtin.set_fact:
        kopia_diagnostics: "{{ ((kopia_startup_logs.stdout | default('')) ~ '\n' ~ (kopia_startup_logs.stderr | default(''))) | regex_findall('KOPIA_STARTUP_ERROR_JSON=(\\{[^\\r\\n]*\\})') }}"
      no_log: true
    - name: Select the reported startup failure
      ansible.builtin.set_fact:
        kopia_startup_error: >-
          {{ (kopia_diagnostics | last | from_json).message if kopia_diagnostics | length > 0
             else 'No structured startup diagnostic available; log rc: ' ~
                  (kopia_startup_logs.rc | default('unavailable') | string) ~ '. Inspect podman logs kopia on the console.' }}
      no_log: true
    - name: Redact supplied secrets from the diagnostic
      ansible.builtin.set_fact:
        kopia_startup_error: "{{ kopia_startup_error | replace(item, '[redacted]') }}"
      loop:
        - "{{ kopia_password }}"
        - "{{ kopia_server_password }}"
        - "{{ kopia_sftp_private_key_b64 }}"
        - "{{ kopia_sftp_private_key_b64 | b64decode | trim }}"
      when: item | length > 0
      no_log: true
    - name: Fail with the redacted Kopia startup reason
      ansible.builtin.fail:
        msg: "Kopia deployment failed: {{ kopia_startup_error }}"

- name: Wait for the initial primary backup to finish when scheduled backups are enabled
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
      - exec
      - kopia
      - cat
      - /source/last-run.json
  register: kopia_initial_backup
  until: >-
    kopia_initial_backup.rc == 0 and
    (kopia_initial_backup.stdout | trim | length > 0) and
    ((kopia_initial_backup.stdout | from_json).upload_status | default('')) != 'pending'
  retries: 60
  delay: 5
  changed_when: false
  when: kopia_backups_enabled | bool

- name: Require a verified initial primary backup when scheduled backups are enabled
  ansible.builtin.assert:
    that:
      - (kopia_initial_backup.stdout | from_json).status == 'complete'
      - ((kopia_initial_backup.stdout | from_json).failures | default([])) == []
    fail_msg: "Initial Kopia backup failed or was incomplete: {{ kopia_initial_backup.stdout }}"
  when: kopia_backups_enabled | bool

- name: Report the management-independent backup command
  ansible.builtin.debug:
    msg: "Kopia ready. Run an on-demand backup from the console: podman exec kopia python3 /app/backup.py run"
