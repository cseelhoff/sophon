---
- name: Validate the site backup volume list
  ansible.builtin.assert:
    that:
      - kopia_extra_volumes is sequence and kopia_extra_volumes is not string and kopia_extra_volumes is not mapping
      - kopia_extra_volumes | unique | length == kopia_extra_volumes | length
    fail_msg: "SOPHON_KOPIA_EXTRA_VOLUMES must be a JSON array of unique named volumes."

- name: Reset the declared backup volume list
  ansible.builtin.set_fact:
    kopia_volume_names: []

- name: Read core roles' declared backup volumes
  ansible.builtin.set_fact:
    kopia_volume_names: >-
      {{ (kopia_volume_names | default([])) +
         (lookup('file', role_path ~ '/../' ~ item ~ '/defaults/main.yml') | from_yaml)[item ~ '_backup_volumes'] }}
  loop: [traefik, openldap, keycloak, gitea, coredns, cloudflared, portainer, kopia]

- name: Include site workload volumes
  ansible.builtin.set_fact:
    kopia_volume_names: "{{ (kopia_volume_names + kopia_extra_volumes) | unique | sort }}"

- name: Require volume names, not host paths
  ansible.builtin.assert:
    that: item is string and item is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
    fail_msg: "Backup volumes must be engine-managed volume names, never host paths."
  loop: "{{ kopia_volume_names }}"

- name: Deploy the v3 backup stack
  ansible.builtin.include_role:
    name: portainer_stack
    apply:
      no_log: true
  vars:
    portainer_stack_name: kopia
    portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    portainer_stack_image_tars: "{{ kopia_image_tars }}"
    portainer_stack_env_vars: "{{ kopia_environment }}"
    portainer_stack_deploy_timeout: 300
  no_log: true

- name: Wait for the repository-connected backup service
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/endpoints/{{ portainer_stack_endpoint_id }}/docker/containers/kopia/json"
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
    validate_certs: false
    status_code: [200, 404]
  register: kopia_health
  until: kopia_health.status == 200 and kopia_health.json.State.Health.Status | default('starting') == 'healthy'
  retries: 60
  delay: 5
  no_log: true
  changed_when: false

- name: Report the management-independent backup command
  ansible.builtin.debug:
    msg: "Kopia ready. Run a backup from the console: podman exec kopia python3 /app/backup.py run"
