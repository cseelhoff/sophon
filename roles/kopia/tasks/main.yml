---
- name: Validate optional coarse backup host paths
  ansible.builtin.assert:
    that:
      - kopia_coarse_volumes_dir is match('^/[A-Za-z0-9_./-]+$') and kopia_coarse_volumes_dir != '/'
      - kopia_coarse_work_dir is match('^/[A-Za-z0-9_./-]+$') and kopia_coarse_work_dir != '/'
      - "'..' not in kopia_coarse_volumes_dir.split('/') and '..' not in kopia_coarse_work_dir.split('/')"
      - kopia_coarse_volumes_dir != kopia_coarse_work_dir
      - not kopia_coarse_volumes_dir.startswith(kopia_coarse_work_dir.rstrip('/') ~ '/')
      - not kopia_coarse_work_dir.startswith(kopia_coarse_volumes_dir.rstrip('/') ~ '/')
    fail_msg: "Coarse backups need disjoint absolute host volume/work directories on the same filesystem."
  when: kopia_coarse_enabled | bool

- name: Validate the site backup volume list
  ansible.builtin.assert:
    that:
      - kopia_extra_volumes is sequence and kopia_extra_volumes is not string and kopia_extra_volumes is not mapping
      - kopia_extra_volumes | unique | length == kopia_extra_volumes | length
    fail_msg: "SOPHON_KOPIA_EXTRA_VOLUMES must be a JSON array of unique named volumes."

- name: Reset the declared backup volume list
  ansible.builtin.set_fact:
    kopia_volume_names: []

- name: Read core roles' declared backup volumes
  ansible.builtin.set_fact:
    kopia_volume_names: >-
      {{ (kopia_volume_names | default([])) +
         (lookup('file', role_path ~ '/../' ~ item ~ '/defaults/main.yml') | from_yaml)[item ~ '_backup_volumes'] }}
  loop: [traefik, openldap, keycloak, gitea, coredns, cloudflared, portainer, kopia]

- name: Include site workload volumes
  ansible.builtin.set_fact:
    kopia_volume_names: "{{ (kopia_volume_names + kopia_extra_volumes) | unique | sort }}"

- name: Require volume names, not host paths
  ansible.builtin.assert:
    that: item is string and item is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
    fail_msg: "Backup volumes must be engine-managed volume names, never host paths."
  loop: "{{ kopia_volume_names }}"

- name: Deploy the v3 backup stack
  ansible.builtin.include_role:
    name: portainer_stack
    apply:
      no_log: true
  vars:
    portainer_stack_name: kopia
    portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    portainer_stack_image_tars: "{{ kopia_image_tars }}"
    portainer_stack_env_vars: "{{ kopia_environment }}"
    portainer_stack_deploy_timeout: 300
  no_log: true

- name: Check backup startup and report redacted failures
  block:
    - name: Wait for the repository-connected backup service
      ansible.builtin.uri:
        url: "{{ infravm_portainer_url }}/api/endpoints/{{ portainer_stack_endpoint_id }}/docker/containers/kopia/json"
        headers:
          Authorization: "Bearer {{ portainer_stack_auth_token }}"
        validate_certs: false
        status_code: [200, 404]
      register: kopia_health
      until: >-
        kopia_health.status == 200 and
        kopia_health.json.State.Health.Status | default('starting') in ['healthy', 'unhealthy']
      failed_when: >-
        kopia_health.status == 200 and
        kopia_health.json.State.Health.Status | default('starting') == 'unhealthy'
      retries: 60
      delay: 5
      no_log: true
      changed_when: false
  rescue:
    - name: Read startup logs privately for a structured diagnostic
      ansible.builtin.uri:
        url: "{{ infravm_portainer_url }}/api/endpoints/{{ portainer_stack_endpoint_id }}/docker/containers/kopia/logs?stdout=true&stderr=true&tail=50"
        headers:
          Authorization: "Bearer {{ portainer_stack_auth_token }}"
        validate_certs: false
        return_content: true
      register: kopia_startup_logs
      failed_when: false
      changed_when: false
      no_log: true
    - name: Extract only the structured startup diagnostic
      ansible.builtin.set_fact:
        kopia_diagnostics: "{{ kopia_startup_logs.content | default('') | regex_findall('KOPIA_STARTUP_ERROR_JSON=(\\{[^\\r\\n]*\\})') }}"
      no_log: true
    - name: Select the reported startup failure
      ansible.builtin.set_fact:
        kopia_startup_error: >-
          {{ (kopia_diagnostics | last | from_json).message if kopia_diagnostics | length > 0
             else 'No structured startup diagnostic available; log API status: ' ~
                  (kopia_startup_logs.status | default('unavailable') | string) ~ '. Inspect podman logs kopia on the console.' }}
      no_log: true
    - name: Redact supplied secrets from the diagnostic
      ansible.builtin.set_fact:
        kopia_startup_error: "{{ kopia_startup_error | replace(item, '[redacted]') }}"
      loop:
        - "{{ kopia_password }}"
        - "{{ kopia_server_password }}"
        - "{{ kopia_sftp_private_key_b64 }}"
        - "{{ kopia_sftp_private_key_b64 | b64decode | trim }}"
      when: item | length > 0
      no_log: true
    - name: Fail with the redacted Kopia startup reason
      ansible.builtin.fail:
        msg: "Kopia deployment failed: {{ kopia_startup_error }}"

- name: Report the management-independent backup command
  ansible.builtin.debug:
    msg: "Kopia ready. Run a backup from the console: podman exec kopia python3 /app/backup.py run"
