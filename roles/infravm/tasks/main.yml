---
# -----------------------------------------------------------------------------
# VM Existence Check
# -----------------------------------------------------------------------------

# -------------------------------------------------------------------------
# InfraVM IP Discovery
# -------------------------------------------------------------------------

- name: Find sophon-infravm VM
  ansible.builtin.set_fact:
    infravm_existing_vm: "{{ proxmox_existing_vms.json.data | selectattr('name', 'eq', 'sophon-infravm') | first | default(none) }}"

# -----------------------------------------------------------------------------
# CoreOS Image and VM Creation (only if VM doesn't exist)
# -----------------------------------------------------------------------------
- name: Prepare and create CoreOS VM
  when: infravm_existing_vm is none
  block:
    # -------------------------------------------------------------------------
    # Discover the on-disk path for the configured ISO storage
    # -------------------------------------------------------------------------
    # Avoids hardcoding /var/lib/vz/template/iso. The /storage/{id} endpoint
    # returns a `path` field for dir/nfs/cifs storage types (NFS auto-mounts
    # at /mnt/pve/<id>). The ISO subdir is always <path>/template/iso per
    # Proxmox convention.
    - name: Look up Proxmox storage configuration
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/storage/{{ proxmox_iso_storage_id }}"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: _iso_storage_cfg

    - name: Resolve ISO storage on-disk path
      ansible.builtin.set_fact:
        # Use the storage's `path` field when present (dir storage and
        # auto-mounted nfs/cifs both expose it); otherwise derive the PVE
        # NFS/CIFS auto-mount path; otherwise keep the role-default fallback.
        proxmox_iso_storage_path: >-
          {{
            (_iso_storage_cfg.json.data.path ~ '/template/iso')
            if _iso_storage_cfg.json.data.path is defined
            else (
              ('/mnt/pve/' ~ proxmox_iso_storage_id ~ '/template/iso')
              if _iso_storage_cfg.json.data.type in ['nfs', 'cifs']
              else proxmox_iso_storage_path
            )
          }}

    - name: Check if CoreOS image exists in Proxmox storage
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: storage_content

    - name: Set image exists fact
      ansible.builtin.set_fact:
        coreos_image_exists: "{{ storage_content.json.data | selectattr('volid', 'search', infravm_coreos_iso_filename) | list | length > 0 }}"

    # -------------------------------------------------------------------------
    # CoreOS Image: Download (Online Mode)
    # -------------------------------------------------------------------------
    - name: Download CoreOS image
      when: not coreos_image_exists
      block:
        - name: Try to download CoreOS image directly on Proxmox
          proxmox_shell:
            api_host: "{{ proxmox_host }}"
            api_port: "{{ proxmox_port }}"
            api_user: "{{ proxmox_user }}"
            node: "{{ proxmox_node }}"
            pve_auth_cookie: "{{ proxmox_ticket }}"
            proxmox_csrf_token: "{{ proxmox_csrf }}"
            timeout: 600
            command: >-
              cd {{ proxmox_iso_storage_path }} &&
              curl -fLO {{ infravm_coreos_url }} &&
              xz -d {{ infravm_coreos_xz_filename }} &&
              ln -f {{ infravm_coreos_qcow2_filename }} {{ infravm_coreos_iso_filename }} &&
              echo "SUCCESS"
          register: proxmox_download
          failed_when: false

        - name: Fallback to local download and upload
          when: "'SUCCESS' not in (proxmox_download.stdout | default(''))"
          block:
            - name: Ensure local download directory exists
              ansible.builtin.file:
                path: "{{ infravm_local_download_dir }}"
                state: directory
                mode: "0755"

            - name: Check if local CoreOS ISO exists
              ansible.builtin.stat:
                path: "{{ infravm_local_download_dir }}/{{ infravm_coreos_iso_filename }}"
              register: local_iso_stat

            - name: Download and prepare CoreOS image locally
              when: not local_iso_stat.stat.exists
              block:
                - name: Check if compressed image exists locally
                  ansible.builtin.stat:
                    path: "{{ infravm_local_download_dir }}/{{ infravm_coreos_xz_filename }}"
                  register: local_xz_stat

                - name: Download CoreOS compressed image
                  ansible.builtin.get_url:
                    url: "{{ infravm_coreos_url }}"
                    dest: "{{ infravm_local_download_dir }}/{{ infravm_coreos_xz_filename }}"
                    mode: "0644"
                  when: not local_xz_stat.stat.exists

                - name: Check if uncompressed qcow2 exists
                  ansible.builtin.stat:
                    path: "{{ infravm_local_download_dir }}/{{ infravm_coreos_qcow2_filename }}"
                  register: local_qcow2_stat

                - name: Extract CoreOS image
                  ansible.builtin.command:
                    cmd: "xz -dk {{ infravm_local_download_dir }}/{{ infravm_coreos_xz_filename }}"
                  when: not local_qcow2_stat.stat.exists

                - name: Create ISO-named copy for Proxmox visibility
                  ansible.builtin.copy:
                    src: "{{ infravm_local_download_dir }}/{{ infravm_coreos_qcow2_filename }}"
                    dest: "{{ infravm_local_download_dir }}/{{ infravm_coreos_iso_filename }}"
                    remote_src: true
                    mode: "0644"

            - name: Upload CoreOS image to Proxmox
              ansible.builtin.command:
                cmd: >-
                  curl -k -s
                  -H "Cookie: PVEAuthCookie={{ proxmox_ticket }}"
                  -H "CSRFPreventionToken: {{ proxmox_csrf }}"
                  -F "content=iso"
                  -F "filename=@{{ infravm_local_download_dir }}/{{ infravm_coreos_iso_filename }};type=application/octet-stream;filename={{ infravm_coreos_iso_filename }}"
                  "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/upload"
              register: upload_result
              changed_when: "'UPID' in upload_result.stdout"
              failed_when: "'UPID' not in upload_result.stdout"

            - name: Wait for upload to complete
              ansible.builtin.uri:
                url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content"
                method: GET
                headers:
                  Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
                validate_certs: "{{ proxmox_validate_certs }}"
              register: upload_check
              until: upload_check.json.data | selectattr('volid', 'search', infravm_coreos_iso_filename) | list | length > 0
              retries: 60
              delay: 10

            - name: Create hardlink for qcow2 access on Proxmox
              proxmox_shell:
                api_host: "{{ proxmox_host }}"
                api_port: "{{ proxmox_port }}"
                api_user: "{{ proxmox_user }}"
                node: "{{ proxmox_node }}"
                pve_auth_cookie: "{{ proxmox_ticket }}"
                proxmox_csrf_token: "{{ proxmox_csrf }}"
                timeout: 30
                command: >-
                  cd {{ proxmox_iso_storage_path }} &&
                  ln -f {{ infravm_coreos_iso_filename }} {{ infravm_coreos_qcow2_filename }} &&
                  echo "SUCCESS"
              register: hardlink_result
              failed_when: "'SUCCESS' not in (hardlink_result.stdout | default(''))"

    # -------------------------------------------------------------------------
    # Ignition Configuration (via Butane)
    # -------------------------------------------------------------------------
    - name: Create temporary directory for Ignition build
      ansible.builtin.tempfile:
        state: directory
        prefix: sophon_infravm_
      register: _infravm_tmpdir

    - name: Generate yescrypt password hash
      ansible.builtin.set_fact:
        infravm_password_hash: "{{ lookup('pipe', 'echo ' ~ (infravm_password | quote) ~ ' | mkpasswd --method=yescrypt --stdin') }}"

    - name: Generate Butane config from template
      ansible.builtin.template:
        src: "{{ infravm_butane_template }}"
        dest: "{{ _infravm_tmpdir.path }}/{{ infravm_vm_name }}.bu"
        mode: "0644"

    - name: Convert Butane to Ignition JSON
      ansible.builtin.command:
        cmd: "butane --strict {{ _infravm_tmpdir.path }}/{{ infravm_vm_name }}.bu"
      register: ignition_result
      changed_when: false

    - name: Base64 encode the ignition config
      ansible.builtin.set_fact:
        ignition_b64: "{{ ignition_result.stdout | b64encode }}"

    - name: Create wrapper ignition config with merge directive
      ansible.builtin.set_fact:
        wrapper_config:
          ignition:
            version: "3.4.0"
            config:
              merge:
                - source: "data:;base64,{{ ignition_b64 }}"

    - name: Prepare fw_cfg args string (escape for QEMU)
      ansible.builtin.set_fact:
        args_escaped: "-fw_cfg name=opt/com.coreos/config,string={{ wrapper_config | to_json | regex_replace(': ', ':') | regex_replace(', ', ',') | regex_replace('\"', '\\\\\"') | regex_replace(',', ',,') }}"

    # -------------------------------------------------------------------------
    # VM Creation
    # -------------------------------------------------------------------------
    - name: Build virtio disk configuration
      ansible.builtin.set_fact:
        infravm_virtio_disks:
          virtio0: "{{ proxmox_disk_storage_id }}:0,import-from={{ proxmox_iso_storage_path }}/{{ infravm_coreos_qcow2_filename }},size={{ infravm_disk_size }}"

    - name: Add data disk if specified
      ansible.builtin.set_fact:
        infravm_virtio_disks: "{{ infravm_virtio_disks | combine({'virtio1': proxmox_disk_storage_id ~ ':' ~ (infravm_data_disk_size | regex_replace('[Gg]$', ''))}) }}"
      when: infravm_data_disk_size | default('') | length > 0

    - name: Create InfraVM on Proxmox
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_host }}"
        api_port: "{{ proxmox_port }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        node: "{{ proxmox_node }}"
        name: "{{ infravm_vm_name }}"
        cores: "{{ infravm_cores }}"
        memory: "{{ infravm_memory }}"
        cpu: "{{ infravm_cpu_type }}"
        ostype: "l26"
        onboot: true
        autostart: true
        agent: "enabled=1"
        net:
          net0: "virtio,bridge={{ vnet_interface }},tag={{ vnet_vlan }}"
        state: present
        timeout: 600
        virtio: "{{ infravm_virtio_disks }}"
        boot: "order=virtio0"
        args: "{{ args_escaped }}"
      register: vm_create

    # -------------------------------------------------------------------------
    # Cloudflare Tunnel Ingress (bootstrap access to Portainer via tunnel)
    # -------------------------------------------------------------------------
    # On first VM creation, register a tunnel ingress rule so the Ansible
    # controller can reach Portainer at https://portainer-bootstrap.<domain>
    # immediately (before any in-cluster service like CoreDNS/dns_sync is
    # running). The primary portainer.<domain> entry is owned by the
    # dockerdiscovery sync sidecar via the container's cf_tunnel label.
    # Idempotent: merges into existing ingress rules; replaces matching host.
    - name: Configure Cloudflare tunnel ingress for Portainer (bootstrap)
      when:
        - coredns_cf_token | default('') | length > 0
        - coredns_cf_account_id | default('') | length > 0
        - coredns_cf_tunnel_id | default('') | length > 0
        - infravm_portainer_domain | default('') | length > 0
      block:
        - name: Get current Cloudflare tunnel configuration
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/accounts/{{ coredns_cf_account_id }}/cfd_tunnel/{{ coredns_cf_tunnel_id }}/configurations"
            method: GET
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
              Content-Type: "application/json"
            status_code: 200
          register: cf_tunnel_config
          changed_when: false

        - name: Build updated ingress rules (replace/insert portainer-bootstrap host, keep catch-all last)
          ansible.builtin.set_fact:
            _cf_existing_ingress: "{{ cf_tunnel_config.json.result.config.ingress | default([]) }}"
            _cf_portainer_hostname: "portainer-bootstrap.{{ infravm_portainer_domain }}"
            _cf_portainer_rule:
              hostname: "portainer-bootstrap.{{ infravm_portainer_domain }}"
              service: "https://{{ infravm_ip }}:{{ infravm_portainer_port }}"
              originRequest:
                noTLSVerify: true

        - name: Assemble final ingress list with catch-all 404 at end
          ansible.builtin.set_fact:
            _cf_new_ingress: >-
              {{ (_cf_existing_ingress
                  | selectattr('hostname', 'defined')
                  | rejectattr('hostname', 'equalto', _cf_portainer_hostname)
                  | list)
                 + [_cf_portainer_rule]
                 + [{'service': 'http_status:404'}] }}

        - name: Update Cloudflare tunnel configuration with Portainer ingress
          ansible.builtin.uri:
            url: "https://api.cloudflare.com/client/v4/accounts/{{ coredns_cf_account_id }}/cfd_tunnel/{{ coredns_cf_tunnel_id }}/configurations"
            method: PUT
            headers:
              Authorization: "Bearer {{ coredns_cf_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              config:
                ingress: "{{ _cf_new_ingress }}"
                warp-routing: "{{ cf_tunnel_config.json.result.config['warp-routing'] | default({'enabled': false}) }}"
            status_code: 200

        - name: Ensure DNS CNAME for portainer-bootstrap points at the tunnel
          when: coredns_cf_zone_id | default('') | length > 0
          block:
            - name: Look up existing portainer-bootstrap DNS record
              ansible.builtin.uri:
                url: "https://api.cloudflare.com/client/v4/zones/{{ coredns_cf_zone_id }}/dns_records?name=portainer-bootstrap.{{ infravm_portainer_domain }}"
                method: GET
                headers:
                  Authorization: "Bearer {{ coredns_cf_token }}"
                status_code: 200
              register: cf_dns_lookup
              changed_when: false

            - name: Create portainer-bootstrap CNAME if missing
              ansible.builtin.uri:
                url: "https://api.cloudflare.com/client/v4/zones/{{ coredns_cf_zone_id }}/dns_records"
                method: POST
                headers:
                  Authorization: "Bearer {{ coredns_cf_token }}"
                  Content-Type: "application/json"
                body_format: json
                body:
                  type: "CNAME"
                  name: "portainer-bootstrap.{{ infravm_portainer_domain }}"
                  content: "{{ coredns_cf_tunnel_id }}.cfargotunnel.com"
                  proxied: true
                  ttl: 1
                status_code: [200, 201]
              when: cf_dns_lookup.json.result | length == 0

- name: Get InfraVM config for MAC address
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ infravm_existing_vm.node }}/qemu/{{ infravm_existing_vm.vmid }}/config"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: infravm_config
  when:
    - infravm_existing_vm is defined
    - infravm_existing_vm.vmid is defined

- name: Extract InfraVM MAC address from VM config
  ansible.builtin.set_fact:
    _infravm_mac: "{{ infravm_config.json.data.net0 | regex_search('([0-9A-Fa-f:]{17})') | lower }}"
  when:
    - infravm_config is defined
    - infravm_config.json.data.net0 is defined

# -----------------------------------------------------------------------------
# Set Output Facts
# -----------------------------------------------------------------------------
- name: Set InfraVM output facts
  ansible.builtin.set_fact:
    infravm_vmid: "{{ infravm_existing_vm.vmid if infravm_existing_vm is not none else vm_create.vmid }}"

# -----------------------------------------------------------------------------
# Start VM
# -----------------------------------------------------------------------------
- name: Start InfraVM
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_host }}"
    api_port: "{{ proxmox_port }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ infravm_vmid }}"
    state: started

- name: Display InfraVM creation summary
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════

      Name: {{ infravm_vm_name }}
      VMID: {{ infravm_vmid }}
      IP: {{ infravm_ip }}

      ═══════════════════════════════════════════════════════════════════

# =============================================================================
# Initialize Portainer
# =============================================================================
- name: Wait for Portainer API to be ready
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/status"
    method: GET
    validate_certs: false
    status_code: 200
  register: portainer_status
  until: portainer_status.status | default(-1) == 200
  retries: 60
  delay: 3
  changed_when: false

- name: Check if Portainer admin is already initialized
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/users/admin/check"
    method: GET
    validate_certs: false
    status_code: [204, 404]
  register: portainer_admin_check
  changed_when: false

- name: when block for if admin not initialized
  when: portainer_admin_check.status == 404
  block:
    - name: Generate Portainer admin password
      ansible.builtin.set_fact:
        portainer_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
        portainer_admin_password_generated: true
      when: portainer_admin_password is not defined

    - name: Validate Portainer password meets requirements
      ansible.builtin.assert:
        that:
          - portainer_admin_password | length >= 12
        fail_msg: "Portainer requires password of at least 12 characters. Got {{ portainer_admin_password | length }}."

    - name: Initialize Portainer admin user
      ansible.builtin.uri:
        url: "{{ infravm_portainer_url }}/api/users/admin/init"
        method: POST
        body_format: json
        body:
          Username: "admin"
          Password: "{{ portainer_admin_password }}"
        validate_certs: false
        status_code: [200]
      register: portainer_init

    - name: Display generated Portainer admin credentials
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PORTAINER ADMIN CREDENTIALS (auto-generated - SAVE THESE NOW)"
          - "============================================================"
          - "URL:      {{ infravm_portainer_url }}"
          - "Username: admin"
          - "Password: {{ portainer_admin_password }}"
          - "============================================================"
      when: portainer_admin_password_generated | default(false) | bool

# - name: Warn if admin already exists and password was auto-generated
#   ansible.builtin.debug:
#     msg: "WARNING: Admin already exists. If auth fails, set -e portainer_admin_password=<existing_password>"
#   when: portainer_init_status == '409'

- name: Authenticate with Portainer
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ portainer_admin_password }}"
    validate_certs: false
    status_code: 200
  register: portainer_auth
  changed_when: false

# =============================================================================
# Portainer Business Edition license registration (no-op for CE)
# =============================================================================
# Posts the license key to /api/licenses if not already registered.
# Idempotent: GET /api/licenses returns currently attached licenses; we skip
# the POST if any license with the same key prefix is already present.
- name: Register Portainer Business Edition license
  when: portainer_license_key | default('') | length > 0
  block:
    - name: List currently registered Portainer licenses
      ansible.builtin.uri:
        url: "{{ infravm_portainer_url }}/api/licenses"
        method: GET
        headers:
          Authorization: "Bearer {{ portainer_auth.json.jwt }}"
        validate_certs: false
        status_code: [200, 404]
      register: portainer_licenses
      changed_when: false

    - name: Attach Portainer Business Edition license
      ansible.builtin.uri:
        url: "{{ infravm_portainer_url }}/api/licenses/add"
        method: POST
        headers:
          Authorization: "Bearer {{ portainer_auth.json.jwt }}"
        body_format: json
        body:
          key: "{{ portainer_license_key }}"
        validate_certs: false
        # 200 OK on success; 409 if already attached; some EE versions return
        # 400 with "license already exists" — treat all as non-fatal.
        status_code: [200, 201, 204, 400, 409]
      register: portainer_license_attach
      when: >-
        portainer_licenses.status != 200
        or (portainer_licenses.json | default([]) | length == 0)
      changed_when: portainer_license_attach.status in [200, 201, 204]
      no_log: true

    - name: Display Portainer license status
      ansible.builtin.debug:
        msg: >-
          Portainer Business Edition license
          {{ 'attached' if (portainer_license_attach is defined and portainer_license_attach.changed)
             else 'already present' }}.

- name: Get Portainer endpoints
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
    validate_certs: false
    status_code: 200
  register: portainer_endpoints
  changed_when: false

# - name: debug print portainer_endpoints
#   ansible.builtin.debug:
#     var: portainer_endpoints

- name: Set portainer_local_endpoint to first local endpoint if exists
  ansible.builtin.set_fact:
    portainer_local_endpoint: "{{ portainer_endpoints.json | selectattr('Type', 'eq', 1) | first }}"
    portainer_local_endpoint_id: "{{ (portainer_endpoints.json | selectattr('Type', 'eq', 1) | first)['Id'] }}"
  when: portainer_endpoints.json | length > 0

- name: Create local Docker endpoint if none exist
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/endpoints"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_auth.json.jwt }}"
      Content-Type: "multipart/form-data"
    body_format: form-multipart
    body:
      Name: "local"
      EndpointCreationType: "1"
    validate_certs: false
    status_code: [200, 201]
  register: _portainer_create_endpoint
  when: portainer_local_endpoint_id is not defined

- name: Set endpoint ID from newly created endpoint
  ansible.builtin.set_fact:
    portainer_local_endpoint_id: "{{ _portainer_create_endpoint.json['Id'] }}"
  when: portainer_local_endpoint_id is not defined

- name: Display InfraVM access info
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      InfraVM Deployed Successfully
      ═══════════════════════════════════════════════════════════════════

      Portainer:
        URL: {{ infravm_portainer_url }}
        Username: admin
        Password: {{ portainer_admin_password }}

      VM ID: {{ infravm_vmid | default('N/A') }}

      ═══════════════════════════════════════════════════════════════════
