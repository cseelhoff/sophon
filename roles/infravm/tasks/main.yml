---
# =============================================================================
# InfraVM Role Tasks
# =============================================================================
# This role:
#   1. Creates the CoreOS VM on Proxmox with Ignition configuration
#   2. Waits for InfraVM to boot and NFS to mount
#   3. Loads container images via SSH (from NFS cache or pull from registry)
#   4. Waits for Portainer and initializes admin password via API

# =============================================================================
# Step 1: Create the CoreOS VM
# =============================================================================
- name: Create InfraVM
  ansible.builtin.include_tasks: create_vm.yml

# =============================================================================
# Step 2: Wait for VM to be ready
# =============================================================================
- name: Debug SSH connection target
  ansible.builtin.debug:
    msg: "Waiting for SSH on host: {{ infravm_ansible_host }}, port: 22"

# - name: Wait for InfraVM SSH to be ready
#   ansible.builtin.wait_for:
#     host: "{{ infravm_ansible_host }}"
#     port: 22
#     delay: 10
#     timeout: 300
#   delegate_to: localhost

- name: Wait for SSH connectivity (tunnel may take time to establish)
  ansible.builtin.command:
    cmd: >
      ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no
      -i {{ infravm_ssh_private_key }}
      {{ infravm_username }}@{{ infravm_ansible_host }}
      echo "SSH connection established"
  delegate_to: localhost
  register: ssh_wait
  until: ssh_wait.rc == 0
  retries: 30
  delay: 3
  changed_when: false
  ignore_errors: false

- name: Debug NFS mount status on InfraVM
  ansible.builtin.raw: |
    echo "=== Mount status ==="
    mount | grep nfs || echo "No NFS mounts found"
    echo "=== systemctl status var-mnt-nfs.mount ==="
    systemctl status var-mnt-nfs.mount --no-pager 2>&1 || true
    echo "=== journalctl for mount ==="
    journalctl -u var-mnt-nfs.mount --no-pager -n 20 2>&1 || true
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: nfs_debug
  ignore_errors: true

- name: Show NFS debug output
  ansible.builtin.debug:
    var: nfs_debug.stdout

- name: Wait for NFS mount on InfraVM
  ansible.builtin.raw: mountpoint -q /var/mnt/nfs
  register: nfs_mount_check
  until: nfs_mount_check.rc == 0
  retries: 30
  delay: 5
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

# =============================================================================
# Load Container Images via SSH
# =============================================================================
- name: Load container images on InfraVM
  block:
    - name: Check and load each container image
      ansible.builtin.raw: >-
        IMAGE="{{ item }}";
        IMAGE_NO_TAG=$(echo "$IMAGE" | sed 's|:.*||');
        ORG_NAME=$(echo "$IMAGE_NO_TAG" | rev | cut -d'/' -f1-2 | rev | tr '/' '-');
        TAG=$(echo "$IMAGE" | sed 's|.*:||');
        TARFILE="/var/mnt/nfs/containers/${ORG_NAME}_${TAG}.tar";
        if podman image exists "$IMAGE" 2>/dev/null; then
          echo "ALREADY_LOADED"; exit 0;
        fi;
        if [ -f "$TARFILE" ]; then
          podman load -i "$TARFILE"; echo "LOADED_FROM_NFS"; exit 0;
        fi;
        podman pull "$IMAGE";
        if touch /var/mnt/nfs/containers/.write_test 2>/dev/null; then
          rm -f /var/mnt/nfs/containers/.write_test;
          podman save -o "$TARFILE" "$IMAGE";
          echo "PULLED_AND_CACHED";
        else
          echo "PULLED_NO_CACHE";
        fi
      loop: "{{ infravm_container_images }}"
      register: container_load_results
      changed_when: "'LOADED_FROM_NFS' in container_load_results.stdout or 'PULLED' in container_load_results.stdout"
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

    - name: Display container loading summary
      ansible.builtin.debug:
        msg: |
          Container Image Loading Summary:
          {% for result in container_load_results.results %}
          - {{ result.item }}: {{ result.stdout | default('unknown') }}
          {% endfor %}

# =============================================================================
# Start Portainer Container (Rootless)
# =============================================================================
- name: Create and start Portainer container with systemd user service
  ansible.builtin.raw: |
    # Clean up any old root-level portainer first
    sudo systemctl stop portainer.service 2>/dev/null || true
    sudo systemctl disable portainer.service 2>/dev/null || true
    sudo podman rm -f portainer 2>/dev/null || true

    # Check if portainer user service already exists and is running
    if systemctl --user is-active portainer.service >/dev/null 2>&1; then
      echo "ALREADY_RUNNING"
      exit 0
    fi

    # Enable lingering so user services persist after logout
    loginctl enable-linger $(whoami)

    # Enable and start podman socket for rootless podman
    systemctl --user enable --now podman.socket

    # Wait for socket to appear
    SOCKET_PATH="/run/user/$(id -u)/podman/podman.sock"
    for i in 1 2 3 4 5; do
      [ -S "$SOCKET_PATH" ] && break
      sleep 1
    done

    # Remove existing container if present
    podman rm -f portainer 2>/dev/null || true

    # Unmask service if previously masked
    systemctl --user unmask portainer.service 2>/dev/null || true

    # Create portainer data volume if not exists
    podman volume create portainer_data 2>/dev/null || true

    # Run the container with SELinux label disabled for socket access
    podman run -d \
      --name portainer \
      --restart always \
      --security-opt label=disable \
      -p {{ portainer_port }}:9443 \
      -v "$SOCKET_PATH":/var/run/docker.sock \
      -v portainer_data:/data:Z \
      docker.io/portainer/portainer-ce:{{ portainer_image_tag }}

    # Generate systemd user unit file from running container
    mkdir -p ~/.config/systemd/user
    podman generate systemd --name portainer --new > ~/.config/systemd/user/portainer.service

    # Reload systemd user daemon and enable the service
    systemctl --user daemon-reload
    systemctl --user enable portainer.service

    echo "STARTED"
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_start
  changed_when: "'STARTED' in portainer_start.stdout"

- name: Show Portainer start result
  ansible.builtin.debug:
    var: portainer_start.stdout

# =============================================================================
# Initialize Portainer
# =============================================================================
- name: Generate Portainer admin password
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  when: portainer_admin_password is not defined

- name: Validate Portainer password meets requirements
  ansible.builtin.assert:
    that:
      - portainer_admin_password | length >= 12
    fail_msg: "Portainer requires password of at least 12 characters. Got {{ portainer_admin_password | length }}."

- name: Debug Portainer status on InfraVM
  ansible.builtin.raw: |
    echo "=== Podman containers ==="
    podman ps -a 2>&1 || echo "podman ps failed"
    echo "=== Listening ports ==="
    ss -tlnp 2>&1 | grep -E ':(9443|9000)' || echo "No Portainer ports listening"
    echo "=== Curl test ==="
    curl -sk -v "https://{{ infravm_ip }}:{{ portainer_port }}/api/status" 2>&1 || echo "curl failed"
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_debug
  ignore_errors: true

- name: Show Portainer debug output
  ansible.builtin.debug:
    var: portainer_debug.stdout

- name: Wait for Portainer API to be ready
  ansible.builtin.raw: |
    curl -sk -o /dev/null -w '%{http_code}' "https://{{ infravm_ip }}:{{ portainer_port }}/api/status" | grep -q 200
  register: portainer_status
  until: portainer_status.rc == 0
  retries: 60
  delay: 3
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

- name: Initialize Portainer admin user
  ansible.builtin.raw: |
    curl -sk -X POST "https://{{ infravm_ip }}:{{ portainer_port }}/api/users/admin/init" \
      -H "Content-Type: application/json" \
      -d '{"Username":"admin","Password":"{{ portainer_admin_password }}"}' \
      -w '\n%{http_code}' | tail -1
  register: portainer_init
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

- name: Set portainer init status
  ansible.builtin.set_fact:
    portainer_init_status: "{{ portainer_init.stdout | trim }}"

- name: Warn if admin already exists and password was auto-generated
  ansible.builtin.debug:
    msg: "WARNING: Admin already exists. If auth fails, set -e portainer_admin_password=<existing_password>"
  when: portainer_init_status == '409'

- name: Display InfraVM access info
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      InfraVM Deployed Successfully
      ═══════════════════════════════════════════════════════════════════

      SSH Access:
        Host: {{ infravm_ansible_host }}
        User: {{ infravm_username }}
        Command: ssh {{ infravm_username }}@{{ infravm_ansible_host }}

      Portainer:
        URL: https://{{ infravm_ansible_host }}:{{ portainer_port }}
        Username: admin
        Password: {{ portainer_admin_password }}
        {{ '(existing admin - password unchanged)' if portainer_init_status == '409' else '' }}

      NFS Mount: /var/mnt/nfs -> {{ nfs_server_ip }}:/export
      VM ID: {{ infravm_vmid | default('N/A') }}
      {% if cloudflared_tunnel_token | default('') != '' %}
      Cloudflared: Tunnel active (token configured)
      {% endif %}

      ═══════════════════════════════════════════════════════════════════
