---
# =============================================================================
# InfraVM Role Tasks
# =============================================================================
# This role:
#   1. Creates the CoreOS VM on Proxmox with Ignition configuration
#   2. Waits for InfraVM to boot and NFS to mount
#   3. Loads container images via SSH (from NFS cache or pull from registry)
#   4. Waits for Portainer and initializes admin password via API

# =============================================================================
# Step 1: Create the CoreOS VM
# =============================================================================
# =============================================================================
# InfraVM - Create CoreOS VM on Proxmox
# =============================================================================
# Creates the CoreOS VM with Ignition configuration passed via fw_cfg.

# -----------------------------------------------------------------------------
# Validate Required Variables
# -----------------------------------------------------------------------------
- name: Validate required InfraVM variables
  ansible.builtin.assert:
    that:
      - infravm_vm_name is defined
      - infravm_ip is defined
      - proxmox_vnet_gateway is defined
      - infravm_butane_template is defined
    fail_msg: "Required variables: infravm_vm_name, infravm_ip, proxmox_vnet_gateway, infravm_butane_template"

# -----------------------------------------------------------------------------
# VM Existence Check
# -----------------------------------------------------------------------------


- name: Set existing VM fact
  ansible.builtin.set_fact:
    infravm_existing_vm: "{{ proxmox_existing_vms.json.data | selectattr('name', 'eq', infravm_vm_name) | list | first | default(none) }}"

- name: Display existing VM info
  ansible.builtin.debug:
    msg: "Found existing VM '{{ infravm_vm_name }}' with VMID {{ infravm_existing_vm.vmid }} - skipping creation"
  when: infravm_existing_vm is not none

# -----------------------------------------------------------------------------
# CoreOS Image and VM Creation (only if VM doesn't exist)
# -----------------------------------------------------------------------------
- name: Prepare and create CoreOS VM
  when: infravm_existing_vm is none
  block:
    # -------------------------------------------------------------------------
    # CoreOS Image: Check if exists on Proxmox
    # -------------------------------------------------------------------------
    - name: Check if CoreOS image exists in Proxmox storage
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: storage_content

    - name: Set image exists fact
      ansible.builtin.set_fact:
        coreos_image_exists: "{{ storage_content.json.data | selectattr('volid', 'search', infravm_coreos_iso_filename) | list | length > 0 }}"

    # -------------------------------------------------------------------------
    # CoreOS Image: Download (Online Mode)
    # -------------------------------------------------------------------------
    - name: Download CoreOS image
      when: not coreos_image_exists
      block:
        - name: Try to download CoreOS image directly on Proxmox
          proxmox_shell:
            api_host: "{{ proxmox_host }}"
            api_port: "{{ proxmox_port }}"
            api_user: "{{ proxmox_user }}"
            node: "{{ proxmox_node }}"
            pve_auth_cookie: "{{ proxmox_ticket }}"
            proxmox_csrf_token: "{{ proxmox_csrf }}"
            timeout: 600
            command: >-
              cd {{ proxmox_iso_storage_path }} &&
              curl -fLO {{ infravm_coreos_url }} &&
              xz -d {{ infravm_coreos_xz_filename }} &&
              ln -f {{ infravm_coreos_qcow2_filename }} {{ infravm_coreos_iso_filename }} &&
              echo "SUCCESS"
          register: proxmox_download
          failed_when: false

        - name: Fallback to local download and upload
          when: "'SUCCESS' not in (proxmox_download.stdout | default(''))"
          block:
            - name: Ensure local download directory exists
              ansible.builtin.file:
                path: "{{ coreos_local_download_dir }}"
                state: directory
                mode: "0755"

            - name: Check if local CoreOS ISO exists
              ansible.builtin.stat:
                path: "{{ coreos_local_download_dir }}/{{ infravm_coreos_iso_filename }}"
              register: local_iso_stat

            - name: Download and prepare CoreOS image locally
              when: not local_iso_stat.stat.exists
              block:
                - name: Check if compressed image exists locally
                  ansible.builtin.stat:
                    path: "{{ coreos_local_download_dir }}/{{ infravm_coreos_xz_filename }}"
                  register: local_xz_stat

                - name: Download CoreOS compressed image
                  ansible.builtin.get_url:
                    url: "{{ infravm_coreos_url }}"
                    dest: "{{ coreos_local_download_dir }}/{{ infravm_coreos_xz_filename }}"
                    mode: "0644"
                  when: not local_xz_stat.stat.exists

                - name: Check if uncompressed qcow2 exists
                  ansible.builtin.stat:
                    path: "{{ coreos_local_download_dir }}/{{ infravm_coreos_qcow2_filename }}"
                  register: local_qcow2_stat

                - name: Extract CoreOS image
                  ansible.builtin.command:
                    cmd: "xz -dk {{ coreos_local_download_dir }}/{{ infravm_coreos_xz_filename }}"
                  when: not local_qcow2_stat.stat.exists

                - name: Create ISO-named copy for Proxmox visibility
                  ansible.builtin.copy:
                    src: "{{ coreos_local_download_dir }}/{{ infravm_coreos_qcow2_filename }}"
                    dest: "{{ coreos_local_download_dir }}/{{ infravm_coreos_iso_filename }}"
                    remote_src: true
                    mode: "0644"

            - name: Upload CoreOS image to Proxmox
              ansible.builtin.command:
                cmd: >-
                  curl -k -s
                  -H "Cookie: PVEAuthCookie={{ proxmox_ticket }}"
                  -H "CSRFPreventionToken: {{ proxmox_csrf }}"
                  -F "content=iso"
                  -F "filename=@{{ coreos_local_download_dir }}/{{ infravm_coreos_iso_filename }};type=application/octet-stream;filename={{ infravm_coreos_iso_filename }}"
                  "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/upload"
              register: upload_result
              changed_when: "'UPID' in upload_result.stdout"
              failed_when: "'UPID' not in upload_result.stdout"

            - name: Wait for upload to complete
              ansible.builtin.uri:
                url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content"
                method: GET
                headers:
                  Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
                validate_certs: "{{ proxmox_validate_certs }}"
              register: upload_check
              until: upload_check.json.data | selectattr('volid', 'search', infravm_coreos_iso_filename) | list | length > 0
              retries: 60
              delay: 10

            - name: Create hardlink for qcow2 access on Proxmox
              proxmox_shell:
                api_host: "{{ proxmox_host }}"
                api_port: "{{ proxmox_port }}"
                api_user: "{{ proxmox_user }}"
                node: "{{ proxmox_node }}"
                pve_auth_cookie: "{{ proxmox_ticket }}"
                proxmox_csrf_token: "{{ proxmox_csrf }}"
                timeout: 30
                command: >-
                  cd {{ proxmox_iso_storage_path }} &&
                  ln -f {{ infravm_coreos_iso_filename }} {{ infravm_coreos_qcow2_filename }} &&
                  echo "SUCCESS"
              register: hardlink_result
              failed_when: "'SUCCESS' not in (hardlink_result.stdout | default(''))"

    # -------------------------------------------------------------------------
    # Ignition Configuration (via Butane)
    # -------------------------------------------------------------------------
    - name: Ensure local cache directory exists
      ansible.builtin.file:
        path: "{{ coreos_local_cache_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Butane config from template
      ansible.builtin.template:
        src: "{{ infravm_butane_template }}"
        dest: "{{ coreos_local_cache_dir }}/{{ infravm_vm_name }}.bu"
        mode: "0644"

    - name: Convert Butane to Ignition JSON
      ansible.builtin.command:
        cmd: "butane --strict {{ coreos_local_cache_dir }}/{{ infravm_vm_name }}.bu"
      register: ignition_result
      changed_when: false

    - name: Base64 encode the ignition config
      ansible.builtin.set_fact:
        ignition_b64: "{{ ignition_result.stdout | b64encode }}"

    - name: Create wrapper ignition config with merge directive
      ansible.builtin.set_fact:
        wrapper_config:
          ignition:
            version: "3.4.0"
            config:
              merge:
                - source: "data:;base64,{{ ignition_b64 }}"

    - name: Prepare fw_cfg args string (escape for QEMU)
      ansible.builtin.set_fact:
        args_escaped: "-fw_cfg name=opt/com.coreos/config,string={{ wrapper_config | to_json | regex_replace(': ', ':') | regex_replace(', ', ',') | regex_replace('\"', '\\\\\"') | regex_replace(',', ',,') }}"

    # -------------------------------------------------------------------------
    # VM Creation
    # -------------------------------------------------------------------------
    - name: Build virtio disk configuration
      ansible.builtin.set_fact:
        infravm_virtio_disks:
          virtio0: "{{ proxmox_disk_storage_id }}:0,import-from={{ proxmox_iso_storage_path }}/{{ infravm_coreos_qcow2_filename }},size={{ infravm_disk_size }}"

    - name: Add data disk if specified
      ansible.builtin.set_fact:
        infravm_virtio_disks: "{{ infravm_virtio_disks | combine({'virtio1': proxmox_disk_storage_id ~ ':' ~ (infravm_data_disk_size | regex_replace('[Gg]$', ''))}) }}"
      when: infravm_data_disk_size | default('') | length > 0

    - name: Create InfraVM on Proxmox
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_host }}"
        api_port: "{{ proxmox_port }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        node: "{{ proxmox_node }}"
        name: "{{ infravm_vm_name }}"
        cores: "{{ infravm_cores }}"
        memory: "{{ infravm_memory }}"
        ostype: "l26"
        onboot: true
        autostart: true
        agent: "enabled=1"
        net:
          net0: "virtio,bridge={{ proxmox_vnet }}"
        state: present
        timeout: 600
        virtio: "{{ infravm_virtio_disks }}"
        boot: "order=virtio0"
        args: "{{ args_escaped }}"
      register: vm_create

# -----------------------------------------------------------------------------
# Set Output Facts
# -----------------------------------------------------------------------------
- name: Set InfraVM output facts
  ansible.builtin.set_fact:
    infravm_vmid: "{{ infravm_existing_vm.vmid if infravm_existing_vm is not none else vm_create.vmid }}"
    infravm_vm_created: "{{ infravm_existing_vm is none }}"

# -----------------------------------------------------------------------------
# Start VM
# -----------------------------------------------------------------------------
- name: Start InfraVM
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_host }}"
    api_port: "{{ proxmox_port }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ infravm_vmid }}"
    state: started

- name: Display InfraVM creation summary
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      InfraVM {{ 'created' if infravm_vm_created else 'found' }}
      ═══════════════════════════════════════════════════════════════════
      
      Name: {{ infravm_vm_name }}
      VMID: {{ infravm_vmid }}
      IP: {{ infravm_ip }}
      Status: {{ 'Created new VM' if infravm_vm_created else 'Using existing VM' }}
      
      ═══════════════════════════════════════════════════════════════════


# =============================================================================
# Step 2: Wait for VM to be ready
# =============================================================================
- name: Debug SSH connection target
  ansible.builtin.debug:
    msg: "Waiting for SSH on host: {{ infravm_ansible_host }}, port: 22"

# - name: Wait for InfraVM SSH to be ready
#   ansible.builtin.wait_for:
#     host: "{{ infravm_ansible_host }}"
#     port: 22
#     delay: 10
#     timeout: 300
#   delegate_to: localhost

- name: Wait for SSH connectivity (tunnel may take time to establish)
  ansible.builtin.command:
    cmd: >
      ssh -o BatchMode=yes -o ConnectTimeout=3 -o StrictHostKeyChecking=no
      -i {{ infravm_ssh_private_key }}
      {{ infravm_username }}@{{ infravm_ansible_host }}
      echo "SSH connection established"
  delegate_to: localhost
  register: ssh_wait
  until: ssh_wait.rc == 0
  retries: 30
  delay: 3
  changed_when: false
  ignore_errors: false

- name: Debug NFS mount status on InfraVM
  ansible.builtin.raw: |
    echo "=== Mount status ==="
    mount | grep nfs || echo "No NFS mounts found"
    echo "=== systemctl status var-mnt-nfs.mount ==="
    systemctl status var-mnt-nfs.mount --no-pager 2>&1 || true
    echo "=== journalctl for mount ==="
    journalctl -u var-mnt-nfs.mount --no-pager -n 20 2>&1 || true
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: nfs_debug
  ignore_errors: true

- name: Wait for NFS mount on InfraVM
  ansible.builtin.raw: mountpoint -q /var/mnt/nfs
  register: nfs_mount_check
  until: nfs_mount_check.rc == 0
  retries: 30
  delay: 5
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

# =============================================================================
# Load Container Images via SSH
# =============================================================================
- name: Load container images on InfraVM
  block:
    - name: Check and load each container image
      ansible.builtin.raw: >-
        IMAGE="{{ item }}";
        IMAGE_NO_TAG=$(echo "$IMAGE" | sed 's|:.*||');
        ORG_NAME=$(echo "$IMAGE_NO_TAG" | rev | cut -d'/' -f1-2 | rev | tr '/' '-');
        TAG=$(echo "$IMAGE" | sed 's|.*:||');
        TARFILE="/var/mnt/nfs/containers/${ORG_NAME}_${TAG}.tar";
        if podman image exists "$IMAGE" 2>/dev/null; then
          echo "ALREADY_LOADED"; exit 0;
        fi;
        if [ -f "$TARFILE" ]; then
          podman load -i "$TARFILE"; echo "LOADED_FROM_NFS"; exit 0;
        fi;
        podman pull "$IMAGE";
      loop: "{{ infravm_container_images }}"
      register: container_load_results
      changed_when: "'LOADED_FROM_NFS' in container_load_results.stdout or 'PULLED' in container_load_results.stdout"
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

    - name: Display container loading summary
      ansible.builtin.debug:
        msg: |
          Container Image Loading Summary:
          {% for result in container_load_results.results %}
          - {{ result.item }}: {{ result.stdout | default('unknown') }}
          {% endfor %}

# =============================================================================
# Start Portainer Container (Rootless)
# =============================================================================
- name: Create and start Portainer container
  ansible.builtin.raw: |
    # Check if portainer is already running
    if podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q '^portainer$'; then
      echo "ALREADY_RUNNING"
      exit 0
    fi

    # Enable lingering so containers persist after logout
    loginctl enable-linger $(whoami)

    # Enable podman socket for rootless podman
    systemctl --user enable --now podman.socket

    # Wait for socket to appear
    SOCKET_PATH="/run/user/$(id -u)/podman/podman.sock"
    for i in 1 2 3 4 5; do
      [ -S "$SOCKET_PATH" ] && break
      sleep 1
    done

    # Remove existing stopped container if present
    podman rm -f portainer 2>/dev/null || true

    # Create portainer data volume if not exists
    podman volume create portainer_data 2>/dev/null || true

    # Run the container with restart policy
    podman run -d \
      --name portainer \
      --restart always \
      --security-opt label=disable \
      -p {{ portainer_port }}:9443 \
      -v "$SOCKET_PATH":/var/run/docker.sock \
      -v portainer_data:/data:Z \
      docker.io/portainer/portainer-ce:{{ portainer_image_tag }}

    echo "STARTED"
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_start
  changed_when: "'STARTED' in portainer_start.stdout"

- name: Show Portainer start result
  ansible.builtin.debug:
    var: portainer_start.stdout

# =============================================================================
# Initialize Portainer
# =============================================================================
- name: Generate Portainer admin password
  ansible.builtin.set_fact:
    portainer_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  when: portainer_admin_password is not defined

- name: Validate Portainer password meets requirements
  ansible.builtin.assert:
    that:
      - portainer_admin_password | length >= 12
    fail_msg: "Portainer requires password of at least 12 characters. Got {{ portainer_admin_password | length }}."

- name: Wait for Portainer API to be ready
  ansible.builtin.raw: |
    curl -sk -o /dev/null -w '%{http_code}' "https://{{ infravm_ip }}:{{ portainer_port }}/api/status" | grep -q 200
  register: portainer_status
  until: portainer_status.rc == 0
  retries: 60
  delay: 3
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

- name: Initialize Portainer admin user
  ansible.builtin.raw: |
    curl -sk -X POST "https://{{ infravm_ip }}:{{ portainer_port }}/api/users/admin/init" \
      -H "Content-Type: application/json" \
      -d '{"Username":"admin","Password":"{{ portainer_admin_password }}"}' \
      -w '\n%{http_code}' | tail -1
  register: portainer_init
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"

- name: Set portainer init status
  ansible.builtin.set_fact:
    portainer_init_status: "{{ portainer_init.stdout | trim }}"

- name: Warn if admin already exists and password was auto-generated
  ansible.builtin.debug:
    msg: "WARNING: Admin already exists. If auth fails, set -e portainer_admin_password=<existing_password>"
  when: portainer_init_status == '409'

- name: Display InfraVM access info
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      InfraVM Deployed Successfully
      ═══════════════════════════════════════════════════════════════════

      SSH Access:
        Host: {{ infravm_ansible_host }}
        User: {{ infravm_username }}
        Command: ssh {{ infravm_username }}@{{ infravm_ansible_host }}

      Portainer:
        URL: https://{{ infravm_ansible_host }}:{{ portainer_port }}
        Username: admin
        Password: {{ portainer_admin_password }}
        {{ '(existing admin - password unchanged)' if portainer_init_status == '409' else '' }}

      NFS Mount: /var/mnt/nfs -> {{ nfs_ip }}:/export
      VM ID: {{ infravm_vmid | default('N/A') }}
      {% if infravm_cloudflared_tunnel_token | default('') != '' %}
      Cloudflared: Tunnel active (token configured)
      {% endif %}

      ═══════════════════════════════════════════════════════════════════
