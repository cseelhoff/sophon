---
- name: Find existing InfraVM names without adopting templates or containers
  ansible.builtin.set_fact:
    infravm_named_guests: >-
      {{ _proxmox_existing_vms.json.data
         | selectattr('name', 'eq', infravm_vm_name) | list }}

- name: Reject ambiguous InfraVM names
  ansible.builtin.assert:
    that: infravm_named_guests | length <= 1
    fail_msg: "Multiple guests use the InfraVM name. No guests have been changed."

- name: Validate an existing InfraVM before any modification
  when: infravm_named_guests | length == 1
  block:
    - name: Require a non-template QEMU guest on the selected node
      ansible.builtin.assert:
        that:
          - infravm_named_guests[0].type == 'qemu'
          - infravm_named_guests[0].node == proxmox_node
          - infravm_named_guests[0].template | default(0) | int == 0
        fail_msg: "An incompatible guest already uses the InfraVM name. It has not been changed."
    - name: Read existing InfraVM ownership
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ infravm_named_guests[0].vmid }}/config"
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: infravm_existing_config
    - name: Preserve legacy or unmanaged InfraVM
      ansible.builtin.assert:
        that: infravm_existing_config.json.data.description | default('') == infravm_bootstrap_marker
        fail_msg: "Existing InfraVM is not a two-ISO Sophon deployment. Automatic migration is not supported."

- name: Create a fresh two-ISO InfraVM
  when: infravm_named_guests | length == 0
  block:
    - name: Validate new VM resources
      ansible.builtin.assert:
        that:
          - infravm_cores | int >= 1
          - infravm_memory | int >= 1024
          - infravm_disk_gb | int >= 40
        fail_msg: "Provide valid CPU/memory and at least 40 GiB disk space; installation checks actual artifact capacity."
    - name: Identify media by content to avoid overwriting another guest's mounted ISO
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop: ["{{ infravm_coreos_iso_path }}", "{{ infravm_bundle_iso_path }}"]
      register: infravm_media_files
    - name: Name immutable hypervisor media
      ansible.builtin.set_fact:
        infravm_coreos_iso_name: "sophon-coreos-{{ infravm_media_files.results[0].stat.checksum }}.iso"
        infravm_bundle_iso_name: "sophon-deployment-{{ infravm_media_files.results[1].stat.checksum }}.iso"
    - name: Validate already uploaded immutable media sizes
      ansible.builtin.assert:
        that: >-
          not existing or
          (existing | length == 1 and existing[0].size | int == item.size | int)
        fail_msg: "A hash-named ISO has an unexpected size in Proxmox storage; refusing to overwrite it."
      vars:
        existing: "{{ proxmox_iso_content.json.data | selectattr('volid', 'eq', proxmox_iso_storage_id ~ ':iso/' ~ item.filename) | list }}"
      loop:
        - {filename: "{{ infravm_coreos_iso_name }}", size: "{{ infravm_media_files.results[0].stat.size }}"}
        - {filename: "{{ infravm_bundle_iso_name }}", size: "{{ infravm_media_files.results[1].stat.size }}"}
    - name: Upload the unchanged CoreOS live ISO and Sophon artifact ISO
      ansible.builtin.include_role:
        name: controller
        tasks_from: upload
      vars:
        controller_upload_source: "{{ item.source }}"
        controller_upload_filename: "{{ item.filename }}"
      loop:
        - {source: "{{ infravm_coreos_iso_path }}", filename: "{{ infravm_coreos_iso_name }}"}
        - {source: "{{ infravm_bundle_iso_path }}", filename: "{{ infravm_bundle_iso_name }}"}
      when: >-
        (proxmox_iso_storage_id ~ ':iso/' ~ item.filename) not in
        (proxmox_iso_content.json.data | map(attribute='volid') | list)
    - name: Allocate a fresh VMID
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/cluster/nextid"
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: infravm_nextid
    - name: Create InfraVM with a blank disk and two CD drives
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_host }}"
        api_port: "{{ proxmox_port }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ infravm_nextid.json.data }}"
        name: "{{ infravm_vm_name }}"
        description: "{{ infravm_bootstrap_marker }}"
        cores: "{{ infravm_cores }}"
        memory: "{{ infravm_memory }}"
        cpu: "{{ infravm_cpu_type }}"
        ostype: l26
        onboot: true
        net:
          net0: "model=virtio,bridge={{ vnet_interface }}{{ ',tag=' ~ vnet_vlan if vnet_vlan else '' }}"
        virtio:
          virtio0: "{{ proxmox_disk_storage_id }}:{{ infravm_disk_gb }}"
        ide:
          ide2: "{{ proxmox_iso_storage_id }}:iso/{{ infravm_coreos_iso_name }},media=cdrom"
          ide3: "{{ proxmox_iso_storage_id }}:iso/{{ infravm_bundle_iso_name }},media=cdrom"
        boot: "order=virtio0;ide2"
        serial:
          serial0: socket
        state: present
        timeout: 600
      no_log: true

- name: Remember the InfraVM ID
  ansible.builtin.set_fact:
    infravm_vmid: "{{ infravm_named_guests[0].vmid if infravm_named_guests else infravm_nextid.json.data }}"

- name: Start InfraVM without changing existing disks or installation media
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_host }}"
    api_port: "{{ proxmox_port }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ infravm_vmid }}"
    state: started
  no_log: true
