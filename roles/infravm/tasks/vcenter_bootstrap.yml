---
- name: Provision a blank InfraVM with two immutable ISOs on vCenter
  vcenter_vm:
    url: "{{ vcenter_url }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    ca_file: "{{ vcenter_ca_file }}"
    datacenter: "{{ vcenter_datacenter }}"
    cluster: "{{ vcenter_cluster }}"
    datastore: "{{ vcenter_datastore }}"
    network: "{{ vcenter_network }}"
    folder: "{{ vcenter_folder }}"
    name: "{{ infravm_vm_name }}"
    cores: "{{ infravm_cores }}"
    memory: "{{ infravm_memory }}"
    disk_gb: "{{ infravm_disk_gb }}"
    coreos_iso: "{{ infravm_coreos_iso_path }}"
    bundle_iso: "{{ infravm_bundle_iso_path }}"
  register: infravm_vcenter

- name: Show the selected vCenter VM
  ansible.builtin.debug:
    msg: "Continue in the hypervisor console for {{ infravm_vcenter.vm_path }}."
