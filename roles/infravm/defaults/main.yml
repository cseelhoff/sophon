---
# =============================================================================
# InfraVM Role - CoreOS VM running all containers
# =============================================================================
# This role creates a CoreOS VM and deploys Portainer + all services.

# Enable/disable this role
infravm_enabled: true

# =============================================================================
# VM Configuration
# =============================================================================
infravm_vm_name: "sophon-infravm"
infravm_cores: 2
infravm_memory: 4096
infravm_disk_size: "32G"

# Network (required - auto-discovered or prompted if not set)
# infravm_ip: "10.0.1.10"
# infravm_gateway: "10.0.1.1"
infravm_cidr: "24"

# User Configuration
infravm_username: "core"
# Default password hash for 'core' user (password: changeme)
# Generate new hash with: mkpasswd --method=yescrypt 'yourpassword'
infravm_password_hash: "$y$j9T$wf0/OmORycv3Xxlk9UeqM1$mgpcsOS5y9GPMgHfDxrpDoimDMM9wuIY4efuYmvRcqA"

# SSH public key for core user (required for Ansible access)
infravm_ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') | default('') }}"

# Butane template location
infravm_butane_template: "{{ playbook_dir }}/roles/infravm/templates/infravm.bu.j2"

# =============================================================================
# Cloudflared Settings (optional - enables tunnel access)
# =============================================================================
# Tunnel token for Cloudflared access to InfraVM
cloudflared_tunnel_token: ""

# Container image for cloudflared
cloudflared_image: "docker.io/cloudflare/cloudflared:latest"

# =============================================================================
# NFS Settings
# =============================================================================
# NFS mount options for InfraVM
infravm_nfs_mount_options: "ro,noatime,vers=4.1"

# =============================================================================
# Portainer Application Settings
# =============================================================================
portainer_image_tag: "2.27.1"
portainer_port: 9443

# =============================================================================
# Container Images (loaded via SSH from Ansible controller)
# =============================================================================
# List of container images to load on InfraVM
# These are cached on NFS at /export/containers/<basename>.tar
infravm_container_images:
  - "docker.io/portainer/portainer-ce:{{ portainer_image_tag }}"
  - "docker.io/coredns/coredns:1.12.0"
  - "docker.io/library/traefik:v3.2"
  - "docker.io/gitea/gitea:1.21"
  - "docker.io/sonatype/nexus3:3.72.0"
  - "docker.io/osixia/openldap:1.5.0"
  - "docker.io/osixia/phpldapadmin:0.9.0"
  - "docker.io/cloudflare/cloudflared:latest"  # For optional tunnel access

# =============================================================================
# CoreOS Image
# =============================================================================
coreos_qcow2_url: "https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/43.20251214.3.0/x86_64/fedora-coreos-43.20251214.3.0-qemu.x86_64.qcow2.xz"
coreos_qcow2_xz_filename: "{{ coreos_qcow2_url | basename }}"
coreos_qcow2_img_filename: "{{ coreos_qcow2_xz_filename | regex_replace('\\.xz$', '') }}"
coreos_qcow2_iso_filename: "{{ coreos_qcow2_img_filename }}.iso"

# Proxmox storage for the CoreOS image
coreos_image_storage: "local"
coreos_image_storage_path: "/var/lib/vz/template/iso"

# =============================================================================
# Local Cache/Download Directories
# =============================================================================
coreos_local_cache_dir: "/tmp/sophon_cache"
coreos_local_download_dir: "/tmp/sophon_images"
