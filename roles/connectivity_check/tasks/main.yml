---
# =============================================================================
# Connectivity Check Role - Tests NFS reachability from Bootstrap
# =============================================================================
# Determines if Bootstrap can directly access the NFS server network.
# If not, and cloudflared_tunnel_token is set, cloudflared will be used.

- name: Skip connectivity check if disabled
  ansible.builtin.meta: end_play
  when: not (connectivity_check_enabled | default(true))

- name: Validate NFS server IP is set
  ansible.builtin.fail:
    msg: "connectivity_check_nfs_server must be set (typically nfs_server_ip)"
  when: connectivity_check_nfs_server | length == 0

# -----------------------------------------------------------------------------
# NFS Connectivity Test (actual mount test)
# -----------------------------------------------------------------------------
- name: Create temporary mount point
  ansible.builtin.tempfile:
    state: directory
    prefix: nfs_test_
  register: nfs_temp_mount
  delegate_to: localhost

- name: Test NFS mount
  ansible.builtin.shell:
    cmd: |
      # Try to mount NFS share using fuse-nfs (no root required)
      if fuse-nfs -n nfs://{{ connectivity_check_nfs_server }}{{ connectivity_check_nfs_export }} {{ nfs_temp_mount.path }} 2>/dev/null; then
        echo "NFS_REACHABLE"
        exit 0
      else
        echo "NFS_UNREACHABLE"
        exit 1
      fi
  register: nfs_check_result
  failed_when: false
  changed_when: false
  delegate_to: localhost

- name: Set NFS reachability fact
  ansible.builtin.set_fact:
    nfs_reachable: "{{ nfs_check_result.rc == 0 }}"

# -----------------------------------------------------------------------------
# Cloudflared Decision
# -----------------------------------------------------------------------------
- name: Set cloudflared enabled fact
  ansible.builtin.set_fact:
    cloudflared_enabled: "{{ (not nfs_reachable) and (cloudflared_tunnel_token | default('') != '') }}"

- name: Display connectivity summary
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════
      Bootstrap Connectivity Check
      ═══════════════════════════════════════════════════════════
      NFS Server:       {{ connectivity_check_nfs_server }}
      NFS Reachable:    {{ nfs_reachable }}
      ───────────────────────────────────────────────────────────
      Cloudflared Token Set: {{ 'Yes' if cloudflared_tunnel_token | default('') != '' else 'No' }}
      Cloudflared Enabled:   {{ cloudflared_enabled }}
      ═══════════════════════════════════════════════════════════

- name: Fail if NFS unreachable and no cloudflared token
  ansible.builtin.fail:
    msg: |
      ═══════════════════════════════════════════════════════════
      ERROR: Cannot reach NFS server and no cloudflared token set
      ═══════════════════════════════════════════════════════════
      
      Bootstrap cannot mount NFS at {{ connectivity_check_nfs_server }}:{{ connectivity_check_nfs_export }}
      
      Options:
      1. Ensure network connectivity to {{ connectivity_check_nfs_server }}
      2. Provide cloudflared tunnel token for tunnel access:
         
         ansible-playbook site.yml -e cloudflared_tunnel_token="your-tunnel-token"
      
      ───────────────────────────────────────────────────────────
      How to get a Cloudflare Tunnel token (requires free account):
      ───────────────────────────────────────────────────────────
      1. Log in at https://dash.cloudflare.com (create free account if needed)
      2. Open Zero Trust dashboard: https://one.dash.cloudflare.com
      3. Go to Networks > Tunnels in the left menu
      4. Click "Create a tunnel"
      5. Select "Cloudflared" as connector type, click Next
      6. Name your tunnel (e.g., "ssh-tunnel"), click "Save tunnel"
      7. Find the token in the install command (starts with "eyJ...")
      8. Copy the full token string
      9. Configure public hostname to match your infravm_ansible_host:
         - Click "Add a public hostname"
         - Subdomain: enter the hostname part (e.g., "infra" for infra.example.com)
         - Domain: select your domain from the dropdown
         - Service Type: SSH
         - URL: localhost:22
         - Click "Save hostname"
      
      Your current infravm_ansible_host is set to: {{ infravm_ansible_host | default('(not set)') }}
      
      ═══════════════════════════════════════════════════════════
  when:
    - not nfs_reachable
    - cloudflared_tunnel_token | default('') == ''
