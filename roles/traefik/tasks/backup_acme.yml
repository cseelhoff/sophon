---
# Snapshot the live /data/acme.json from the running traefik container to
# {{ traefik_acme_backup_path }} over the container engine socket. Idempotent;
# safe to run on every deploy. Missing /data/acme.json is treated as a no-op.

- name: Ensure local acme artifacts directory exists
  ansible.builtin.file:
    path: "{{ traefik_acme_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Create temporary directory for acme.json download
  ansible.builtin.tempfile:
    state: directory
    prefix: sophon-acme-backup-
  register: _traefik_acme_dl_dir
  delegate_to: localhost
  changed_when: false

- name: Download acme.json from traefik container
  block:
    - name: Copy acme.json from traefik container
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
          - cp
          - traefik:/data/acme.json
          - "{{ _traefik_acme_dl_dir.path }}/acme.json"
      register: _traefik_acme_dl
      changed_when: false
      failed_when: false
      until: >-
        _traefik_acme_dl.rc == 0 or
        (
          not ((_traefik_acme_dl.stderr | default('') | lower) is search('no such container: traefik')) and
          ((_traefik_acme_dl.stderr | default('') | lower) is search('could not find|no such file|not exist|stat.*/data/acme\.json'))
        )
      retries: 10
      delay: 2
      no_log: true

    - name: Require acme.json copy or an unpopulated store
      ansible.builtin.assert:
        that: >-
          _traefik_acme_dl.rc == 0 or
          ((_traefik_acme_dl.stderr | default('') | lower) is search('could not find|no such file|not exist|stat.*/data/acme\.json'))
        fail_msg: "Failed to snapshot acme.json from the traefik container."

    - name: Skip acme.json backup (not yet present in container)
      ansible.builtin.debug:
        msg: >-
          No /data/acme.json in traefik container yet — nothing to back up.
          First cert issuance is asynchronous; rerun this task later.
      when: _traefik_acme_dl.rc != 0

    - name: Persist downloaded acme.json
      when: _traefik_acme_dl.rc == 0
      block:
        - name: Install downloaded acme.json with restrictive permissions
          ansible.builtin.copy:
            src: "{{ _traefik_acme_dl_dir.path }}/acme.json"
            dest: "{{ traefik_acme_backup_path }}"
            remote_src: true
            mode: "0600"
          delegate_to: localhost
          no_log: true

        - name: Report acme.json backup success
          ansible.builtin.debug:
            msg: "Backed up acme.json to {{ traefik_acme_backup_path }}"
  always:
    - name: Remove temporary download directory
      ansible.builtin.file:
        path: "{{ _traefik_acme_dl_dir.path }}"
        state: absent
      delegate_to: localhost
      changed_when: false
