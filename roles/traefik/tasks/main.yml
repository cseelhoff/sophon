---
# Deploy Traefik through Portainer's HTTP API (no SSH).

# Without egress (no Cloudflare token) or on an explicit refresh, certificates
# can only come from the imported certificate file, so it must be complete and trusted.
- name: Validate imported certificates
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/src/certificates.py"
      - check
      - --source
      - "{{ traefik_acme_backup_path }}"
      - --domain
      - "{{ domain_name }}"
  when: coredns_cf_token | default('', true) == '' or traefik_acme_replace_existing | bool
  changed_when: false

- name: Seed acme.json into the traefik_data volume before the stack starts
  ansible.builtin.include_tasks: restore_acme.yml
  tags: [traefik-restore-acme]

- name: Deploy Traefik stack via Portainer
  ansible.builtin.include_role:
    name: portainer_stack
  vars:
    portainer_stack_name: "{{ traefik_compose_project }}"
    portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    portainer_stack_image_tars: "{{ traefik_image_tars }}"

# Snapshot the live acme.json back to artifacts/. A 404 just means Traefik has
# not issued anything yet.
- name: Snapshot acme.json
  ansible.builtin.include_tasks: backup_acme.yml
  tags: [traefik-backup-acme]

- name: Display Traefik status
  ansible.builtin.debug:
    msg: "Traefik ready at https://{{ traefik_fqdn }} (dashboard)"
