---
# Deploy Traefik via Portainer stack

- name: Deploy Traefik
  when: traefik_enabled | default(true)
  block:
    - name: Deploy Traefik stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "traefik"
        portainer_stack_compose_content: |
          services:
            traefik:
              image: docker.io/library/traefik:{{ traefik_image_tag }}
              pull_policy: never
              container_name: traefik
              restart: unless-stopped
              network_mode: host
              volumes:
                - /etc/traefik:/etc/traefik:ro
                - traefik_data:/data
                - /run/podman/podman.sock:/var/run/docker.sock:ro
              command:
                - --api.dashboard=true
                - --api.insecure=true
                - --entrypoints.web.address=:80
                - --entrypoints.websecure.address=:443
                - --providers.docker=true
                - --providers.docker.exposedbydefault=false
                - --providers.file.directory=/etc/traefik
                - --providers.file.watch=true
                - --log.level={{ traefik_log_level }}
          volumes:
            traefik_data:

    - name: Wait for Traefik to be ready
      ansible.builtin.raw: |
        for i in $(seq 1 30); do
          if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:80 2>/dev/null | grep -qE '(200|404|301|302)'; then
            echo "Traefik ready"
            exit 0
          fi
          sleep 2
        done
        echo "Traefik not ready after 60s"
        exit 1
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      changed_when: false

    - name: Display Traefik status
      ansible.builtin.debug:
        msg: "Traefik ready at http://{{ infravm_ip }}:{{ traefik_port_ui }} (dashboard)"
