---
# Deploy Traefik via Portainer stack
# All tasks run from the Ansible controller via HTTP APIs (no SSH required)

- name: Deploy Traefik
  when: traefik_enabled | default(true)
  block:
    # Pre-deploy: seed traefik_data volume from controller-side acme.json
    # backup if one exists. Avoids re-issuing Let's Encrypt certs on every
    # redeploy and protects against the duplicate-cert rate limit.
    - name: Restore acme.json into traefik_data volume (pre-deploy seed)
      ansible.builtin.include_tasks: restore_acme.yml
      when: traefik_acme_restore_on_deploy | default(true)
      tags:
        - traefik-restore-acme
        - acme-restore

    - name: Deploy Traefik stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "{{ traefik_compose_project }}"
        portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"

    # Post-deploy: snapshot acme.json back to controller. No-op (404) until
    # traefik has actually issued a cert — first deploy will report nothing
    # to back up; subsequent runs persist the latest account + certs.
    - name: Snapshot acme.json to local artifacts (post-deploy backup)
      ansible.builtin.include_tasks: backup_acme.yml
      when: traefik_acme_backup_after_deploy | default(true)
      tags:
        - traefik-backup-acme
        - acme-backup

    # - name: Wait for Traefik to be ready
    #   ansible.builtin.uri:
    #     url: "http://{{ infravm_ip }}:{{ traefik_port_http }}"
    #     method: GET
    #     status_code: [200, 301, 302, 404]
    #     validate_certs: false
    #   register: traefik_health
    #   until: traefik_health.status | default(-1) in [200, 301, 302, 404]
    #   retries: 30
    #   delay: 2
    #   changed_when: false

    - name: Display Traefik status
      ansible.builtin.debug:
        msg: "Traefik ready at https://{{ traefik_fqdn }} (dashboard)"
