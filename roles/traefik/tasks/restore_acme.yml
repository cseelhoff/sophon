---
- name: Check for local acme.json backup
  ansible.builtin.stat:
    path: "{{ traefik_acme_backup_path }}"
  register: _traefik_acme_local

- name: Skip acme.json restore (no local backup found)
  ansible.builtin.debug:
    msg: "No local acme.json; online ACME issuance will be used."
  when: not _traefik_acme_local.stat.exists

- name: Seed a new certificate volume or explicitly refresh an existing one
  when: _traefik_acme_local.stat.exists
  block:
    - name: Load the seed helper image from the offline archives
      ansible.builtin.include_role:
        name: compose_stack
        tasks_from: load_images
      vars:
        compose_stack_name: "{{ traefik_compose_project }}"
        compose_stack_image_tars: "{{ traefik_image_tars }}"

    - name: Create private temporary certificate staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: sophon-acme-restore-
      register: _traefik_acme_stage
      changed_when: false

    - name: Inspect and seed the certificate volume
      block:
        - name: Remove any previous seed helper container
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
              - rm
              - -f
              - traefik-acme-seed
          failed_when: false
          changed_when: false

        - name: Create stopped certificate seed helper
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
              - create
              - --name
              - traefik-acme-seed
              - -v
              - "{{ traefik_acme_volume_name }}:/data"
              - "{{ traefik_acme_helper_image }}"
              - /bin/true
          changed_when: false

        - name: Check for an existing live certificate store
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
              - cp
              - traefik-acme-seed:/data/acme.json
              - "{{ _traefik_acme_stage.path }}/live-acme.json"
          register: _traefik_acme_live
          failed_when: >-
            _traefik_acme_live.rc != 0 and
            not ((_traefik_acme_live.stderr | default('') | lower) is search('could not find|no such|not exist|stat'))
          changed_when: false
          no_log: true

        - name: Preserve the existing live store on normal reruns
          ansible.builtin.debug:
            msg: "Keeping live certificates; use sophon-deploy --refresh-certificates for an intentional replacement."
          when: _traefik_acme_live.rc == 0 and not traefik_acme_replace_existing | bool

        - name: Restore the certificate handoff
          when: _traefik_acme_live.rc != 0 or traefik_acme_replace_existing | bool
          block:
            - name: Stop Traefik before explicitly replacing its in-memory certificate state
              ansible.builtin.command:
                argv:
                  - docker
                  - --host
                  - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
                  - stop
                  - -t
                  - "30"
                  - traefik
              register: _traefik_stop
              failed_when: >-
                _traefik_stop.rc != 0 and
                not ((_traefik_stop.stderr | default('') | lower) is search('no such container|not found'))
              when: traefik_acme_replace_existing | bool

            - name: Stage private certificate store with mode 0600
              ansible.builtin.copy:
                src: "{{ traefik_acme_backup_path }}"
                dest: "{{ _traefik_acme_stage.path }}/acme.json"
                mode: "0600"
              changed_when: false
              no_log: true

            - name: Copy the certificate store into the Traefik volume
              ansible.builtin.command:
                argv:
                  - docker
                  - --host
                  - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
                  - cp
                  - --archive
                  - "{{ _traefik_acme_stage.path }}/acme.json"
                  - traefik-acme-seed:/data/acme.json
              changed_when: true
              no_log: true
      always:
        - name: Remove the stopped seed helper
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - "{{ compose_engine_host | default('unix:///var/run/docker.sock') }}"
              - rm
              - -f
              - traefik-acme-seed
          failed_when: false
          changed_when: false
        - name: Remove the private temporary certificate staging directory
          ansible.builtin.file:
            path: "{{ _traefik_acme_stage.path }}"
            state: absent
          changed_when: false
