---
# =============================================================================
# CoreOS Base Role - Shared CoreOS VM Creation
# =============================================================================
# Creates a CoreOS VM on Proxmox with Ignition configuration passed via fw_cfg.
# This role is designed to be included by other roles (portainer, bastion) that
# provide their own Butane templates via coreos_base_butane_template variable.
#
# Required Variables:
#   - coreos_base_vm_name: Name of the VM
#   - coreos_base_ip: Static IP address
#   - coreos_base_gateway: Network gateway
#   - coreos_base_butane_template: Path to Butane template file
#
# Output Facts:
#   - coreos_base_vmid: The VM ID (new or existing)
#   - coreos_base_vm_created: Boolean, true if VM was newly created
#   - coreos_base_existing_vm: The existing VM info (if found)
#
# Depends on: proxmox role (via meta/main.yml)

# -----------------------------------------------------------------------------
# Validate Required Variables
# -----------------------------------------------------------------------------
- name: Validate required coreos_base variables
  ansible.builtin.assert:
    that:
      - coreos_base_vm_name is defined
      - coreos_base_ip is defined
      - coreos_base_gateway is defined
      - coreos_base_butane_template is defined
    fail_msg: "Required variables: coreos_base_vm_name, coreos_base_ip, coreos_base_gateway, coreos_base_butane_template"

# -----------------------------------------------------------------------------
# VM Existence Check
# -----------------------------------------------------------------------------
- name: Check if VM with same name already exists
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: existing_vms

- name: Set existing VM fact
  ansible.builtin.set_fact:
    coreos_base_existing_vm: "{{ existing_vms.json.data | selectattr('name', 'eq', coreos_base_vm_name) | list | first | default(none) }}"

- name: Display existing VM info
  ansible.builtin.debug:
    msg: "Found existing VM '{{ coreos_base_vm_name }}' with VMID {{ coreos_base_existing_vm.vmid }} - skipping creation"
  when: coreos_base_existing_vm is not none

# -----------------------------------------------------------------------------
# CoreOS Image and VM Creation (only if VM doesn't exist)
# -----------------------------------------------------------------------------
- name: Prepare and create CoreOS VM
  when: coreos_base_existing_vm is none
  block:
    # -------------------------------------------------------------------------
    # CoreOS Image: Check if exists on Proxmox
    # -------------------------------------------------------------------------
    - name: Check if CoreOS image exists in Proxmox storage
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/storage/{{ coreos_image_storage }}/content"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: storage_content

    - name: Set image exists fact
      ansible.builtin.set_fact:
        coreos_image_exists: "{{ storage_content.json.data | selectattr('volid', 'search', coreos_qcow2_iso_filename) | list | length > 0 }}"

    # -------------------------------------------------------------------------
    # CoreOS Image: Download (Online Mode)
    # -------------------------------------------------------------------------
    - name: Download CoreOS image
      when: not coreos_image_exists
      block:
        - name: Try to download CoreOS image directly on Proxmox
          proxmox_shell:
            api_host: "{{ proxmox_host }}"
            api_port: "{{ proxmox_port }}"
            api_user: "{{ proxmox_user }}"
            node: "{{ proxmox_node }}"
            pve_auth_cookie: "{{ proxmox_ticket }}"
            proxmox_csrf_token: "{{ proxmox_csrf }}"
            timeout: 600
            command: >-
              cd {{ coreos_image_storage_path }} &&
              curl -fLO {{ coreos_qcow2_url }} &&
              xz -d {{ coreos_qcow2_xz_filename }} &&
              ln -f {{ coreos_qcow2_img_filename }} {{ coreos_qcow2_iso_filename }} &&
              echo "SUCCESS"
          register: proxmox_download
          failed_when: false

        - name: Fallback to local download and upload
          when: "'SUCCESS' not in (proxmox_download.stdout | default(''))"
          block:
            - name: Ensure local download directory exists
              ansible.builtin.file:
                path: "{{ coreos_local_download_dir }}"
                state: directory
                mode: "0755"

            - name: Check if local CoreOS ISO exists
              ansible.builtin.stat:
                path: "{{ coreos_local_download_dir }}/{{ coreos_qcow2_iso_filename }}"
              register: local_iso_stat

            - name: Download and prepare CoreOS image locally
              when: not local_iso_stat.stat.exists
              block:
                - name: Check if compressed image exists locally
                  ansible.builtin.stat:
                    path: "{{ coreos_local_download_dir }}/{{ coreos_qcow2_xz_filename }}"
                  register: local_xz_stat

                - name: Download CoreOS compressed image
                  ansible.builtin.get_url:
                    url: "{{ coreos_qcow2_url }}"
                    dest: "{{ coreos_local_download_dir }}/{{ coreos_qcow2_xz_filename }}"
                    mode: "0644"
                  when: not local_xz_stat.stat.exists

                - name: Check if uncompressed qcow2 exists
                  ansible.builtin.stat:
                    path: "{{ coreos_local_download_dir }}/{{ coreos_qcow2_img_filename }}"
                  register: local_qcow2_stat

                - name: Extract CoreOS image
                  ansible.builtin.command:
                    cmd: "xz -dk {{ coreos_local_download_dir }}/{{ coreos_qcow2_xz_filename }}"
                  when: not local_qcow2_stat.stat.exists

                - name: Create ISO-named copy for Proxmox visibility
                  ansible.builtin.copy:
                    src: "{{ coreos_local_download_dir }}/{{ coreos_qcow2_img_filename }}"
                    dest: "{{ coreos_local_download_dir }}/{{ coreos_qcow2_iso_filename }}"
                    remote_src: true
                    mode: "0644"

            - name: Upload CoreOS image to Proxmox
              ansible.builtin.command:
                cmd: >-
                  curl -k -s
                  -H "Cookie: PVEAuthCookie={{ proxmox_ticket }}"
                  -H "CSRFPreventionToken: {{ proxmox_csrf }}"
                  -F "content=iso"
                  -F "filename=@{{ coreos_local_download_dir }}/{{ coreos_qcow2_iso_filename }};type=application/octet-stream;filename={{ coreos_qcow2_iso_filename }}"
                  "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/storage/{{ coreos_image_storage }}/upload"
              register: upload_result
              changed_when: "'UPID' in upload_result.stdout"
              failed_when: "'UPID' not in upload_result.stdout"

            - name: Wait for upload to complete
              ansible.builtin.uri:
                url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/storage/{{ coreos_image_storage }}/content"
                method: GET
                headers:
                  Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
                validate_certs: "{{ proxmox_validate_certs }}"
              register: upload_check
              until: upload_check.json.data | selectattr('volid', 'search', coreos_qcow2_iso_filename) | list | length > 0
              retries: 60
              delay: 10

            - name: Create hardlink for qcow2 access on Proxmox
              proxmox_shell:
                api_host: "{{ proxmox_host }}"
                api_port: "{{ proxmox_port }}"
                api_user: "{{ proxmox_user }}"
                node: "{{ proxmox_node }}"
                pve_auth_cookie: "{{ proxmox_ticket }}"
                proxmox_csrf_token: "{{ proxmox_csrf }}"
                timeout: 30
                command: >-
                  cd {{ coreos_image_storage_path }} &&
                  ln -f {{ coreos_qcow2_iso_filename }} {{ coreos_qcow2_img_filename }} &&
                  echo "SUCCESS"
              register: hardlink_result
              failed_when: "'SUCCESS' not in (hardlink_result.stdout | default(''))"

    # -------------------------------------------------------------------------
    # Ignition Configuration (via Butane)
    # -------------------------------------------------------------------------
    - name: Ensure local cache directory exists
      ansible.builtin.file:
        path: "{{ coreos_local_cache_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Butane config from caller's template
      ansible.builtin.template:
        src: "{{ coreos_base_butane_template }}"
        dest: "{{ coreos_local_cache_dir }}/{{ coreos_base_vm_name }}.bu"
        mode: "0644"

    - name: Convert Butane to Ignition JSON
      ansible.builtin.command:
        cmd: "butane --strict {{ coreos_local_cache_dir }}/{{ coreos_base_vm_name }}.bu"
      register: ignition_result
      changed_when: false

    - name: Base64 encode the ignition config
      ansible.builtin.set_fact:
        ignition_b64: "{{ ignition_result.stdout | b64encode }}"

    - name: Create wrapper ignition config with merge directive
      ansible.builtin.set_fact:
        wrapper_config:
          ignition:
            version: "3.4.0"
            config:
              merge:
                - source: "data:;base64,{{ ignition_b64 }}"

    - name: Prepare fw_cfg args string (escape for QEMU)
      ansible.builtin.set_fact:
        args_escaped: "-fw_cfg name=opt/com.coreos/config,string={{ wrapper_config | to_json | regex_replace(': ', ':') | regex_replace(', ', ',') | regex_replace('\"', '\\\\\"') | regex_replace(',', ',,') }}"

    # -------------------------------------------------------------------------
    # VM Creation
    # -------------------------------------------------------------------------
    - name: Build virtio disk configuration
      ansible.builtin.set_fact:
        coreos_virtio_disks:
          virtio0: "{{ proxmox_storage }}:0,import-from={{ coreos_image_storage_path }}/{{ coreos_qcow2_img_filename }},size={{ coreos_base_disk_size }}"

    - name: Add data disk if specified
      ansible.builtin.set_fact:
        coreos_virtio_disks: "{{ coreos_virtio_disks | combine({'virtio1': proxmox_storage ~ ':' ~ (coreos_base_data_disk_size | regex_replace('[Gg]$', ''))}) }}"
      when: coreos_base_data_disk_size | default('') | length > 0

    - name: Create CoreOS VM on Proxmox
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_host }}"
        api_port: "{{ proxmox_port }}"
        api_user: "{{ proxmox_user }}"
        api_password: "{{ proxmox_password }}"
        node: "{{ proxmox_node }}"
        name: "{{ coreos_base_vm_name }}"
        cores: "{{ coreos_base_cores }}"
        memory: "{{ coreos_base_memory }}"
        ostype: "l26"
        onboot: true
        autostart: true
        agent: "enabled=1"
        net:
          net0: "virtio,bridge={{ proxmox_vnet | default('vmbr0') }}"
        state: present
        timeout: 600
        virtio: "{{ coreos_virtio_disks }}"
        boot: "order=virtio0"
        args: "{{ args_escaped }}"
      register: vm_create

# -----------------------------------------------------------------------------
# Set Output Facts
# -----------------------------------------------------------------------------
- name: Set coreos_base output facts
  ansible.builtin.set_fact:
    coreos_base_vmid: "{{ coreos_base_existing_vm.vmid if coreos_base_existing_vm is not none else vm_create.vmid }}"
    coreos_base_vm_created: "{{ coreos_base_existing_vm is none }}"

# -----------------------------------------------------------------------------
# Start VM and Wait for Guest Agent
# -----------------------------------------------------------------------------
- name: Start CoreOS VM
  community.proxmox.proxmox_kvm:
    api_host: "{{ proxmox_host }}"
    api_port: "{{ proxmox_port }}"
    api_user: "{{ proxmox_user }}"
    api_password: "{{ proxmox_password }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ coreos_base_vmid }}"
    state: started

- name: Wait for VM to boot and qemu-guest-agent to respond
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ coreos_base_vmid }}/agent/ping"
    method: POST
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      CSRFPreventionToken: "{{ proxmox_csrf }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    status_code: [200, 500]
  register: agent_ping
  until: agent_ping.status == 200
  retries: 60
  delay: 10
  failed_when: false

- name: Display CoreOS VM summary
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      CoreOS VM {{ 'created' if coreos_base_vm_created else 'found' }}
      ═══════════════════════════════════════════════════════════════════
      
      Name: {{ coreos_base_vm_name }}
      VMID: {{ coreos_base_vmid }}
      IP: {{ coreos_base_ip }}
      Status: {{ 'Created new VM' if coreos_base_vm_created else 'Using existing VM' }}
      Guest Agent: {{ 'Responding' if agent_ping.status == 200 else 'Not responding (may still be booting)' }}
      
      ═══════════════════════════════════════════════════════════════════
