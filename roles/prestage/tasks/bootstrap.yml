---
- name: Require local connected preparation
  ansible.builtin.assert:
    that: ansible_connection | default('') == 'local'
    fail_msg: "Prestage runs on the bootstrap laptop using connection: local."

- name: Stage service archives without an NFS VM or Kopia
  ansible.builtin.include_tasks: main.yml
  vars:
    prestage_skip_legacy_nfs: true

- name: Create offline media directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ prestage_coreos_dir }}"
    - "{{ prestage_collections_dir }}"
    - "{{ prestage_bootstrap_dir }}"

- name: Inspect cached stream metadata
  ansible.builtin.stat:
    path: "{{ prestage_coreos_metadata_path }}"
  register: prestage_stream_cache

- name: Download official CoreOS stable stream metadata
  ansible.builtin.get_url:
    url: "{{ prestage_coreos_stream_url }}"
    dest: "{{ prestage_coreos_metadata_path }}"
    mode: "0644"
    force: true
  when: (prestage_force | bool) or not (prestage_stream_cache.stat.isreg | default(false))

- name: Read the stock full live ISO location and digest
  ansible.builtin.set_fact:
    prestage_coreos_media: >-
      {{ (lookup('file', prestage_coreos_metadata_path) | from_json)
         .architectures.x86_64.artifacts.metal.formats.iso.disk }}

- name: Require trusted HTTPS media metadata
  ansible.builtin.assert:
    that:
      - prestage_coreos_media.location is match('^https://builds\.coreos\.fedoraproject\.org/.*\.iso$')
      - prestage_coreos_media.sha256 is match('^[a-f0-9]{64}$')

- name: Inspect cached live ISO checksum
  ansible.builtin.stat:
    path: "{{ prestage_coreos_iso_path }}"
    checksum_algorithm: sha256
  register: prestage_live_iso

- name: Download the unchanged full CoreOS live ISO
  ansible.builtin.get_url:
    url: "{{ prestage_coreos_media.location }}"
    dest: "{{ prestage_coreos_iso_path }}"
    checksum: "sha256:{{ prestage_coreos_media.sha256 }}"
    mode: "0644"
    force: true
  when: >-
    (prestage_force | bool) or
    (prestage_live_iso.stat.checksum | default('') != prestage_coreos_media.sha256)

- name: Read required offline collection names
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import bundle, json; print(json.dumps(bundle.collection_names(bundle.ROOT / 'requirements.yml')))"
    chdir: "{{ playbook_dir }}"
  register: prestage_required_collections
  changed_when: false

- name: Inspect cached collections
  ansible.builtin.stat:
    path: "{{ prestage_collections_dir }}/ansible_collections/{{ item | replace('.', '/') }}"
  loop: "{{ prestage_required_collections.stdout | from_json }}"
  register: prestage_collection_cache

- name: Compare collection requirements with the vendored cache
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop: ["{{ playbook_dir }}/requirements.yml", "{{ prestage_collections_dir }}/requirements.yml"]
  register: prestage_collection_requirements

- name: Vendor collections for disconnected service deployment
  ansible.builtin.command:
    argv: [ansible-galaxy, collection, install, --force-with-deps, --requirements-file, "{{ playbook_dir }}/requirements.yml", --collections-path, "{{ prestage_collections_dir }}"]
  register: prestage_galaxy
  changed_when: "'Installing ' in prestage_galaxy.stdout"
  when: >-
    (prestage_force | bool) or
    (prestage_collection_requirements.results[0].stat.checksum !=
      prestage_collection_requirements.results[1].stat.checksum | default('')) or
    (prestage_collection_cache.results | selectattr('stat.isdir', 'undefined') | list | length > 0) or
    (prestage_collection_cache.results | selectattr('stat.isdir', 'defined') | rejectattr('stat.isdir') | list | length > 0)

- name: Record successfully vendored collection requirements
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/requirements.yml"
    dest: "{{ prestage_collections_dir }}/requirements.yml"
    mode: "0644"

- name: Inspect runner and static installer helper caches
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop: ["{{ prestage_runner_path }}", "{{ prestage_bootstrap_tools_path }}", "{{ prestage_bootstrap_dir }}/toolchain.sha256"]
  register: prestage_tool_cache

- name: Fingerprint the pinned offline toolchain
  ansible.builtin.set_fact:
    prestage_toolchain_revision: "{{ [lookup('file', playbook_dir ~ '/flake.nix'), lookup('file', playbook_dir ~ '/flake.lock')] | to_json | hash('sha256') }}"

- name: Build offline runner and static installer helper
  ansible.builtin.command:
    argv: [nix, build, "{{ item.target }}", --no-link, --print-out-paths]
    chdir: "{{ playbook_dir }}"
  loop:
    - {target: ".#sophon-runner-image", destination: "{{ prestage_runner_path }}", suffix: "", cached: "{{ prestage_tool_cache.results[0].stat.isreg | default(false) }}"}
    - {target: ".#sophon-bootstrap-tools", destination: "{{ prestage_bootstrap_tools_path }}", suffix: "/bin/busybox", cached: "{{ prestage_tool_cache.results[1].stat.isreg | default(false) }}"}
  when: >-
    (prestage_force | bool) or not (item.cached | bool) or
    (prestage_tool_cache.results[2].stat.checksum | default('') !=
      prestage_toolchain_revision | hash('sha256'))
  register: prestage_tool_build
  changed_when: false

- name: Copy the offline tool outputs
  ansible.builtin.copy:
    src: "{{ (item.stdout_lines | last) ~ item.item.suffix }}"
    dest: "{{ item.item.destination }}"
    mode: "0755"
  loop: "{{ prestage_tool_build.results }}"
  when: not (item.skipped | default(false))

- name: Record successfully built offline toolchain
  ansible.builtin.copy:
    content: "{{ prestage_toolchain_revision }}"
    dest: "{{ prestage_bootstrap_dir }}/toolchain.sha256"
    mode: "0644"

- name: Write the complete service archive manifest
  ansible.builtin.copy:
    content: "{{ (prestage_image_tars + [prestage_coredns_tar]) | to_nice_json }}\n"
    dest: "{{ prestage_container_manifest }}"
    mode: "0644"

- name: Build the reusable artifact ISO atomically
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/bundle.py"
      - --output
      - "{{ prestage_bundle_path }}"
      - --runner
      - "{{ prestage_runner_path }}"
      - --bootstrap-tools
      - "{{ prestage_bootstrap_tools_path }}"
      - --collections
      - "{{ prestage_collections_dir }}"
      - --manifest
      - "{{ prestage_container_manifest }}"
      - --portainer-image
      - "{{ portainer_image }}"
      - --portainer-archive
      - "{{ portainer_image_tarname }}"
  changed_when: true
