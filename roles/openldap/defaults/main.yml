---
# OpenLDAP configuration
openldap_enabled: true
openldap_image_name: "osixia/openldap"
openldap_image_tag: "1.5.0"
openldap_phpldapadmin_image_name: "osixia/phpldapadmin"
openldap_phpldapadmin_image_tag: "0.9.0"

# Directories
openldap_data_dir: "/opt/openldap"

# Network ports
openldap_port_ldap: 389
openldap_port_ldaps: 636
openldap_port_admin: 80

# Domain configuration
openldap_organisation: ""
openldap_domain: "{{ domain_name }}"
openldap_base_dn: "dc={{ openldap_domain.split('.')[0] }},dc={{ openldap_domain.split('.')[1] }}"

# Credentials (set via vault in production)
# openldap_admin_password: ""
# openldap_config_password: ""

# TLS settings
openldap_tls_enabled: false
openldap_tls_enforce: false

# Logging
openldap_log_level: 256
