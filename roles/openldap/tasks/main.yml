---
# Deploy OpenLDAP Directory Service via Portainer Stack

- name: Skip openldap deployment (disabled)
  ansible.builtin.debug:
    msg: "OpenLDAP role is disabled (openldap_enabled=false)"
  when: not (openldap_enabled | default(false))

- name: Deploy OpenLDAP
  when: openldap_enabled | default(false)
  block:
    - name: Deploy OpenLDAP stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "openldap"
        portainer_stack_compose_content: |
          services:
            openldap:
              image: docker.io/{{ openldap_image_name }}:{{ openldap_image_tag }}
              pull_policy: never
              container_name: openldap
              restart: unless-stopped
              hostname: ldap
              network_mode: host
              environment:
                - LDAP_LOG_LEVEL={{ openldap_log_level }}
                - LDAP_ORGANISATION={{ openldap_organisation }}
                - LDAP_DOMAIN={{ openldap_domain }}
                - LDAP_ADMIN_PASSWORD={{ openldap_admin_password | default('admin') }}
                - LDAP_CONFIG_PASSWORD={{ openldap_config_password | default('config') }}
                - LDAP_READONLY_USER=false
                - LDAP_RFC2307BIS_SCHEMA=false
                - LDAP_BACKEND=mdb
                - LDAP_TLS={{ openldap_tls_enabled | string | lower }}
                - LDAP_TLS_ENFORCE={{ openldap_tls_enforce | string | lower }}
                - LDAP_REPLICATION=false
                - KEEP_EXISTING_CONFIG=false
                - LDAP_REMOVE_CONFIG_AFTER_SETUP=true
              tty: true
              stdin_open: true
              volumes:
                - openldap_data:/var/lib/ldap
                - openldap_config:/etc/ldap/slapd.d

            phpldapadmin:
              image: docker.io/{{ openldap_phpldapadmin_image_name }}:{{ openldap_phpldapadmin_image_tag }}
              pull_policy: never
              container_name: phpldapadmin
              restart: unless-stopped
              network_mode: host
              environment:
                - PHPLDAPADMIN_LDAP_HOSTS=127.0.0.1
                - PHPLDAPADMIN_HTTPS=false
                - PHPLDAPADMIN_SERVER_ADMIN=admin@{{ openldap_domain }}

          volumes:
            openldap_data:
            openldap_config:

    - name: Wait for OpenLDAP to be ready
      ansible.builtin.uri:
        url: "http://{{ infravm_ip }}:{{ openldap_port_admin }}"
        method: GET
        status_code: [200, 302]
        validate_certs: false
      register: openldap_health
      until: openldap_health.status in [200, 302]
      retries: 30
      delay: 5

    - name: Display OpenLDAP status
      ansible.builtin.debug:
        msg: "OpenLDAP ready - phpLDAPadmin at http://{{ infravm_ip }}:{{ openldap_port_admin }}, LDAP at {{ infravm_ip }}:{{ openldap_port_ldap }}"
