---
- name: Deploy OpenLDAP Compose stack
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_name: "openldap"
    compose_stack_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    compose_stack_image_tars: "{{ openldap_image_tars }}"

- name: Display OpenLDAP status
  ansible.builtin.debug:
    msg: "OpenLDAP ready - LDAPS at {{ infravm_ip }}:{{ openldap_port_ldaps }}"
