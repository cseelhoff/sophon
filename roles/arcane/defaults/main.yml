---
arcane_hostname: "arcane"
arcane_domain: "{{ domain_name }}"
arcane_fqdn: "{{ arcane_hostname }}.{{ arcane_domain | lower | regex_replace('\\.$', '') }}"
arcane_port: 3552
arcane_stacks_dir: "/var/lib/sophon/stacks"
arcane_image_tars:
  - "{{ sophon_containers_dir }}/{{ arcane_image_tarname }}"

arcane_oidc_issuer_url: >-
  https://{{ keycloak_hostname | default('auth') }}.{{ keycloak_domain | default(domain_name) | lower | regex_replace('\.$', '') }}/realms/{{ keycloak_realm }}

arcane_oidc_role_mappings:
  - claimValue: "arcane-admins"
    roleId: "role_admin"

arcane_environment:
  - name: ARCANE_ENCRYPTION_KEY
    value: "{{ arcane_encryption_key }}"
  - name: ARCANE_DEFAULT_ADMIN_USERNAME
    value: "admin"
  - name: ARCANE_DEFAULT_ADMIN_PASSWORD
    value: "{{ arcane_admin_password }}"
  - name: ARCANE_OIDC_CLIENT_SECRET
    value: "{{ keycloak_arcane_client_secret }}"
  - name: ARCANE_OIDC_ROLE_MAPPINGS
    value: "{{ arcane_oidc_role_mappings | to_json }}"
