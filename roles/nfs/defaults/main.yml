---
# =============================================================================
# NFS Server Role - Custom Alpine NFS Server
# =============================================================================
# Deploys a custom-built Alpine Linux VM on Proxmox configured as an NFS server.
# The OS image is built on the Ansible controller using alpine-make-vm-image,
# with NFS services baked in. Data is stored on a separate data disk (/dev/vdb).
#
# Depends on: proxmox role (via meta/main.yml)

# Enable/disable this role
nfs_enabled: true

# =============================================================================
# VM Configuration
# =============================================================================
nfs_vm_name: "sophon-nfs"
nfs_cores: 2
nfs_memory: 4096
nfs_os_disk_size: "10G"     # OS disk (Alpine with NFS services)
nfs_data_disk_size: "100G" # NFS storage disk (/dev/vdb, thin provisioned)

# =============================================================================
# Network Configuration (Static IP Required)
# =============================================================================
# NFS server must have a static IP since other VMs depend on it.
# Gateway and netmask are derived from Proxmox vnet configuration.
nfs_ip: ""  # Required - set via -e or prompted
nfs_dns: "{{ vnet_dns | default('') }}"

# Root password for NFS VM (defaults to proxmox_password if not set)
# Can be overridden with -e nfs_root_password=<password>
# nfs_root_password: "{{ proxmox_password }}"

# =============================================================================
# Alpine Image Build Configuration
# =============================================================================
# The image is built on the Ansible controller using alpine-make-vm-image
# https://github.com/alpinelinux/alpine-make-vm-image

# Alpine version for the custom image
nfs_alpine_version: "3.21"

# Local paths for image building and caching
nfs_build_dir: "{{ playbook_dir }}/artifacts/nfs-vm-build"
nfs_image_filename: "sophon-nfs-alpine.qcow2"
nfs_image_path: "{{ nfs_build_dir }}/{{ nfs_image_filename }}"

# For air-gapped mode: path to prestaged image
nfs_prestaged_image_path: "{{ nfs_content_local_staging_dir }}/{{ nfs_image_filename }}"

# alpine-make-vm-image script location (vendored in files/ or downloaded)
nfs_alpine_make_vm_image_url: "https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/master/alpine-make-vm-image"
nfs_alpine_make_vm_image_path: "{{ nfs_build_dir }}/alpine-make-vm-image"

# Proxmox storage paths
# nfs_image_storage_path is auto-discovered by the proxmox role as
# `proxmox_iso_storage_path` based on `proxmox_iso_storage_id`.
nfs_image_storage: "{{ proxmox_iso_storage_id }}"

# =============================================================================
# NFS Export Configuration
# =============================================================================
# Root export directory (mounted from /dev/vdb - the data disk)
nfs_export_root: "/export"

# Pre-created export directories
nfs_export_paths:
  - "{{ nfs_export_root }}/nexus/docker-proxy"
  - "{{ nfs_export_root }}/nexus/yum-proxy"
  - "{{ nfs_export_root }}/sophon/images"
  - "{{ nfs_export_root }}/sophon/bin"

# NFS export options
nfs_export_options: "rw,sync,no_subtree_check,no_root_squash"

# =============================================================================
# Proxmox Storage Integration
# =============================================================================
# Name for the NFS storage in Proxmox
nfs_storage_name: "sophon-nfs"

# Content types to enable on the Proxmox NFS storage
nfs_proxmox_content_types: "images,iso,backup,snippets"

nfs_root_password: "{{ proxmox_password }}"

# =============================================================================
# Kopia SFTP backend
# =============================================================================
# Kopia connects to this NFS VM via SFTP rather than via an NFS bind-mount,
# because the kernel downgrades NFS bind-mounts to read-only inside any
# non-init user namespace (which rootless containers always live in). SFTP
# is a kopia-native backend and sidesteps the userns/permissions issue
# entirely. The keypair is generated on the Ansible controller at first run,
# the public half is installed into the kopia user's authorized_keys at VM
# build time, and the private half is exposed to the kopia role as an
# Ansible fact (`nfs_kopia_ssh_private_key`).
nfs_kopia_username: "kopia"
nfs_kopia_repo_path: "/export/kopia/repo"
nfs_kopia_ssh_keyfile: "{{ nfs_build_dir }}/kopia_sftp_id_ed25519"
