---
# =============================================================================
# NFS Server Deployment on Proxmox
# =============================================================================
# Deploys a custom-built Alpine Linux NFS server with automatic disk provisioning.
# The Alpine image is built on the Ansible controller using alpine-make-vm-image,
# with NFS services and qemu-guest-agent baked in.
#
# Depends on: proxmox role (via meta/main.yml)

# -----------------------------------------------------------------------------
# NFS Connectivity Check (via Proxmox storage API)
# -----------------------------------------------------------------------------
- name: Check if NFS storage already exists and is online in Proxmox
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/storage"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: nfs_storage_check

- name: Set NFS reachable fact
  ansible.builtin.set_fact:
    nfs_already_reachable: "{{ nfs_storage_check.json.data | selectattr('storage', 'eq', nfs_storage_name) | list | length > 0 }}"

# Always discover the NFS VM (if it exists) and surface its vmid as a fact
# so downstream roles (e.g. kopia) can QGA-exec against it without needing
# to know the VM's name.
- name: Discover NFS VM in Proxmox
  ansible.builtin.set_fact:
    nfs_existing_vm: "{{ proxmox_existing_vms.json.data | selectattr('name', 'eq', nfs_vm_name) | list | first | default(none) }}"

- name: Set nfs_vmid fact for existing VM
  ansible.builtin.set_fact:
    nfs_vmid: "{{ nfs_existing_vm.vmid }}"
  when: nfs_existing_vm is not none

- name: Continue deployment if NFS is not already reachable
  when: not nfs_already_reachable
  block:
    - name: Set existing VM fact
      ansible.builtin.set_fact:
        nfs_server_vm: "{{ nfs_existing_vm }}"

    - name: Proceed with vm build/check if not on Proxmox
      when: not nfs_server_vm
      block:
        # -------------------------------------------------------------------------
        # Check if image exists on Proxmox
        # -------------------------------------------------------------------------
        - name: Set image exists on Proxmox fact
          ansible.builtin.set_fact:
            nfs_image_on_proxmox: "{{ proxmox_iso_content.json.data | selectattr('volid', 'search', nfs_image_filename) | list | length > 0 }}"

        - name: Skip image build if already on Proxmox
          when: not nfs_image_on_proxmox
          block:
            # -------------------------------------------------------------------------
            # Check for Cached Image
            # -------------------------------------------------------------------------
            - name: Check for cached NFS Alpine image
              ansible.builtin.stat:
                path: "{{ nfs_image_path }}"
              register: nfs_image

            # -------------------------------------------------------------------------
            # Build Alpine NFS Image on Controller (uses loop devices, no NBD)
            # -------------------------------------------------------------------------
            - name: Build NFS Alpine image on controller
              when: not nfs_image.stat.exists
              block:
                - name: Create build directory
                  ansible.builtin.file:
                    path: "{{ nfs_build_dir }}"
                    state: directory
                    mode: "0755"

                - name: Copy build-alpine-image script
                  ansible.builtin.copy:
                    src: build-alpine-image
                    dest: "{{ nfs_build_dir }}/build-alpine-image"
                    mode: "0755"

                - name: Create chroot customization script
                  ansible.builtin.copy:
                    dest: "{{ nfs_build_dir }}/nfs-chroot-setup.sh"
                    mode: "0755"
                    content: |
                      #!/bin/sh
                      set -ex

                      # Enable core services
                      rc-update add qemu-guest-agent default
                      rc-update add rpcbind default
                      rc-update add nfs default
                      rc-update add sshd default
                      rc-update add networking boot
                      rc-update add hostname boot

                      # Create export mount point
                      mkdir -p /export
                      chmod 755 /export

                      # Setup default exports file
                      # Use all_squash with anonuid/anongid to allow non-root user mounting
                      echo "/export *(rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=100)" > /etc/exports

                      # Configure hostname
                      echo "{{ nfs_vm_name }}" > /etc/hostname

                      # Configure network interface (DHCP initially, static via QGA later)
                      cat > /etc/network/interfaces <<'IFACE'
                      auto lo
                      iface lo inet loopback

                      auto eth0
                      iface eth0 inet dhcp
                      IFACE

                - name: Build Alpine NFS qcow2 image
                  ansible.builtin.command:
                    cmd: >-
                      {{ nfs_build_dir }}/build-alpine-image
                      --image-size {{ nfs_os_disk_size }}
                      --image-format qcow2
                      --branch v{{ nfs_alpine_version }}
                      --packages "qemu-guest-agent nfs-utils openssh parted e2fsprogs openrc util-linux"
                      --script-chroot {{ nfs_build_dir }}/nfs-chroot-setup.sh
                      {{ nfs_build_dir }}/{{ nfs_image_filename }}
                    # creates: "{{ nfs_build_dir }}"
                  changed_when: true
                  environment:
                    SSL_CERT_FILE: "{{ lookup('env', 'SSL_CERT_FILE') | default('/etc/ssl/certs/ca-certificates.crt', true) }}"
                    NIX_SSL_CERT_FILE: "{{ lookup('env', 'NIX_SSL_CERT_FILE') | default('', true) }}"
                    LIBGUESTFS_BACKEND: "direct"

            # Using curl instead of ansible.builtin.uri because the uri module's
            # form-multipart body base64-encodes binary file payloads, which
            # Proxmox does not accept. See https://github.com/ansible/ansible/issues/73621
            - name: Upload image via curl (as ISO for local storage compatibility) # noqa: command-instead-of-module
              ansible.builtin.shell:
                cmd: >-
                  curl -k -s
                  -H "Cookie: PVEAuthCookie={{ proxmox_ticket }}"
                  -H "CSRFPreventionToken: {{ proxmox_csrf }}"
                  -F "content=iso"
                  -F "filename=@{{ nfs_build_dir }}/{{ nfs_image_filename }};filename={{ nfs_image_filename }}.iso"
                  "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/upload"
              register: nfs_upload_result
              changed_when: true

            # - name: Upload image (as ISO for local storage compatibility)
            #   ansible.builtin.uri:
            #     url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ nfs_image_storage }}/upload"
            #     method: POST
            #     headers:
            #       Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
            #       CSRFPreventionToken: "{{ proxmox_csrf }}"
            #     validate_certs: "{{ proxmox_validate_certs }}"
            #     body_format: form-multipart
            #     body:
            #       content: "iso"
            #       filename: "{{ nfs_image_filename }}.iso"
            #       file: "{{ lookup('file', nfs_build_dir + '/' + nfs_image_filename) }}"
            #   register: nfs_upload_result

            - name: Debug upload result
              ansible.builtin.debug:
                var: nfs_upload_result.stdout

            - name: Parse upload UPID
              ansible.builtin.set_fact:
                nfs_upload_upid: "{{ (nfs_upload_result.stdout | from_json).data | default('') }}"
              when: nfs_upload_result.stdout is defined and 'data' in nfs_upload_result.stdout

            - name: Debug upload UPID
              ansible.builtin.debug:
                var: nfs_upload_upid

            - name: Fail if upload returned error
              ansible.builtin.fail:
                msg: "Upload failed: {{ nfs_upload_result.stdout }}"
              when: nfs_upload_upid is not defined or nfs_upload_upid == ''

            - name: Wait for upload task to complete
              ansible.builtin.uri:
                url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/tasks/{{ nfs_upload_upid | urlencode }}/status"
                method: GET
                headers:
                  Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
                validate_certs: "{{ proxmox_validate_certs }}"
              register: nfs_task_status
              until: nfs_task_status.json.data.status == 'stopped'
              retries: 60
              delay: 5

            - name: Check upload task result
              ansible.builtin.fail:
                msg: "Upload task failed: {{ nfs_task_status.json.data.exitstatus | default('unknown') }}"
              when: nfs_task_status.json.data.exitstatus | default('OK') != 'OK'

        # -------------------------------------------------------------------------
        # VM Creation (import-from uses full path with .iso extension)
        # -------------------------------------------------------------------------
        - name: Create NFS Server VM on Proxmox
          community.proxmox.proxmox_kvm:
            api_host: "{{ proxmox_host }}"
            api_port: "{{ proxmox_port }}"
            api_user: "{{ proxmox_user }}"
            api_password: "{{ proxmox_password }}"
            node: "{{ proxmox_node }}"
            name: "{{ nfs_vm_name }}"
            cores: "{{ nfs_cores }}"
            memory: "{{ nfs_memory }}"
            ostype: "l26"
            onboot: true
            autostart: true
            agent: "enabled=1"
            scsihw: "virtio-scsi-pci"
            net:
              net0: "virtio,bridge={{ vnet_interface }},tag={{ vnet_vlan }}"
            virtio:
              virtio0: >-
                {{ proxmox_disk_storage_id }}:0,import-from={{ proxmox_iso_storage_path }}/{{ nfs_image_filename }}.iso,size={{ nfs_os_disk_size }}
              virtio1: "{{ proxmox_disk_storage_id }}:{{ nfs_data_disk_size | regex_replace('[Gg]$', '') }}"
            boot: "order=virtio0"
            state: present
            timeout: 300
          register: nfs_vm_create

    # -----------------------------------------------------------------------------
    # Post-Creation: Start and Wait for VM
    # -----------------------------------------------------------------------------
    - name: Set VM ID fact
      ansible.builtin.set_fact:
        nfs_vmid: "{{ nfs_server_vm.vmid if nfs_server_vm is not none else nfs_vm_create.vmid }}"

    # -----------------------------------------------------------------------------
    # Start VM and Configure (applies to both new and existing VMs not yet reachable)
    # -----------------------------------------------------------------------------
    - name: Start and configure NFS VM
      block:
        - name: Check VM status
          ansible.builtin.uri:
            url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ nfs_vmid }}/status/current"
            method: GET
            headers:
              Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          register: nfs_vm_status

        - name: Start NFS Server VM if not running
          community.proxmox.proxmox_kvm:
            api_host: "{{ proxmox_host }}"
            api_port: "{{ proxmox_port }}"
            api_user: "{{ proxmox_user }}"
            api_password: "{{ proxmox_password }}"
            node: "{{ proxmox_node }}"
            vmid: "{{ nfs_vmid }}"
            state: started
          when: nfs_vm_status.json.data.status != 'running'

        - name: Wait for VM guest agent to respond
          ansible.builtin.uri:
            url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ nfs_vmid }}/agent/ping"
            method: POST
            headers:
              Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
              CSRFPreventionToken: "{{ proxmox_csrf }}"
            validate_certs: "{{ proxmox_validate_certs }}"
            status_code: [200, 500]
          register: nfs_agent_ping
          until: nfs_agent_ping.status == 200
          retries: 60
          delay: 10
          failed_when: false

        - name: Configure password, static IP, DNS, and NFS directories via guest agent
          ansible.builtin.uri:
            url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ nfs_vmid }}/agent/exec"
            method: POST
            headers:
              Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
              CSRFPreventionToken: "{{ proxmox_csrf }}"
            validate_certs: "{{ proxmox_validate_certs }}"
            body_format: form-urlencoded
            body:
              command: "/bin/sh"
              input-data: |
                echo 'root:{{ nfs_root_password }}' | chpasswd

                # Update NFS exports to allow non-root mounting
                echo "/export *(rw,async,no_subtree_check,all_squash,anonuid=1000,anongid=100,insecure)" > /etc/exports
                exportfs -r

                # Configure static network (persistent across reboots)
                cat > /etc/network/interfaces <<'EOF'
                auto lo
                iface lo inet loopback

                auto eth0
                iface eth0 inet static
                  address {{ nfs_ip }}/{{ vnet_cidr }}
                  gateway {{ vnet_gateway }}
                EOF
                service networking restart
                ping -c 3 {{ vnet_gateway }}

                # Configure DNS resolver. The static-IP `interfaces` config
                # above does not provide DNS (DHCP did during build). Without
                # /etc/resolv.conf, apk and any other DNS-dependent tooling
                # fails. Write the resolver derived from the Proxmox node
                # config (vnet_dns), with a public fallback if empty.
                cat > /etc/resolv.conf <<'EOF'
                nameserver {{ vnet_dns | default('1.1.1.1', true) }}
                nameserver 1.1.1.1
                EOF

                # Create NFS export directories for content storage
                mkdir -p /export/template/iso
                mkdir -p /export/containers
                chmod -R 777 /export
                chmod -R 777 /export/containers

                # Pre-generate sshd host keys at first-boot config time so
                # downstream roles (kopia) can read them via QGA without
                # racing the openrc sshd init script. Idempotent: ssh-keygen
                # -A only generates keys that are missing.
                ssh-keygen -A
                rc-service sshd restart || rc-service sshd start || true

                # Make sure NFS server is running on the new static IP. The
                # `service networking restart` above can leave nfsd/rpcbind in
                # a stale state where they aren't listening on the new
                # address, which causes Proxmox to fail when it tries to
                # mount the export below. Restarting (or starting) these
                # services here is idempotent and ensures NFS is reachable
                # before we proceed.
                rc-service rpcbind restart || rc-service rpcbind start || true
                rc-service nfs restart || rc-service nfs start || true
                exportfs -r
            status_code: [200]
          register: nfs_network_config
          retries: 5
          delay: 5

        - name: Wait for QGA configuration script to finish
          ansible.builtin.uri:
            url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ nfs_vmid }}/agent/exec-status?pid={{ nfs_network_config.json.data.pid }}"
            method: GET
            headers:
              Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
            validate_certs: "{{ proxmox_validate_certs }}"
          register: nfs_network_config_status
          until: (nfs_network_config_status.json.data.exited | default(0) | int) == 1
          retries: 60
          delay: 5

        - name: Fail if QGA configuration script returned non-zero
          ansible.builtin.fail:
            msg: |
              NFS VM configuration script failed (exit={{ nfs_network_config_status.json.data.exitcode | default('?') }}).
              stdout: {{ nfs_network_config_status.json.data['out-data'] | default('') }}
              stderr: {{ nfs_network_config_status.json.data['err-data'] | default('') }}
          when: (nfs_network_config_status.json.data.exitcode | default(-1) | int) != 0

    # -----------------------------------------------------------------------------
    # Add NFS Storage to Proxmox
    # -----------------------------------------------------------------------------
    # If a previous failed activation left a stale NFS mount at
    # /mnt/pve/<storage>, every subsequent activation reports
    # "directory '/mnt/pve/<storage>' does not exist or is unreachable"
    # because PVE's is_mounted() sees the dead mount but `-d` returns false
    # on the stale handle. Clear it first so PVE can recreate the mountpoint.
    - name: Clear any stale /mnt/pve/<storage> mountpoint on PVE
      proxmox_shell:
        api_host: "{{ proxmox_host }}"
        api_port: "{{ proxmox_port }}"
        api_user: "{{ proxmox_user }}"
        node: "{{ proxmox_node }}"
        pve_auth_cookie: "{{ proxmox_ticket }}"
        proxmox_csrf_token: "{{ proxmox_csrf }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        timeout: 30
        command: >-
          MP=/mnt/pve/{{ nfs_storage_name }};
          if [ -e "$MP" ] || mountpoint -q "$MP" 2>/dev/null; then
          umount -lf "$MP" 2>/dev/null || true;
          rmdir "$MP" 2>/dev/null || true;
          echo CLEARED;
          else
          echo NO_STALE_MOUNT;
          fi
      register: nfs_stale_mount_clear
      changed_when: "'CLEARED' in (nfs_stale_mount_clear.stdout | default(''))"

    - name: Add NFS storage to Proxmox (retries until NFS is online)
      ansible.builtin.uri:
        url: "{{ proxmox_api }}/storage"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
          CSRFPreventionToken: "{{ proxmox_csrf }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        body_format: form-urlencoded
        body:
          storage: "{{ nfs_storage_name }}"
          type: "nfs"
          server: "{{ nfs_ip }}"
          export: "{{ nfs_export_root }}"
          content: "{{ nfs_proxmox_content_types }}"
        status_code: [200, 201]
      register: nfs_add_storage_result
      until: nfs_add_storage_result.status in [200, 201]
      retries: 30
      delay: 10

    # -----------------------------------------------------------------------------
    # Display Summary
    # -----------------------------------------------------------------------------
    - name: Display NFS server info
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          NFS Server deployed successfully!
          ═══════════════════════════════════════════════════════════════════

          {% if nfs_already_reachable | default(false) %}
          Note: Using existing NFS server at {{ nfs_ip }}
          {% else %}
          VM Name: {{ nfs_vm_name }}
          VMID: {{ nfs_vmid }}
          {% endif %}

          IP Address: {{ nfs_ip }}
          OS: Alpine Linux {{ nfs_alpine_version }}

          NFS Export: {{ nfs_ip }}:{{ nfs_export_root }}
          Data Disk: /dev/vdb ({{ nfs_data_disk_size }})

          Proxmox Storage: {{ nfs_storage_name }}

          Mount example (from other VMs):
            mount -t nfs {{ nfs_ip }}:{{ nfs_export_root }} /mnt/nfs

          ═══════════════════════════════════════════════════════════════════

# -----------------------------------------------------------------------------
# Provision the kopia SFTP user / repo dir / artifact files on this NFS VM.
# Runs OUTSIDE the not-already-reachable block so it executes on every play
# (idempotent), regardless of whether the VM was just built or has been up
# for weeks. Honors the `nfs_provision_kopia_user` toggle (defaults to
# `kopia_enabled`) so users wiring kopia to a different storage backend can
# turn it off.
# -----------------------------------------------------------------------------
- name: Provision kopia SFTP user on NFS VM
  ansible.builtin.include_tasks: kopia_user.yml
  when: nfs_provision_kopia_user | default(kopia_enabled | default(false)) | bool

- name: Check if NFS server is reachable
  ansible.builtin.command:
    cmd: "ping -c 1 -W 3 {{ nfs_ip }}"
  register: nfs_ping_result
  changed_when: false
  failed_when: false

- name: Warn if NFS server did not answer ICMP
  ansible.builtin.debug:
    msg: "{{ nfs_ip }} did not answer ping; attempting the mount anyway."
  when: nfs_ping_result.rc != 0

- name: NFS content upload
  block:
    - name: Create temporary mount point
      ansible.builtin.tempfile:
        state: directory
        prefix: nfs_test_
      register: nfs_temp_mount

    # -p 0 disables FUSE default_permissions. The export is all_squash with
    # anonuid=1000, so files land owned by 1000 while the controller runs as
    # some other uid; with the kernel checking locally, overwriting or
    # chmod-ing our own uploads fails EPERM. The server still enforces access.
    - name: Test NFS mount and verify contents
      ansible.builtin.shell:
        cmd: "fuse-nfs -n 'nfs://{{ nfs_ip }}{{ nfs_export_root }}?rsize=1048576&wsize=1048576&readahead=1048576' -m {{ nfs_temp_mount.path }} -d -p 0"
      register: nfs_mount_result
      changed_when: true
      failed_when: false

    # InfraVM loads Portainer from this export at first boot, and Portainer is
    # the only channel Ansible has to the VM. A silent skip here surfaces
    # several roles later as an unreachable Portainer API.
    - name: Fail if NFS mount did not succeed
      ansible.builtin.fail:
        msg: >-
          Could not fuse-mount nfs://{{ nfs_ip }}{{ nfs_export_root }}
          (rc={{ nfs_mount_result.rc }}). The controller needs direct access to
          the vnet to stage the Portainer image.
          stderr: {{ nfs_mount_result.stderr | default('') }}
      when: nfs_mount_result.rc != 0

    - name: Check local portainer image size
      ansible.builtin.stat:
        path: "{{ sophon_containers_dir }}/{{ portainer_image_tarname }}"
      register: nfs_portainer_local

    - name: Fail if the Portainer image tar was never prestaged
      ansible.builtin.fail:
        msg: >-
          {{ sophon_containers_dir }}/{{ portainer_image_tarname }} does not
          exist. InfraVM loads Portainer from this tar at first boot and
          Ansible has no other way in. Run 'ansible-playbook prestage.yml'
          first.
      when: not nfs_portainer_local.stat.exists

    - name: Check remote portainer image size
      ansible.builtin.stat:
        path: "{{ nfs_temp_mount.path }}/containers/{{ portainer_image_tarname }}"
      register: nfs_portainer_remote

    # Reads back over fuse-nfs are unreliable, so the size comparison above is
    # the only usable idempotency check; copy's own checksum always differs.
    - name: Upload portainer image to NFS
      ansible.builtin.copy:
        src: "{{ sophon_containers_dir }}/{{ portainer_image_tarname }}"
        dest: "{{ nfs_temp_mount.path }}/containers/{{ portainer_image_tarname }}"
        mode: "0644"
      when: not nfs_portainer_remote.stat.exists or nfs_portainer_remote.stat.size != nfs_portainer_local.stat.size
