---
# =============================================================================
# Proxmox Role - Authentication and API Helpers
# =============================================================================
# Provides: proxmox_ticket, proxmox_csrf (set as facts for other roles to use)

- name: Authenticate to Proxmox API
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ proxmox_user }}"
      password: "{{ proxmox_password }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_auth
  when: proxmox_ticket is not defined

- name: Set Proxmox auth facts
  ansible.builtin.set_fact:
    proxmox_ticket: "{{ proxmox_auth.json.data.ticket }}"
    proxmox_csrf: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
  when: proxmox_ticket is not defined

- name: Get existing VMs from Proxmox
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/cluster/resources?type=vm"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_existing_vms
  when: proxmox_existing_vms is not defined

- name: Check if image already exists on Proxmox
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content?content=iso"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_iso_content
  when: proxmox_iso_content is not defined
