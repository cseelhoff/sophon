---
- name: Preserve legacy NFS deployments
  ansible.builtin.assert:
    that:
      - _proxmox_existing_vms.json.data | selectattr('name', 'eq', 'sophon-nfs') | list | length == 0
    fail_msg: "Legacy sophon-nfs exists. Automatic migration is not supported; no VMs have been changed."

- name: Find conflicting bootstrap VM names
  ansible.builtin.set_fact:
    bootstrap_existing_vms: >-
      {{ _proxmox_existing_vms.json.data | selectattr('name', 'in',
         [controller_vm_name | default('sophon-controller'),
          infravm_vm_name | default('sophon-infravm')]) | list }}

- name: Require existing bootstrap VMs to be QEMU guests on the selected node
  ansible.builtin.assert:
    that:
      - bootstrap_existing_vms | selectattr('name', 'eq', item.name) | list | length == 1
      - item.type == 'qemu'
      - item.node == proxmox_node
      - item.template | default(0) | int == 0
    fail_msg: "Conflicting VM name {{ item.name }} exists. It has not been changed."
  loop: "{{ bootstrap_existing_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read bootstrap ownership markers without changing guests
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ item.vmid }}/config"
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  loop: "{{ bootstrap_existing_vms }}"
  loop_control:
    label: "{{ item.name }}"
  register: bootstrap_existing_configs

- name: Preserve unmarked conflicting guests before provisioning either VM
  ansible.builtin.assert:
    that:
      - >-
        item.json.data.description | default('') ==
        ('sophon-controller-v1' if item.item.name == (controller_vm_name | default('sophon-controller'))
         else 'sophon-infravm-v1')
    fail_msg: "Conflicting VM {{ item.item.name }} is not owned by this bootstrap. No VMs have been changed."
  loop: "{{ bootstrap_existing_configs.results }}"
  loop_control:
    label: "{{ item.item.name }}"
