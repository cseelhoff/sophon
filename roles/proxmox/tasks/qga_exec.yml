---
# =============================================================================
# QGA Exec - Execute command via QEMU Guest Agent
# =============================================================================
# Usage:
#   - ansible.builtin.include_role:
#       name: proxmox
#       tasks_from: qga_exec
#     vars:
#       qga_vmid: "{{ coreos_vmid }}"
#       qga_command: "echo hello"
#
# Returns:
#   qga_result.stdout  - command stdout
#   qga_result.stderr  - command stderr
#   qga_result.exitcode - command exit code
#   qga_result.success - true if exitcode == 0

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - qga_vmid is defined
      - qga_command is defined
      - proxmox_ticket is defined
      # Proxmox's /agent/exec base64-encodes `input-data` with Perl's
      # MIME::Base64::encode_base64, which dies with "Wide character in
      # subroutine entry" on any non-ASCII byte. Catch it here so the
      # caller fixes the script instead of debugging a 500 from Perl.
      - qga_command == (qga_command | regex_replace('[^\\x00-\\x7F]', ''))
    fail_msg: "qga_exec requires qga_vmid, qga_command, and proxmox_ticket (run proxmox role first); qga_command must be ASCII-only"

- name: Execute command via QGA
  # The script is sent over the agent's stdin (`input-data`) instead of as a
  # third `command` argv element. Some qemu-guest-agent versions wedge the
  # daemon when `guest-exec` is called with a sizeable arg-vector — the daemon
  # accepts the call, fails to spawn/respond, and then becomes unreachable
  # (subsequent guest-pings time out) until the VM reboots. Routing the script
  # through stdin sidesteps that path entirely; it's also the form the in-VM
  # configure tasks use successfully.
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ qga_vmid }}/agent/exec"
    method: POST
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      CSRFPreventionToken: "{{ proxmox_csrf }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    body_format: form-urlencoded
    body:
      # /bin/sh (not /bin/bash) — bash isn't installed on Alpine (busybox).
      command: "/bin/sh"
      input-data: "{{ qga_command }}"
  register: proxmox_qga_exec_result

- name: Debug QGA exec result
  ansible.builtin.debug:
    msg: "QGA exec PID: {{ proxmox_qga_exec_result.json.data.pid | default('FAILED') }}"

- name: Wait for QGA command to complete
  vars:
    base_url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}"
  ansible.builtin.uri:
    url: "{{ base_url }}/qemu/{{ qga_vmid }}/agent/exec-status?pid={{ proxmox_qga_exec_result.json.data.pid }}"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_qga_status_result
  retries: 10
  delay: 3
  until: (proxmox_qga_status_result.json.data.exited | default(0) | int) == 1

- name: Debug QGA status
  vars:
    _exited: "{{ proxmox_qga_status_result.json.data.exited | default('undefined') }}"
    _exitcode: "{{ proxmox_qga_status_result.json.data.exitcode | default('undefined') }}"
  ansible.builtin.debug:
    msg: "QGA status: exited={{ _exited }}, exitcode={{ _exitcode }}"

- name: Set QGA result facts
  ansible.builtin.set_fact:
    proxmox_qga_result:
      stdout: "{{ proxmox_qga_status_result.json.data['out-data'] | default('') }}"
      stderr: "{{ proxmox_qga_status_result.json.data['err-data'] | default('') }}"
      exitcode: "{{ proxmox_qga_status_result.json.data.exitcode | default(-1) }}"
      success: "{{ (proxmox_qga_status_result.json.data.exitcode | default(-1)) == 0 }}"
