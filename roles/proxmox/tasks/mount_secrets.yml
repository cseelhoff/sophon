---
# Hot-insert sophon-secrets.iso into a running Sophon-managed Proxmox VM and prune superseded secrets ISOs.

- name: Find Proxmox guests matching mount_secrets_vm_name
  ansible.builtin.set_fact:
    mount_secrets_guests: "{{ proxmox_vms.json.data | selectattr('name', 'eq', mount_secrets_vm_name) | list }}"

- name: Require exactly one matching Proxmox guest
  ansible.builtin.assert:
    that: mount_secrets_guests | length == 1
    fail_msg: >-
      {{ 'Multiple guests use name ' ~ mount_secrets_vm_name ~ '; refusing to modify.'
         if (mount_secrets_guests | length > 1)
         else 'No managed Proxmox VM named ' ~ mount_secrets_vm_name ~ ' was found.' }}

- name: Require a non-template QEMU guest on the selected node
  ansible.builtin.assert:
    that:
      - mount_secrets_guests[0].type == 'qemu'
      - mount_secrets_guests[0].node == proxmox_node
      - mount_secrets_guests[0].template | default(0) | int == 0
    fail_msg: "Guest '{{ mount_secrets_vm_name }}' is not a non-template QEMU VM on {{ proxmox_node }}."

- name: Read existing VM config to verify Sophon ownership marker
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ mount_secrets_guests[0].vmid }}/config"
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: mount_secrets_config

- name: Refuse to modify unmanaged Proxmox VM
  ansible.builtin.assert:
    that: mount_secrets_config.json.data.description | default('') == mount_secrets_vm_marker
    fail_msg: "VM '{{ mount_secrets_vm_name }}' (VMID {{ mount_secrets_guests[0].vmid }}) does not carry marker '{{ mount_secrets_vm_marker }}'."

- name: Compute SHA-256 of secrets ISO
  ansible.builtin.stat:
    path: "{{ mount_secrets_iso_path }}"
    checksum_algorithm: sha256
  register: mount_secrets_stat

- name: Name content-addressed secrets ISO for Proxmox storage
  ansible.builtin.set_fact:
    mount_secrets_filename: "sophon-secrets-{{ mount_secrets_stat.stat.checksum[:8] }}.iso"
    mount_secrets_cdrom_slot: "{{ 'ide0' if ('ide0' in mount_secrets_config.json.data) else 'ide2' }}"

- name: Validate size if hash-named secrets ISO already exists in Proxmox storage
  ansible.builtin.assert:
    that: >-
      not existing or
      (existing | length == 1 and existing[0].size | int == mount_secrets_stat.stat.size | int)
    fail_msg: "A hash-named secrets ISO has an unexpected size in Proxmox storage; refusing to overwrite it."
  vars:
    existing: "{{ proxmox_iso_content.json.data | selectattr('volid', 'eq', proxmox_iso_storage_id ~ ':iso/' ~ mount_secrets_filename) | list }}"

- name: Upload secrets ISO to Proxmox storage when not yet present
  ansible.builtin.include_tasks: upload.yml
  loop:
    - source: "{{ mount_secrets_iso_path }}"
      filename: "{{ mount_secrets_filename }}"
  loop_control:
    label: "{{ item.filename }}"
  when: >-
    (proxmox_iso_storage_id ~ ':iso/' ~ mount_secrets_filename) not in
    (proxmox_iso_content.json.data | map(attribute='volid') | list)

- name: Hot-insert secrets ISO into {{ mount_secrets_cdrom_slot }} on {{ mount_secrets_vm_name }}
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/qemu/{{ mount_secrets_guests[0].vmid }}/config"
    method: POST
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      CSRFPreventionToken: "{{ proxmox_csrf }}"
    body_format: form-urlencoded
    body: >-
      {{ {mount_secrets_cdrom_slot: proxmox_iso_storage_id ~ ':iso/' ~ mount_secrets_filename ~ ',media=cdrom'} }}
    validate_certs: "{{ proxmox_validate_certs }}"
  register: mount_secrets_set_task
  no_log: true

- name: Wait for Proxmox CD-ROM update task to complete
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/tasks/{{ mount_secrets_set_task.json.data | urlencode }}/status"
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: mount_secrets_task_status
  until: mount_secrets_task_status.json.data.status == 'stopped'
  retries: 60
  delay: 2
  no_log: true

- name: Require successful CD-ROM attachment
  ansible.builtin.assert:
    that: mount_secrets_task_status.json.data.exitstatus == 'OK'
    fail_msg: "Proxmox failed to attach '{{ mount_secrets_filename }}' to {{ mount_secrets_vm_name }}."

- name: Prune superseded unmounted sophon-secrets-*.iso uploads from Proxmox storage
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content/{{ item.volid | urlencode }}"
    method: DELETE
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
      CSRFPreventionToken: "{{ proxmox_csrf }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  loop: >-
    {{ proxmox_iso_content.json.data
       | selectattr('volid', 'match', '^' ~ (proxmox_iso_storage_id | regex_escape) ~ ':iso/sophon-secrets-[0-9a-f]+\.iso$')
       | rejectattr('volid', 'eq', proxmox_iso_storage_id ~ ':iso/' ~ mount_secrets_filename)
       | list }}
  loop_control:
    label: "{{ item.volid }}"
  failed_when: false
  no_log: true
