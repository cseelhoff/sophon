---
# CoreDNS version to build
coredns_dockerdiscovery_version: "v1.12.0"

# Docker discovery plugin
coredns_dockerdiscovery_plugin: "docker:github.com/kevinjqiu/coredns-dockerdiscovery"

# Build directory
coredns_dockerdiscovery_build_dir: "{{ playbook_dir }}/artifacts/coredns-dockerdiscovery-build"

# Output image settings
coredns_dockerdiscovery_image_name: "coredns-dockerdiscovery"
coredns_dockerdiscovery_image_tag: "latest"

# Output tar file location
coredns_dockerdiscovery_image_output: "{{ playbook_dir }}/artifacts/coredns-dockerdiscovery.tar"

# Whether to force rebuild even if tar already exists
coredns_dockerdiscovery_force_rebuild: false
