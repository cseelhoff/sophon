---
- name: Check if CoreDNS image already exists
  ansible.builtin.stat:
    path: "{{ coredns_dockerdiscovery_image_output }}"
  register: coredns_dockerdiscovery_image_stat

- name: Build CoreDNS with dockerdiscovery plugin
  when: coredns_dockerdiscovery_force_rebuild or not coredns_dockerdiscovery_image_stat.stat.exists
  block:
    - name: Create build directory
      ansible.builtin.file:
        path: "{{ coredns_dockerdiscovery_build_dir }}"
        state: directory
        mode: '0755'

    - name: Clone CoreDNS repository
      ansible.builtin.git:
        repo: https://github.com/coredns/coredns.git
        dest: "{{ coredns_dockerdiscovery_build_dir }}"
        version: "{{ coredns_dockerdiscovery_version }}"

    - name: Add dockerdiscovery plugin to plugin.cfg
      ansible.builtin.lineinfile:
        path: "{{ coredns_dockerdiscovery_build_dir }}/plugin.cfg"
        line: "{{ coredns_dockerdiscovery_plugin }}"
        insertafter: EOF

    - name: Generate plugin imports
      ansible.builtin.command: go generate
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      changed_when: true

    - name: Fetch dockerdiscovery dependency
      ansible.builtin.command: go get github.com/kevinjqiu/coredns-dockerdiscovery@latest
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      changed_when: true

    - name: Tidy Go modules
      ansible.builtin.command: go mod tidy
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      changed_when: true

    - name: Build CoreDNS binary
      ansible.builtin.command: make
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      changed_when: true

    - name: Verify CoreDNS binary
      ansible.builtin.command: ./coredns --version
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      register: coredns_dockerdiscovery_version_output
      changed_when: false

    - name: Display CoreDNS version
      ansible.builtin.debug:
        var: coredns_dockerdiscovery_version_output.stdout
      changed_when: false

    - name: Create Dockerfile
      ansible.builtin.copy:
        dest: "{{ coredns_dockerdiscovery_build_dir }}/Dockerfile"
        mode: '0644'
        content: |
          FROM scratch
          COPY coredns /coredns
          EXPOSE 53 53/udp
          ENTRYPOINT ["/coredns"]

    - name: Build container image with buildah
      ansible.builtin.command: buildah bud -t {{ coredns_dockerdiscovery_image_name }}:{{ coredns_dockerdiscovery_image_tag }} .
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      changed_when: true

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ coredns_dockerdiscovery_image_output | dirname }}"
        state: directory
        mode: '0755'

    - name: Export container image to tar
      ansible.builtin.command: >
        buildah push
        {{ coredns_dockerdiscovery_image_name }}:{{ coredns_dockerdiscovery_image_tag }}
        oci-archive:{{ coredns_dockerdiscovery_image_output }}
      args:
        chdir: "{{ coredns_dockerdiscovery_build_dir }}"
      changed_when: true

    - name: Clean up build directory
      ansible.builtin.file:
        path: "{{ coredns_dockerdiscovery_build_dir }}"
        state: absent

    - name: Display output location
      ansible.builtin.debug:
        msg: "CoreDNS image exported to {{ coredns_dockerdiscovery_image_output }}"

- name: Skip build (image already exists)
  when: not coredns_dockerdiscovery_force_rebuild and coredns_dockerdiscovery_image_stat.stat.exists
  ansible.builtin.debug:
    msg: "CoreDNS image already exists at {{ coredns_dockerdiscovery_image_output }}. Set coredns_dockerdiscovery_force_rebuild=true to rebuild."
