---
# Deploy Keycloak Identity Provider via Compose Stack

# Publish key Keycloak vars as facts so they survive past role scope and are
# visible to downstream roles (gitea, arcane, etc.) that reference them.
- name: Publish Keycloak coordinates as facts
  ansible.builtin.set_fact:
    keycloak_hostname: "{{ keycloak_hostname }}"
    keycloak_domain: "{{ keycloak_domain }}"
    keycloak_realm: "{{ keycloak_realm }}"

- name: Deploy Keycloak Compose stack
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_name: "keycloak"
    compose_stack_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    compose_stack_image_tars: "{{ keycloak_image_tars }}"

- name: Display Keycloak status
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      Keycloak Deployed
      ═══════════════════════════════════════════════════════════════════

        URL:      https://{{ keycloak_hostname }}.{{ keycloak_domain }} (port {{ keycloak_port }})
        Username: {{ keycloak_admin_user }}
        Password: {{ keycloak_admin_password }}

      ═══════════════════════════════════════════════════════════════════

# =========================================================================
# Configure realm, LDAP, clients, groups via Keycloak Admin REST API
# =========================================================================
- name: Configure Keycloak via Admin REST API
  vars:
    _kc_base: "https://{{ keycloak_hostname }}.{{ keycloak_domain }}"
  ansible.builtin.include_tasks: configure.yml
