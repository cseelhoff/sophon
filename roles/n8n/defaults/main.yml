---
# n8n Workflow Automation configuration
n8n_enabled: false  # TODO: Rewrite to use portainer_stack
n8n_image_name: "docker.n8n.io/n8nio/n8n"
n8n_image_tag: "1.70.1"

# Directories
n8n_data_dir: "/opt/n8n"

# Network
n8n_port: 5678

# Domain
n8n_hostname: "n8n"
n8n_domain: "{{ traefik_domain | default('example.local') }}"
n8n_webhook_url: "https://{{ n8n_hostname }}.{{ n8n_domain }}"

# Timezone
n8n_timezone: "UTC"

# Security (set via vault in production)
# n8n_basic_auth_user: ""
# n8n_basic_auth_password: ""
n8n_basic_auth_enabled: false

# Execution settings
n8n_executions_data_save_manual: true
n8n_executions_data_save_on_error: "all"
n8n_executions_data_save_on_success: "all"

# Encryption key for credentials (generate with: openssl rand -hex 32)
# n8n_encryption_key: ""

# Keycloak OIDC integration
n8n_oidc_enabled: false
# n8n_oidc_client_id: "n8n"
# n8n_oidc_client_secret: "{{ vault_keycloak_n8n_client_secret }}"
# n8n_oidc_issuer_url: "https://keycloak.{{ domain_name }}/realms/{{ keycloak_realm }}"
