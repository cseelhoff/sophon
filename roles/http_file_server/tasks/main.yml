---
# HTTP File Server Role
# Serves files locally via Python HTTP server for air-gapped transfers

- name: Create download directory
  ansible.builtin.file:
    path: "{{ http_file_server_local_download_dir }}"
    state: directory
    mode: '0755'

- name: Start Python HTTP server
  ansible.builtin.command:
    cmd: "python3 -m http.server {{ http_file_server_port }}"
    chdir: "{{ http_file_server_local_download_dir }}"
  async: 600  # Keep running for 10 minutes
  poll: 0
  register: http_file_server_process

- name: Check if local file exists
  ansible.builtin.stat:
    path: "{{ http_file_server_local_download_dir }}/{{ http_file_server_local_filename }}"
  register: http_file_server_local_file_stat

- name: Download file locally
  ansible.builtin.get_url:
    url: "{{ http_file_server_download_url }}"
    dest: "{{ http_file_server_local_download_dir }}/{{ http_file_server_download_filename }}"
    timeout: 600
    mode: '0644'
  when: not http_file_server_local_file_stat.stat.exists

- name: Extract downloaded file
  ansible.builtin.command:
    cmd: "xz -d {{ http_file_server_local_download_dir }}/{{ http_file_server_download_filename }}"
  when:
    - not http_file_server_local_file_stat.stat.exists
    - http_file_server_extracted_filename is defined

- name: Rename extracted file
  ansible.builtin.command:
    cmd: >-
      mv {{ http_file_server_local_download_dir }}/{{ http_file_server_extracted_filename }}
      {{ http_file_server_local_download_dir }}/{{ http_file_server_renamed_filename }}
  when:
    - not http_file_server_local_file_stat.stat.exists
    - http_file_server_extracted_filename is defined
    - http_file_server_renamed_filename is defined
