---
# Portainer Stack Role Defaults
# These variables use the portainer_stack_ prefix per ansible-lint conventions

portainer_stack_name: ""
portainer_stack_env_vars: []
portainer_stack_validate_certs: false
portainer_stack_compose_content: ""
portainer_stack_deploy_timeout: 120
portainer_stack_api_retries: 60
portainer_stack_api_delay: 5

# Prestaged image tars to load into the endpoint before deploying the stack.
# Compose files pin pull_policy: never, so anything not listed here will fail
# to start rather than silently pulling from a registry.
portainer_stack_image_tars: []
portainer_stack_image_load_timeout: 600
