---
# Deploy Stack to Portainer
- name: Authenticate with Portainer
  ansible.builtin.uri:
    url: "{{ portainer_stack_url }}/api/auth"
    method: POST
    body_format: json
    body:
      Username: "admin"
      Password: "{{ portainer_admin_password }}"
    status_code: 200
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
  register: portainer_stack_auth_response

- name: Set auth token variable
  ansible.builtin.set_fact:
    portainer_stack_auth_token: "{{ portainer_stack_auth_response.json.jwt }}"

- name: Get endpoints
  ansible.builtin.uri:
    url: "{{ portainer_stack_url }}/api/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
    status_code: 200
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
  register: portainer_stack_endpoints_response

- name: Find local endpoint ID
  ansible.builtin.set_fact:
    portainer_stack_endpoint_id: "{{ portainer_stack_endpoints_response.json[0].Id }}"
  when: portainer_stack_endpoints_response.json | length > 0

- name: Create local endpoint if it doesn't exist
  ansible.builtin.uri:
    url: "{{ portainer_stack_url }}/api/endpoints"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
    body_format: form-urlencoded
    body:
      Name: "local"
      EndpointCreationType: 1
      URL: "unix:///var/run/docker.sock"
    status_code: [200, 201]
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
  register: portainer_stack_endpoint_create_response
  when: portainer_stack_endpoint_id is not defined or portainer_stack_endpoint_id == 'null'

- name: Set endpoint ID from creation response
  ansible.builtin.set_fact:
    portainer_stack_endpoint_id: "{{ portainer_stack_endpoint_create_response.json.Id }}"
  when: portainer_stack_endpoint_create_response is defined and portainer_stack_endpoint_create_response.json is defined

- name: Get existing stacks
  ansible.builtin.uri:
    url: "{{ portainer_stack_url }}/api/stacks"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
    status_code: 200
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
  register: portainer_stack_list_response

- name: Check if stack already exists
  ansible.builtin.set_fact:
    portainer_stack_existing: "{{ portainer_stack_list_response.json | selectattr('Name', 'equalto', portainer_stack_name) | list | first | default(none) }}"

- name: Deploy new stack to Portainer
  ansible.builtin.uri:
    url: "{{ portainer_stack_url }}/api/stacks/create/standalone/string?endpointId={{ portainer_stack_endpoint_id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      env: "{{ portainer_stack_env_vars | default([]) }}"
      fromAppTemplate: false
      name: "{{ portainer_stack_name }}"
      stackFileContent: "{{ portainer_stack_compose_content }}"
    status_code: 200
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
  when: portainer_stack_existing is none

- name: Update existing stack
  ansible.builtin.uri:
    url: "{{ portainer_stack_url }}/api/stacks/{{ portainer_stack_existing.Id }}?endpointId={{ portainer_stack_endpoint_id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      env: "{{ portainer_stack_env_vars | default([]) }}"
      stackFileContent: "{{ portainer_stack_compose_content }}"
      prune: true
      pullImage: false
    status_code: 200
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
  when: portainer_stack_existing is not none
