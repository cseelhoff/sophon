---
# Deploy Stack to Portainer via SSH
# Uses raw curl commands since we may be going through a tunnel
#
# Note: SSH raw output may contain escape sequences, so we use grep to extract JSON

- name: Authenticate with Portainer
  ansible.builtin.raw: |
    curl -sk -X POST "https://{{ infravm_ip }}:{{ portainer_port }}/api/auth" \
      -H "Content-Type: application/json" \
      -d '{"Username":"admin","Password":"{{ portainer_admin_password }}"}'  2>/dev/null | grep -E '^\{|^\['
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_stack_auth_response

- name: Parse auth token
  ansible.builtin.set_fact:
    portainer_stack_auth_token: "{{ (portainer_stack_auth_response.stdout | trim | from_json).jwt }}"

- name: Get endpoints
  ansible.builtin.raw: |
    curl -sk "https://{{ infravm_ip }}:{{ portainer_port }}/api/endpoints" \
      -H "Authorization: Bearer {{ portainer_stack_auth_token }}" 2>/dev/null | grep -E '^\{|^\['
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_stack_endpoints_response

- name: Parse endpoints
  ansible.builtin.set_fact:
    portainer_stack_endpoints: "{{ portainer_stack_endpoints_response.stdout | trim | default('[]') | from_json }}"

- name: Find or create local endpoint
  when: portainer_stack_endpoints | length == 0
  block:
    - name: Create local endpoint
      ansible.builtin.raw: |
        curl -sk -X POST "https://{{ infravm_ip }}:{{ portainer_port }}/api/endpoints" \
          -H "Authorization: Bearer {{ portainer_stack_auth_token }}" \
          -H "Content-Type: multipart/form-data" \
          -F "Name=local" \
          -F "EndpointCreationType=1" \
          -F "URL=unix:///var/run/docker.sock" 2>/dev/null | grep -E '^\{|^\['
      delegate_to: "{{ infravm_ansible_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ infravm_username }}"
        ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
      register: portainer_stack_endpoint_create

    - name: Debug endpoint create response
      ansible.builtin.debug:
        var: portainer_stack_endpoint_create.stdout

    - name: Parse new endpoint ID
      ansible.builtin.set_fact:
        portainer_stack_endpoint_id: "{{ (portainer_stack_endpoint_create.stdout | trim | from_json).Id }}"

- name: Set endpoint ID from existing
  ansible.builtin.set_fact:
    portainer_stack_endpoint_id: "{{ portainer_stack_endpoints[0].Id }}"
  when: portainer_stack_endpoints | length > 0

- name: Get existing stacks
  ansible.builtin.raw: |
    curl -sk "https://{{ infravm_ip }}:{{ portainer_port }}/api/stacks" \
      -H "Authorization: Bearer {{ portainer_stack_auth_token }}" 2>/dev/null | grep -E '^\{|^\['
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_stack_list_response

- name: Parse stacks list
  ansible.builtin.set_fact:
    portainer_stack_list: "{{ portainer_stack_list_response.stdout | trim | default('[]') | from_json }}"

- name: Check if stack already exists
  ansible.builtin.set_fact:
    portainer_stack_existing: "{{ portainer_stack_list | selectattr('Name', 'equalto', portainer_stack_name) | list | first | default(none) }}"

- name: Prepare stack compose content
  ansible.builtin.set_fact:
    _stack_compose_escaped: "{{ portainer_stack_compose_content | to_json }}"

- name: Deploy new stack to Portainer
  ansible.builtin.raw: |
    curl -sk -X POST "https://{{ infravm_ip }}:{{ portainer_port }}/api/stacks/create/standalone/string?endpointId={{ portainer_stack_endpoint_id }}" \
      -H "Authorization: Bearer {{ portainer_stack_auth_token }}" \
      -H "Content-Type: application/json" \
      -d '{"env":{{ portainer_stack_env_vars | default([]) | to_json }},"fromAppTemplate":false,"name":"{{ portainer_stack_name }}","stackFileContent":{{ _stack_compose_escaped }}}'
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  register: portainer_stack_deploy_result
  when: portainer_stack_existing is none

- name: Update existing stack
  ansible.builtin.raw: |
    curl -sk -X PUT "https://{{ infravm_ip }}:{{ portainer_port }}/api/stacks/{{ portainer_stack_existing.Id }}?endpointId={{ portainer_stack_endpoint_id }}" \
      -H "Authorization: Bearer {{ portainer_stack_auth_token }}" \
      -H "Content-Type: application/json" \
      -d '{"env":{{ portainer_stack_env_vars | default([]) | to_json }},"stackFileContent":{{ _stack_compose_escaped }},"prune":true,"pullImage":false}'
  delegate_to: "{{ infravm_ansible_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ infravm_username }}"
    ansible_ssh_private_key_file: "{{ infravm_ssh_private_key }}"
  when: portainer_stack_existing is not none
