---
# Deploy docker-volume-backup for automated backups

- name: Deploy Backup
  when: backup_enabled is true
  block:
    - name: Set deployment variables
      ansible.builtin.set_fact:
        backup_validate_certs: false
        backup_file_server_ip: "{{ ansible_default_ipv4.address }}"

    - name: Check if backup image exists
      ansible.builtin.raw: podman images | grep -q "docker-volume-backup[ ]*{{ backup_image_tag }}"
      delegate_to: "{{ infravm_ip }}"
      register: backup_image_exists
      failed_when: false
      changed_when: false

    - name: Download and load backup image from HTTP file server
      ansible.builtin.raw: |
        cd /tmp &&
        curl -o docker-volume-backup.tar http://{{ backup_file_server_ip }}:{{ http_file_server_port }}/docker-volume-backup.tar &&
        podman load -i docker-volume-backup.tar &&
        rm -f docker-volume-backup.tar
      delegate_to: "{{ infravm_ip }}"
      when: backup_image_exists.rc != 0

    - name: Create backup directories
      ansible.builtin.raw: |
        mkdir -p {{ backup_data_dir }}
        mkdir -p {{ backup_local_path }}
      delegate_to: "{{ infravm_ip }}"
      become: true

    - name: Generate docker-compose content in base64
      ansible.builtin.set_fact:
        backup_compose_base64: "{{ lookup('template', 'templates/docker-compose.yml.j2') | b64encode }}"

    - name: Deploy backup stack using portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "backup"
        portainer_stack_compose_content: "{{ backup_compose_base64 | b64decode }}"
        portainer_stack_env_vars: "{{ backup_env_vars | default([]) }}"
