---
# Nexus Repository Manager configuration
nexus_enabled: true
nexus_image_name: "sonatype/nexus3"
nexus_image_tag: "3.72.0"

# Directories
nexus_data_dir: "/opt/nexus"

# Network ports
nexus_port: 8081
nexus_docker_registry_port: 5000

# Domain
nexus_hostname: "nexus"
nexus_domain: "{{ traefik_domain | default('example.local') }}"

# Memory settings (Nexus is memory hungry)
nexus_memory: "2g"

# Admin credentials (set via vault in production)
nexus_admin_user: "admin"
# nexus_admin_password: "{{ vault_nexus_admin_password }}"

# Repository provisioning
nexus_provision_repos: true

# Docker repositories to create
nexus_docker_repos:
  - name: "docker-hosted"
    type: "hosted"
    http_port: null
    v1_enabled: false
  - name: "docker-proxy"
    type: "proxy"
    remote_url: "https://registry-1.docker.io"
    index_type: "HUB"
  - name: "ghcr-proxy"
    type: "proxy"
    remote_url: "https://ghcr.io"
    index_type: "REGISTRY"
  - name: "quay-proxy"
    type: "proxy"
    remote_url: "https://quay.io"
    index_type: "REGISTRY"
  - name: "docker-group"
    type: "group"
    http_port: "{{ nexus_docker_registry_port }}"
    members:
      - "docker-hosted"
      - "docker-proxy"
      - "ghcr-proxy"
      - "quay-proxy"

# Security realms
nexus_active_realms:
  - "NexusAuthenticatingRealm"
  - "NexusAuthorizingRealm"
  - "DockerToken"
