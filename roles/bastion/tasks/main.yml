---
# =============================================================================
# Bastion Role - Post-VM Creation Tasks
# =============================================================================
# The VM is created by the coreos_base dependency. This file only handles
# post-creation tasks like displaying connection information.
#
# Variables from coreos_base:
#   - coreos_base_vmid: The created VM's ID
#   - coreos_base_vm_created: boolean indicating if VM was newly created
#   - coreos_base_existing_vm: fact about pre-existing VM (if any)

# -----------------------------------------------------------------------------
# Get IP Address (if using DHCP)
# -----------------------------------------------------------------------------
- name: Get bastion IP from DHCP if needed
  when: coreos_base_ip is not defined or coreos_base_ip == ''
  block:
    - name: Query guest agent for network info
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ coreos_base_vmid }}/agent/network-get-interfaces"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
        validate_certs: "{{ proxmox_validate_certs }}"
      register: network_info
      retries: 12
      delay: 5
      until: network_info.status == 200

    - name: Extract DHCP IP address
      ansible.builtin.set_fact:
        bastion_dhcp_ip: "{{ network_info.json.data | selectattr('name', 'ne', 'lo') | map(attribute='ip-addresses') | flatten | selectattr('ip-address-type', 'eq', 'ipv4') | map(attribute='ip-address') | first | default('unknown') }}"

# -----------------------------------------------------------------------------
# Display Connection Information
# -----------------------------------------------------------------------------
- name: Display bastion connection info
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════════════════════════════
      Bastion VM deployed successfully!
      ═══════════════════════════════════════════════════════════════════
      
      VM Name: {{ coreos_base_vm_name }}
      VMID: {{ coreos_base_vmid }}
      OS: Fedora CoreOS
      IP Address: {{ coreos_base_ip | default(bastion_dhcp_ip | default('DHCP - check Proxmox console')) }}
      Network Mode: {{ 'Static' if (coreos_base_ip is defined and coreos_base_ip != '') else 'DHCP' }}
      Username: {{ coreos_base_username }}
      
      SSH Access:
        ssh {{ coreos_base_username }}@{{ coreos_base_ip | default(bastion_dhcp_ip | default('<IP>')) }}
      
      Ansible:
        The bastion includes wrapper scripts for ansible-playbook and ansible
        that run inside a containerized Alpine environment with all required
        Python packages pre-installed.
      
      {% if bastion_cloudflared_token is defined and bastion_cloudflared_token %}
      Cloudflared:
        Tunnel "{{ bastion_cloudflared_tunnel_name }}" is configured to start automatically.
      {% else %}
      Cloudflared:
        No tunnel token was provided. To setup manually:
        1. SSH into the bastion
        2. Run: podman run -it --rm cloudflare/cloudflared tunnel login
        3. Create and configure your tunnel
      {% endif %}
      
      Tools Installed:
        - butane {{ bastion_butane_version }} (native)
        - ansible, git, curl, wget, rsync (via podman container)
        - proxmoxer Python library (via podman container)
      
      {% if bastion_clone_sophon | default(false) %}
      Sophon Repository:
        Will be cloned to: {{ bastion_sophon_clone_path }}
        (cloning happens on first boot after tools are installed)
      {% endif %}
      
      ═══════════════════════════════════════════════════════════════════
