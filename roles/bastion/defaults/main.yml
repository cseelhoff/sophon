---
# =============================================================================
# Bastion Role - CoreOS Privileged Access Workstation
# =============================================================================
# Deploys a CoreOS VM with tools for running Ansible and optional Cloudflared
# tunnel for remote access. This provides a jump host for managing Sophon
# when the operator doesn't have direct network access to the target VMs.
#
# Depends on: coreos_base role (via meta/main.yml)

# Enable/disable this role
bastion_enabled: true

# =============================================================================
# VM Configuration (passed to coreos_base)
# =============================================================================
coreos_base_vm_name: "sophon-bastion"
coreos_base_cores: 2
coreos_base_memory: 2048
coreos_base_disk_size: "16G"

# Network Configuration:
# If coreos_base_ip is not defined, DHCP will be used automatically.
# For static IP, set both coreos_base_ip and coreos_base_gateway:
# coreos_base_ip: "10.0.1.5"
coreos_base_cidr: "24"
# coreos_base_gateway: "10.0.1.1"

# User Configuration
coreos_base_username: "ansible"
# Default password: 'changeme' - generate new with: mkpasswd --method=yescrypt 'yourpassword'
coreos_base_password_hash: "$y$j9T$wf0/OmORycv3Xxlk9UeqM1$mgpcsOS5y9GPMgHfDxrpDoimDMM9wuIY4efuYmvRcqA"

# SSH public key for passwordless access (recommended for Ansible)
# bastion_ssh_public_key: "ssh-ed25519 AAAA..."

# Butane template location (for coreos_base)
coreos_base_butane_template: "{{ role_path }}/templates/bastion.bu.j2"

# DNS server
bastion_dns: "1.1.1.1"

# =============================================================================
# Cloudflared Tunnel Configuration
# =============================================================================
# Option 1: Use a pre-existing tunnel token (recommended for automation)
# Generate via: cloudflared tunnel create bastion-tunnel
# Then get token: cloudflared tunnel token bastion-tunnel
# bastion_cloudflared_token: "eyJhI..."

# Option 2: Manual login after VM is created
# Set to empty to skip automatic tunnel setup
bastion_cloudflared_token: ""

# Tunnel name (used when creating new tunnel)
bastion_cloudflared_tunnel_name: "sophon-bastion"

# Cloudflared domain for tunnel ingress
# bastion_cloudflared_domain: "tunnel.example.com"

# =============================================================================
# Tools Configuration
# =============================================================================
# Butane version to install (for CoreOS ignition generation)
bastion_butane_version: "0.23.0"

# =============================================================================
# Clone Sophon Repository
# =============================================================================
# Optionally clone the Sophon repo into the bastion for convenience
bastion_clone_sophon: true
bastion_sophon_repo_url: "https://github.com/your-org/sophon.git"
bastion_sophon_clone_path: "/home/{{ coreos_base_username }}/sophon"
