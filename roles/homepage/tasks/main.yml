---
# Deploy Homepage Dashboard

- name: Set deployment variables
  ansible.builtin.set_fact:
    homepage_validate_certs: false
    homepage_file_server_ip: "{{ ansible_default_ipv4.address }}"

- name: Check if Homepage image exists
  ansible.builtin.raw: podman images | grep -q "homepage[ ]*{{ homepage_image_tag }}"
  delegate_to: "{{ coreos_ip }}"
  register: homepage_image_exists
  failed_when: false
  changed_when: false

- name: Download and load Homepage image from HTTP file server
  ansible.builtin.raw: |
    cd /tmp &&
    curl -o homepage.tar http://{{ homepage_file_server_ip }}:{{ http_file_server_port }}/homepage.tar &&
    podman load -i homepage.tar &&
    rm -f homepage.tar
  delegate_to: "{{ coreos_ip }}"
  when: homepage_image_exists.rc != 0

- name: Create Homepage config directory
  ansible.builtin.raw: mkdir -p {{ homepage_config_dir }}
  delegate_to: "{{ coreos_ip }}"
  become: true

- name: Create Homepage settings.yaml
  ansible.builtin.raw: |
    cat > {{ homepage_config_dir }}/settings.yaml << 'SETTINGSYML'
    {{ lookup('template', 'settings.yaml.j2') }}
    SETTINGSYML
  delegate_to: "{{ coreos_ip }}"
  become: true

- name: Create Homepage services.yaml
  ansible.builtin.raw: |
    cat > {{ homepage_config_dir }}/services.yaml << 'SERVICESYML'
    {{ lookup('template', 'services.yaml.j2') }}
    SERVICESYML
  delegate_to: "{{ coreos_ip }}"
  become: true

- name: Create Homepage widgets.yaml
  ansible.builtin.raw: |
    cat > {{ homepage_config_dir }}/widgets.yaml << 'WIDGETSYML'
    {{ lookup('template', 'widgets.yaml.j2') }}
    WIDGETSYML
  delegate_to: "{{ coreos_ip }}"
  become: true

- name: Create Homepage bookmarks.yaml
  ansible.builtin.raw: |
    cat > {{ homepage_config_dir }}/bookmarks.yaml << 'BOOKMARKSYML'
    {{ lookup('template', 'bookmarks.yaml.j2') }}
    BOOKMARKSYML
  delegate_to: "{{ coreos_ip }}"
  become: true

- name: Create Homepage docker.yaml
  ansible.builtin.raw: |
    cat > {{ homepage_config_dir }}/docker.yaml << 'DOCKERYML'
    {{ lookup('template', 'docker.yaml.j2') }}
    DOCKERYML
  delegate_to: "{{ coreos_ip }}"
  become: true

- name: Generate docker-compose content in base64
  ansible.builtin.set_fact:
    homepage_compose_base64: "{{ lookup('template', 'templates/docker-compose.yml.j2') | b64encode }}"

- name: Deploy Homepage stack using portainer
  ansible.builtin.include_role:
    name: portainer_stack
  vars:
    portainer_stack_url: "https://{{ coreos_ip }}:{{ portainer_port }}"
    portainer_stack_name: "homepage"
    portainer_stack_compose_content: "{{ homepage_compose_base64 | b64decode }}"
