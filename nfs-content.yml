---
# =============================================================================
# NFS Content Preparation Playbook
# =============================================================================
# Prepares NFS shares with RPMs and container images for CoreOS first-boot
#
# Usage:
#   ansible-playbook nfs-content.yml -i inventories/production/inventory.yml
#
# This should be run BEFORE deploying CoreOS VMs.

- name: Prepare NFS content for CoreOS
  hosts: localhost
  gather_facts: true
  roles:
    - nfs_content
