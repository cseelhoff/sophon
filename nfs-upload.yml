---
# =============================================================================
# Sophon NFS Upload Playbook
# =============================================================================
# Phase 2 of Air-Gapped Deployment: Uploads prestaged artifacts to NFS
#
# Usage: Run this playbook after switching to the air-gapped network:
#
#   ansible-playbook nfs-upload.yml -i inventories/production/inventory.yml
#
# Prerequisites:
# - prestage.yml has been run successfully
# - Network connectivity to NFS server ({{ nfs_ip }})

- name: Upload Prestaged Artifacts to NFS Server
  hosts: localhost

  pre_tasks:
    - name: Display upload information
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════════
          SOPHON NFS UPLOAD - Air-Gapped Deployment Phase 2
          ═══════════════════════════════════════════════════════════════════════

          This playbook uploads prestaged artifacts to the NFS server.

          Source:      {{ nfs_upload_source_dir | default('/tmp/sophon_prestage') }}
          NFS Server:  {{ nfs_ip | default('10.1.1.35') }}

          Destinations:
          - Images:    {{ nfs_upload_images_path | default('/var/lib/vz/template/iso') }}
          - RPMs:      {{ nfs_rpm_packages_path | default('/exports/nexus/yum-proxy') }}
          - Docker:    {{ nfs_docker_images_path | default('/exports/nexus/docker-proxy') }}

          ═══════════════════════════════════════════════════════════════════════

    - name: Verify prestaged artifacts exist
      ansible.builtin.stat:
        path: "{{ nfs_upload_source_dir | default('/tmp/sophon_prestage') }}"
      register: prestage_dir

    - name: Fail if prestaged artifacts not found
      ansible.builtin.fail:
        msg: |
          Prestaged artifacts not found at {{ nfs_upload_source_dir | default('/tmp/sophon_prestage') }}

          Please run 'ansible-playbook prestage.yml' first while connected to the internet.
      when: not prestage_dir.stat.exists

  roles:
    - role: nfs_content
      vars:
        nfs_content_mode: "upload_only"
        nfs_content_source_dir: "{{ nfs_upload_source_dir | default('/tmp/sophon_prestage') }}"

  post_tasks:
    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════════
          NFS UPLOAD COMPLETE
          ═══════════════════════════════════════════════════════════════════════

          All artifacts have been uploaded to the NFS server.

          NEXT STEP:
          Run the main deployment playbook:

            ansible-playbook deploy.yml -i inventories/production/inventory.yml

          Or run the full site playbook:

            ansible-playbook site.yml -i inventories/production/inventory.yml -e proxmox_airgapped=true

          ═══════════════════════════════════════════════════════════════════════
