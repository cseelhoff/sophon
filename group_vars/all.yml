---
# Every site setting is read from a SOPHON_* environment variable, so a run is
# just `ansible-playbook <playbook>`. `-e` still overrides. Credentials have no
# generated fallback; 4-configure.yml checks them before deploying anything.

# --- Steps 1-2: hypervisor (laptop only) -------------------------------------
hypervisor_provider: "{{ lookup('env', 'SOPHON_HYPERVISOR') | default('proxmox', true) }}"

vcenter_url: "{{ lookup('env', 'SOPHON_VCENTER_URL') }}"
vcenter_username: "{{ lookup('env', 'SOPHON_VCENTER_USERNAME') | default('administrator@vsphere.local', true) }}"
vcenter_password: "{{ lookup('env', 'SOPHON_VCENTER_PASSWORD') }}"
vcenter_ca_file: "{{ lookup('env', 'SOPHON_VCENTER_CA_FILE') | default('', true) }}"
vcenter_datacenter: "{{ lookup('env', 'SOPHON_VCENTER_DATACENTER') }}"
vcenter_cluster: "{{ lookup('env', 'SOPHON_VCENTER_CLUSTER') }}"
vcenter_datastore: "{{ lookup('env', 'SOPHON_VCENTER_DATASTORE') }}"
vcenter_network: "{{ lookup('env', 'SOPHON_VCENTER_NETWORK') }}"
vcenter_folder: "{{ lookup('env', 'SOPHON_VCENTER_FOLDER') | default('', true) }}"

hyperv_host: "{{ lookup('env', 'SOPHON_HYPERV_HOST') | default('', true) }}"
hyperv_port: "{{ lookup('env', 'SOPHON_HYPERV_PORT') | default(5985, true) | int }}"
hyperv_username: "{{ lookup('env', 'SOPHON_HYPERV_USERNAME') | default('Administrator', true) }}"
hyperv_password: "{{ lookup('env', 'SOPHON_HYPERV_PASSWORD') | default('', true) }}"
hyperv_ca_file: "{{ lookup('env', 'SOPHON_HYPERV_CA_FILE') | default('', true) }}"
hyperv_switch: "{{ lookup('env', 'SOPHON_HYPERV_SWITCH') | default('', true) }}"
hyperv_path: "{{ lookup('env', 'SOPHON_HYPERV_PATH') | default('', true) }}"

proxmox_host: "{{ lookup('env', 'SOPHON_PROXMOX_HOST') | default('', true) }}"
proxmox_port: "{{ lookup('env', 'SOPHON_PROXMOX_PORT') | default(8006, true) | int }}"
proxmox_node: "{{ lookup('env', 'SOPHON_PROXMOX_NODE') | default('proxmox', true) }}"
proxmox_password: "{{ lookup('env', 'SOPHON_PROXMOX_PASSWORD') | default('', true) }}"
proxmox_iso_storage_id: "{{ lookup('env', 'SOPHON_PROXMOX_ISO_STORAGE') | default('local', true) }}"
proxmox_disk_storage_id: "{{ lookup('env', 'SOPHON_PROXMOX_DISK_STORAGE') | default('local-lvm', true) }}"
vnet_interface: "{{ lookup('env', 'SOPHON_VNET_INTERFACE') | default('vmbr0', true) }}"
vnet_vlan: "{{ lookup('env', 'SOPHON_VNET_VLAN') | default('', true) }}"

infravm_vm_name: "{{ lookup('env', 'SOPHON_INFRAVM_NAME') | default('sophon-infravm', true) }}"
infravm_cores: "{{ lookup('env', 'SOPHON_INFRAVM_CORES') | default(8, true) | int }}"
infravm_memory: "{{ lookup('env', 'SOPHON_INFRAVM_MEMORY') | default(12288, true) | int }}"
infravm_disk_gb: "{{ lookup('env', 'SOPHON_INFRAVM_DISK_GB') | default(1024, true) | int }}"
# Written into the VM so a rerun can tell this workflow's VM from anyone else's.
infravm_marker: "sophon-infravm-two-iso-v1"

backup_vm_name: "{{ lookup('env', 'SOPHON_BACKUP_VM_NAME') | default('sophon-backup', true) }}"
backup_vm_cores: "{{ lookup('env', 'SOPHON_BACKUP_VM_CORES') | default(2, true) | int }}"
backup_vm_memory: "{{ lookup('env', 'SOPHON_BACKUP_VM_MEMORY') | default(2048, true) | int }}"
backup_vm_disk_gb: "{{ lookup('env', 'SOPHON_BACKUP_VM_DISK_GB') | default(1536, true) | int }}"
backup_vm_marker: "sophon-backup-vm-v1"

attach_secrets_iso: "{{ (lookup('env', 'SOPHON_ATTACH_SECRETS_ISO') | default('true', true) | lower) not in ['0', 'false', 'no', 'off'] }}"
explicit_secrets_iso_path: "{{ lookup('env', 'SOPHON_SECRETS_ISO') | default('', true) }}"
explicit_backup_secrets_iso_path: "{{ lookup('env', 'SOPHON_BACKUP_SECRETS_ISO') | default('', true) }}"

# --- Step 4: services (InfraVM only) -----------------------------------------
infravm_ip: "{{ lookup('env', 'SOPHON_INFRAVM_IP') | default('', true) }}"
vnet_dns: "{{ lookup('env', 'SOPHON_VNET_DNS') | default('', true) }}"
domain_name: "{{ lookup('env', 'SOPHON_DOMAIN') | default('', true) }}"
traefik_acme_email: "{{ lookup('env', 'SOPHON_ACME_EMAIL') | default('admin@example.com', true) }}"
coredns_cf_token: "{{ lookup('env', 'SOPHON_CF_TOKEN') | default('', true) }}"
cf_tunnel_enabled: "{{ (lookup('env', 'SOPHON_CF_TUNNEL_ENABLED') | default('true', true) | lower) == 'true' }}"
cf_access_enabled: "{{ (lookup('env', 'SOPHON_CF_ACCESS_ENABLED') | default('true', true) | lower) not in ['0', 'false', 'no', 'off'] }}"
cf_access_emails: "{{ lookup('env', 'SOPHON_CF_ACCESS_EMAILS') | default('', true) }}"
nexus_anonymous_enabled: "{{ (lookup('env', 'SOPHON_NEXUS_ANONYMOUS_ENABLED') | default('true', true) | lower) not in ['0', 'false', 'no', 'off'] }}"
prepare_restore: "{{ (lookup('env', 'SOPHON_PREPARE_RESTORE') | default('false', true) | lower) == 'true' }}"
kopia_readonly: "{{ prepare_restore | bool }}"

keycloak_realm: "{{ lookup('env', 'SOPHON_KEYCLOAK_REALM') | default('sophon', true) }}"
keycloak_realm_display_name: >-
  {{ lookup('env', 'SOPHON_KEYCLOAK_REALM_DISPLAY_NAME') | default(keycloak_realm, true) }}
keycloak_registration_allowed: "{{ (lookup('env', 'SOPHON_KEYCLOAK_REGISTRATION_ALLOWED') | default('true', true) | lower) not in ['0', 'false', 'no', 'off'] }}"
keycloak_admin_password: "{{ lookup('env', 'SOPHON_KEYCLOAK_ADMIN_PASSWORD') }}"
keycloak_db_password: "{{ lookup('env', 'SOPHON_KEYCLOAK_DB_PASSWORD') }}"
keycloak_arcane_client_secret: "{{ lookup('env', 'SOPHON_KEYCLOAK_ARCANE_CLIENT_SECRET') }}"
gitea_admin_password: "{{ lookup('env', 'SOPHON_GITEA_ADMIN_PASSWORD') }}"
nexus_admin_password: "{{ lookup('env', 'SOPHON_NEXUS_ADMIN_PASSWORD') }}"
openldap_admin_password: "{{ lookup('env', 'SOPHON_OPENLDAP_ADMIN_PASSWORD') }}"
openldap_example_user_password: "{{ lookup('env', 'SOPHON_OPENLDAP_EXAMPLE_USER_PASSWORD') }}"
openldap_example_admin_password: "{{ lookup('env', 'SOPHON_OPENLDAP_EXAMPLE_ADMIN_PASSWORD') }}"
openldap_example_user_uid: "john.doe"
openldap_example_admin_uid: "john.doe.admin"

arcane_image_repo: "ghcr.io/getarcaneapp/manager"
arcane_image_tag: "v3.0.1"
arcane_image: "{{ arcane_image_repo }}:{{ arcane_image_tag }}"
arcane_admin_password: "{{ lookup('env', 'SOPHON_ARCANE_ADMIN_PASSWORD') }}"
arcane_encryption_key: "{{ lookup('env', 'SOPHON_ARCANE_ENCRYPTION_KEY') }}"
# Existing deployments must keep supplying the same database password.
gitea_db_password: "{{ lookup('env', 'SOPHON_GITEA_DB_PASSWORD') | default(arcane_admin_password, true) }}"
nexus_db_password: "{{ lookup('env', 'SOPHON_NEXUS_DB_PASSWORD') | default(arcane_admin_password, true) }}"

kopia_version: "0.23.1"
kopia_image: "localhost/sophon-kopia:{{ kopia_version }}"
kopia_image_tarname: "sophon-kopia_{{ kopia_version }}.tar"
kopia_volumes_dir: "/var/home/sophon/.local/share/containers/storage/volumes"
kopia_password: "{{ lookup('env', 'SOPHON_KOPIA_PASSWORD') }}"
kopia_server_username: "{{ lookup('env', 'SOPHON_KOPIA_SERVER_USERNAME') | default('admin', true) }}"
kopia_server_password: "{{ lookup('env', 'SOPHON_KOPIA_SERVER_PASSWORD') }}"
kopia_sftp_host: "{{ lookup('env', 'SOPHON_KOPIA_SFTP_HOST') }}"
kopia_sftp_port: "{{ lookup('env', 'SOPHON_KOPIA_SFTP_PORT') | default('22', true) }}"
kopia_sftp_username: "{{ lookup('env', 'SOPHON_KOPIA_SFTP_USERNAME') }}"
kopia_sftp_path: "{{ lookup('env', 'SOPHON_KOPIA_SFTP_PATH') }}"
kopia_sftp_private_key_b64: "{{ lookup('env', 'SOPHON_KOPIA_SFTP_PRIVATE_KEY_B64') }}"
kopia_sftp_known_hosts_b64: "{{ lookup('env', 'SOPHON_KOPIA_SFTP_KNOWN_HOSTS_B64') }}"
kopia_client_username: "{{ lookup('env', 'SOPHON_KOPIA_CLIENT_USERNAME') | default('backup', true) }}"
kopia_client_hostname: "{{ lookup('env', 'SOPHON_KOPIA_CLIENT_HOSTNAME') | default('sophon', true) }}"
sophon_version: "{{ lookup('file', playbook_dir ~ '/bootstrap/sophon-version') | trim }}"
kopia_backups_enabled: "{{ lookup('env', 'SOPHON_KOPIA_BACKUPS_ENABLED') | default('true', true) }}"
kopia_snapshot_interval: "{{ lookup('env', 'SOPHON_KOPIA_SNAPSHOT_INTERVAL') | default('6h', true) }}"
kopia_coarse_enabled: "{{ lookup('env', 'SOPHON_KOPIA_COARSE_ENABLED') | default('false', true) }}"
kopia_coarse_volumes_dir: "{{ lookup('env', 'SOPHON_KOPIA_COARSE_VOLUMES_DIR') | default('/var/home/sophon/.local/share/containers/storage/volumes', true) }}"
kopia_coarse_work_dir: "{{ lookup('env', 'SOPHON_KOPIA_COARSE_WORK_DIR') | default('/var/home/sophon/sophon-coarse', true) }}"

# --- Shared paths --------------------------------------------------------------
artifacts_dir: "{{ playbook_dir }}/artifacts"
coreos_iso_path: "{{ artifacts_dir }}/coreos/fedora-coreos-live.iso"
# The stock live ISO above, plus the unattended installer; this is the one every hypervisor boots.
installer_iso_path: "{{ artifacts_dir }}/coreos/sophon-coreos.iso"
bundle_iso_path: "{{ artifacts_dir }}/bootstrap/sophon-apps.iso"
# Standalone unattended Alpine SFTP backup server installer ISO (optional; for sites without an existing SFTP server).
backup_installer_iso_path: "{{ artifacts_dir }}/backup/sophon-sftp-server.iso"
secrets_iso_default_path: "{{ artifacts_dir }}/secrets/sophon-secrets.iso"
backup_secrets_iso_default_path: "{{ artifacts_dir }}/secrets/sophon-sftp-secrets.iso"
# <vendor>-<image>_<tag>.tar, e.g. getarcaneapp-manager_v3.0.1.tar
sophon_containers_dir: "{{ artifacts_dir }}/containers"
arcane_image_tarname: "{{ (arcane_image_repo.split('/')[-2:] | join('-')) }}_{{ arcane_image_tag }}.tar"

coredns_plugin_revision: "961da07798aef59715f7d8f8802185863a3909c8"
coredns_image_tag: "1.15.0-{{ coredns_plugin_revision[:12] }}"

arcane_url: "https://arcane.{{ domain_name | lower | regex_replace('\\.$', '') }}"
