---
# =============================================================================
# Sophon — Global Variables
# =============================================================================

# -----------------------------------------------------------------------------
# Site settings, sourced from the environment
# -----------------------------------------------------------------------------
# Every value a deployment must be told about is read from an environment
# variable here so the run itself is just `ansible-playbook site.yml` — a long
# -e command line is easy to paste with one flag missing, and a missing vnet
# flag silently retargets the deployment at a different subnet.
#
# `-e` still wins over anything below, so one-off overrides keep working. The
# fallback after each lookup repeats the role default verbatim, so leaving a
# variable unset behaves exactly as it did before this block existed.
#
# Cloudflare needs only the token: the zone and account ids are read back from
# the API by the coredns role, which keeps them from going stale when a zone is
# recreated.
proxmox_host: "{{ lookup('env', 'SOPHON_PROXMOX_HOST') | default('', true) }}"
proxmox_port: "{{ lookup('env', 'SOPHON_PROXMOX_PORT') | default(8006, true) | int }}"
proxmox_node: "{{ lookup('env', 'SOPHON_PROXMOX_NODE') | default('proxmox', true) }}"
proxmox_password: "{{ lookup('env', 'SOPHON_PROXMOX_PASSWORD') | default('', true) }}"
proxmox_iso_storage_id: "{{ lookup('env', 'SOPHON_PROXMOX_ISO_STORAGE') | default('local', true) }}"

domain_name: "{{ lookup('env', 'SOPHON_DOMAIN') | default('', true) }}"
traefik_acme_email: "{{ lookup('env', 'SOPHON_ACME_EMAIL') | default('admin@example.com', true) }}"
coredns_cf_token: "{{ lookup('env', 'SOPHON_CF_TOKEN') | default('', true) }}"

# Empty means "discover it": the vnet role fills these in from the Proxmox SDN
# definition and the free addresses in the subnet.
vnet_interface: "{{ lookup('env', 'SOPHON_VNET_INTERFACE') | default('vmbr0', true) }}"
vnet_vlan: "{{ lookup('env', 'SOPHON_VNET_VLAN') | default('', true) }}"
vnet_gateway: "{{ lookup('env', 'SOPHON_VNET_GATEWAY') | default('', true) }}"
vnet_cidr: "{{ lookup('env', 'SOPHON_VNET_CIDR') | default('', true) }}"
nfs_ip: "{{ lookup('env', 'SOPHON_NFS_IP') | default('', true) }}"
infravm_ip: "{{ lookup('env', 'SOPHON_INFRAVM_IP') | default('', true) }}"

keycloak_realm: "{{ lookup('env', 'SOPHON_KEYCLOAK_REALM') | default('sophon', true) }}"
# Shown on the Keycloak login page. Tracks the realm name so renaming the realm
# cannot leave "Sophon" greeting users of a site that is not called that.
keycloak_realm_display_name: >-
  {{ lookup('env', 'SOPHON_KEYCLOAK_REALM_DISPLAY_NAME') | default(keycloak_realm, true) }}
keycloak_admin_password: "{{ lookup('env', 'SOPHON_KEYCLOAK_ADMIN_PASSWORD') | default('admin', true) }}"

# -----------------------------------------------------------------------------
# Portainer image / edition
# -----------------------------------------------------------------------------
# Business Edition. Needs portainer_license_key to run unrestricted.
portainer_image_repo: "docker.io/portainer/portainer-ee"
portainer_image_tag: "2.41.0"
portainer_image: "{{ portainer_image_repo }}:{{ portainer_image_tag }}"

# Portainer Business Edition license key. Required when running EE images.
# Obtain a free 5-node Business Starter license from portainer.io.
portainer_license_key: "{{ lookup('env', 'SOPHON_PORTAINER_LICENSE_KEY') | default('', true) }}"

# Seeds gitea_db_password, kopia_repository_password and others, so it must be
# the same value on every run — regenerating it orphans the Kopia repository.
# Unset in the environment means "generate one and remember it".
portainer_admin_password: >-
  {{ lookup('env', 'SOPHON_PORTAINER_ADMIN_PASSWORD')
     | default(lookup('password',
                      playbook_dir ~ '/artifacts/secrets/portainer_admin_password'
                      ~ ' length=24 chars=ascii_letters,digits'), true) }}

# Tarball filename for prestage / NFS upload / infravm boot loader.
# Mirrors the naming convention in prestage.yml:
#   <vendor>-<image>_<tag>.tar  e.g. portainer-portainer-ee_2.41.0.tar
portainer_image_tarname: "{{ (portainer_image_repo.split('/')[-2:] | join('-')) }}_{{ portainer_image_tag }}.tar"

# Where prestage.yml writes container image tars. Roles name the tars they
# need relative to this and hand them to portainer_stack, which loads them
# into the endpoint before deploying the stack.
sophon_containers_dir: "{{ playbook_dir }}/artifacts/containers"

# -----------------------------------------------------------------------------
# Portainer URL (used by infravm, coredns, portainer_stack, keycloak roles)
# -----------------------------------------------------------------------------
# Addressed by IP: the Controller has direct vnet access (ADR-0002), and at this
# point in the run no DNS, Traefik or sync sidecar exists to resolve a name.
# End users still reach portainer.<domain> via Traefik once it is up.
infravm_portainer_port: 9443
infravm_portainer_url: "https://{{ infravm_ip | default('') }}:{{ infravm_portainer_port }}"

# -----------------------------------------------------------------------------
# Kopia / SFTP backend integration contract
# -----------------------------------------------------------------------------
# These vars are the loose-coupling interface between whatever role
# provisions the SFTP backend (the bundled `nfs` role for the Alpine NFS VM,
# or your own role for a real SAN/NAS) and the `kopia` role that consumes
# it. They live here — not in either role's defaults — so both roles see
# the SAME values regardless of include order.
#
# Provisioning side (nfs role, by default) MUST ensure:
#   on the controller:
#     {{ kopia_ssh_keyfile }}      = kopia's SFTP private key (mode 0600)
#     {{ kopia_known_hosts_file }} = single-line known_hosts entry for
#                                    {{ kopia_sftp_host }}
#   on the SFTP host:
#     user {{ kopia_sftp_username }} exists with the matching public key
#       in ~/.ssh/authorized_keys
#     directory {{ kopia_sftp_path }} exists, owned by that user, mode 0700
#
# Consumer side (kopia role): reads the two artifact files, injects them
# into the compose template, deploys via Portainer. Has no knowledge of
# how the SFTP backend was provisioned.
#
# To swap in a real SAN/NAS:
#   - set nfs_provision_kopia_user: false  (skips the bundled provisioning)
#   - populate kopia_ssh_keyfile + kopia_known_hosts_file out-of-band
#   - override kopia_sftp_host / kopia_sftp_path / kopia_sftp_username
kopia_enabled: true
kopia_sftp_host: "{{ nfs_ip }}"
kopia_sftp_port: 22
kopia_sftp_username: "kopia"
kopia_sftp_path: "/export/kopia/repo"
kopia_ssh_keydir: "{{ playbook_dir }}/artifacts/kopia"
kopia_ssh_keyfile: "{{ kopia_ssh_keydir }}/id_ed25519"
kopia_known_hosts_file: "{{ kopia_ssh_keydir }}/known_hosts"
