---
# Steps 1+2 - connected laptop with hypervisor access. Validates inputs, builds
# the media (1-prepare.yml), then creates a blank InfraVM with the installer and deployment ISOs attached.
- name: Validate provisioning inputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require a supported hypervisor
      ansible.builtin.assert:
        that: hypervisor_provider in ['proxmox', 'vcenter', 'hyperv']
        fail_msg: "SOPHON_HYPERVISOR must be proxmox, vcenter or hyperv."
    - name: Require hypervisor settings
      ansible.builtin.assert:
        that: lookup('env', item) | trim | length > 0
        fail_msg: "Supply {{ item }} before provisioning. Service credentials belong in step 4."
        quiet: true
      loop: >-
        {{ ['SOPHON_PROXMOX_HOST', 'SOPHON_PROXMOX_PASSWORD'] if hypervisor_provider == 'proxmox' else
           ['SOPHON_HYPERV_HOST', 'SOPHON_HYPERV_PASSWORD', 'SOPHON_HYPERV_SWITCH'] if hypervisor_provider == 'hyperv' else
           ['SOPHON_VCENTER_URL', 'SOPHON_VCENTER_PASSWORD', 'SOPHON_VCENTER_DATACENTER',
            'SOPHON_VCENTER_CLUSTER', 'SOPHON_VCENTER_DATASTORE', 'SOPHON_VCENTER_NETWORK'] }}

- name: Prepare installation media
  ansible.builtin.import_playbook: 1-prepare.yml

- name: Create InfraVM
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Authenticate with Proxmox
      ansible.builtin.include_role:
        name: proxmox
      when: hypervisor_provider == 'proxmox'
    - name: Authenticate with vCenter
      ansible.builtin.include_role:
        name: vcenter
      when: hypervisor_provider == 'vcenter'
    - name: Authenticate with Hyper-V
      ansible.builtin.include_role:
        name: hyperv
      when: hypervisor_provider == 'hyperv'
    - name: Create InfraVM with a blank disk and the installer and deployment ISOs
      ansible.builtin.include_role:
        name: "{{ hypervisor_provider }}"
        tasks_from: vm
    - name: Hand off to the InfraVM console
      ansible.builtin.debug:
        msg: |
          InfraVM is running. Step 3 installs CoreOS by itself and reboots; watch it on the VM's
          hypervisor console (nothing to type). If it stops and says why, see "If the install stops"
          in the README.
          On the first boot, choose the password for the user core, log in, and run: sophon-deploy (step 4).
          It first asks for the network (the VM starts on DHCP). At an air-gapped site, attach the
          certificate disk (artifacts/secrets/sophon-certificates.iso) before running it.
