---
# =============================================================================
# Sophon Deploy Playbook
# =============================================================================
# Main deployment playbook that handles CoreOS deployment and connectivity routing
#
# This playbook:
# 1. Deploys CoreOS VM on Proxmox
# 2. Checks connectivity to CoreOS
# 3. If unreachable, deploys bastion VM
# 4. Routes through bastion (Cloudflared/SSH/QGA) to continue deployment
#
# Usage:
#   # Online mode (default)
#   ansible-playbook deploy.yml -i inventories/production/inventory.yml
#
#   # Air-gapped mode (after running prestage.yml and nfs-upload.yml)
#   ansible-playbook deploy.yml -i inventories/production/inventory.yml -e airgapped_mode=true
#
#   # With Cloudflared tunnel for bastion access
#   CLOUDFLARED_TUNNEL_TOKEN=xxx ansible-playbook deploy.yml -i inventories/production/inventory.yml

- name: Deploy Sophon Infrastructure
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Deployment mode (set via -e airgapped_mode=true for air-gapped)
    airgapped_mode: false
    
    # Cloudflared tunnel token (set via environment variable)
    cloudflared_tunnel_token: "{{ lookup('env', 'CLOUDFLARED_TUNNEL_TOKEN') | default('') }}"

  pre_tasks:
    - name: Display deployment mode
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════════
          SOPHON DEPLOYMENT
          ═══════════════════════════════════════════════════════════════════════
          Mode:               {{ 'AIR-GAPPED' if airgapped_mode else 'ONLINE' }}
          Cloudflared:        {{ 'ENABLED' if cloudflared_tunnel_token | length > 0 else 'DISABLED' }}
          Proxmox Host:       {{ proxmox_host | default('not set') }}
          CoreOS Target IP:   {{ coreos_ip | default('not set') }}
          ═══════════════════════════════════════════════════════════════════════

  tasks:
    # =========================================================================
    # Phase 1: Deploy Portainer VM (CoreOS-based)
    # =========================================================================
    - name: Deploy Portainer VM
      ansible.builtin.include_role:
        name: portainer
      vars:
        infravm_ip: "{{ coreos_ip | default(omit) }}"
        infravm_gateway: "{{ coreos_gateway | default(omit) }}"

    # =========================================================================
    # Phase 2: Check Connectivity to CoreOS
    # =========================================================================
    - name: Check connectivity to CoreOS VM
      ansible.builtin.include_role:
        name: connectivity_check
      vars:
        connectivity_check_target_ip: "{{ coreos_ip }}"

    # =========================================================================
    # Phase 3a: Direct Path - CoreOS is reachable
    # =========================================================================
    - name: Continue with direct deployment (CoreOS reachable)
      when: coreos_reachable | default(false)
      block:
        - name: Display direct path
          ansible.builtin.debug:
            msg: "CoreOS is directly reachable - continuing deployment without bastion"

        # Add CoreOS to in-memory inventory for direct connection
        - name: Add CoreOS to inventory
          ansible.builtin.add_host:
            name: coreos
            ansible_host: "{{ coreos_ip }}"
            ansible_user: "{{ coreos_username | default('admin') }}"
            ansible_ssh_private_key_file: "{{ coreos_ssh_private_key_path | default('~/.ssh/id_rsa') }}"
            groups:
              - coreos_vms

    # =========================================================================
    # Phase 3b: Bastion Path - CoreOS is NOT reachable
    # =========================================================================
    - name: Deploy bastion for indirect access (CoreOS unreachable)
      when: bastion_required | default(false)
      block:
        - name: Display bastion deployment
          ansible.builtin.debug:
            msg: |
              CoreOS is NOT directly reachable - deploying bastion VM
              Cloudflared: {{ 'ENABLED' if cloudflared_tunnel_token | length > 0 else 'DISABLED' }}

        - name: Deploy Bastion VM
          ansible.builtin.include_role:
            name: bastion
          vars:
            bastion_enabled: true
            bastion_cloudflared_token: "{{ cloudflared_tunnel_token }}"

        # Check bastion connectivity options
        - name: Check bastion SSH connectivity
          ansible.builtin.include_role:
            name: connectivity_check
          vars:
            connectivity_check_target_ip: "{{ bastion_ip }}"
            connectivity_check_target_user: "{{ bastion_username | default('ansible') }}"

        - name: Set bastion access method
          ansible.builtin.set_fact:
            bastion_access_method: >-
              {% if cloudflared_tunnel_token | length > 0 %}cloudflared
              {% elif coreos_ssh_reachable | default(false) %}direct_ssh
              {% else %}qga{% endif %}

        - name: Display bastion access method
          ansible.builtin.debug:
            msg: "Bastion access method: {{ bastion_access_method | trim }}"

        # -----------------------------------------------------------------
        # Route A: Cloudflared ProxyJump
        # -----------------------------------------------------------------
        - name: Configure Cloudflared ProxyJump access
          when: bastion_access_method | trim == 'cloudflared'
          block:
            - name: Add CoreOS with Cloudflared ProxyJump
              ansible.builtin.add_host:
                name: coreos
                ansible_host: "{{ coreos_ip }}"
                ansible_user: "{{ coreos_username | default('admin') }}"
                ansible_ssh_private_key_file: "{{ coreos_ssh_private_key_path | default('~/.ssh/id_rsa') }}"
                ansible_ssh_common_args: "-o ProxyCommand='cloudflared access ssh --hostname {{ bastion_cloudflared_hostname }}'"
                groups:
                  - coreos_vms

        # -----------------------------------------------------------------
        # Route B: Direct SSH ProxyJump
        # -----------------------------------------------------------------
        - name: Configure Direct SSH ProxyJump access
          when: bastion_access_method | trim == 'direct_ssh'
          block:
            - name: Add CoreOS with SSH ProxyJump
              ansible.builtin.add_host:
                name: coreos
                ansible_host: "{{ coreos_ip }}"
                ansible_user: "{{ coreos_username | default('admin') }}"
                ansible_ssh_private_key_file: "{{ coreos_ssh_private_key_path | default('~/.ssh/id_rsa') }}"
                ansible_ssh_common_args: "-o ProxyJump={{ bastion_username | default('ansible') }}@{{ bastion_ip }}"
                groups:
                  - coreos_vms

        # -----------------------------------------------------------------
        # Route C: QGA Remote Execution (last resort)
        # -----------------------------------------------------------------
        - name: Execute via QGA (last resort)
          when: bastion_access_method | trim == 'qga'
          block:
            - name: Display QGA execution notice
              ansible.builtin.debug:
                msg: |
                  ═══════════════════════════════════════════════════════════════════
                  QGA REMOTE EXECUTION
                  ═══════════════════════════════════════════════════════════════════
                  Neither Cloudflared nor direct SSH is available to the bastion.
                  Falling back to QEMU Guest Agent for remote execution.
                  
                  This will:
                  1. Upload essential Sophon playbooks to bastion via QGA
                  2. Execute ansible-playbook on bastion via QGA
                  3. Monitor execution progress
                  ═══════════════════════════════════════════════════════════════════

            - name: Execute Sophon on bastion via QGA
              ansible.builtin.include_role:
                name: qga_remote_exec
              vars:
                qga_remote_exec_vmid: "{{ bastion_vmid }}"

            # After QGA execution, we're done - the bastion ran the playbook
            - name: End play after QGA execution
              ansible.builtin.meta: end_play

    # =========================================================================
    # Phase 4: Continue Deployment on CoreOS (via direct or proxy)
    # =========================================================================
    - name: Set deployment ready fact
      ansible.builtin.set_fact:
        coreos_deployment_ready: true

- name: Configure CoreOS Services
  hosts: coreos_vms
  gather_facts: true
  become: true

  tasks:
    - name: Wait for CoreOS to be fully ready
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Display CoreOS connection success
      ansible.builtin.debug:
        msg: "Successfully connected to CoreOS - ready for service deployment"

# =============================================================================
# Service Deployment (imported from other playbooks)
# =============================================================================
- name: Deploy Portainer
  ansible.builtin.import_playbook: portainer.yml

- name: Deploy CoreDNS
  ansible.builtin.import_playbook: coredns.yml

- name: Deploy Traefik
  ansible.builtin.import_playbook: deploy-traefik.yml
