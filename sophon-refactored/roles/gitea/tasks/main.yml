---
- name: Deploy Gitea stack via Portainer
  ansible.builtin.include_role:
    name: portainer_stack
  vars:
    portainer_stack_name: "gitea"
    portainer_stack_compose_content: "{{ lookup('template', 'docker-compose.yml.j2') }}"
    portainer_stack_image_tars: "{{ gitea_image_tars }}"
    portainer_stack_deploy_timeout: 300

- name: Wait for Gitea initialization to finish
  ansible.builtin.uri:
    url: "{{ infravm_portainer_url }}/api/endpoints/{{ portainer_stack_endpoint_id }}/docker/containers/gitea-init/json"
    headers:
      Authorization: "Bearer {{ portainer_stack_auth_token }}"
    validate_certs: "{{ portainer_stack_validate_certs | default(false) }}"
    status_code: [200, 404]
  register: gitea_init_inspect
  changed_when: false
  until: >-
    gitea_init_inspect.status == 200 and
    gitea_init_inspect.json.State.Status in ['exited', 'dead']
  retries: 60
  delay: 5
  no_log: true

- name: Require successful Gitea initialization
  ansible.builtin.assert:
    that:
      - gitea_init_inspect.json.State.Status == 'exited'
      - gitea_init_inspect.json.State.ExitCode | int == 0
    fail_msg: >-
      Gitea initialization failed (exit {{ gitea_init_inspect.json.State.ExitCode }}).
      Check the gitea-init container logs in Portainer, correct the failure,
      and re-run service deployment.

- name: Display Gitea status
  ansible.builtin.debug:
    msg: |
      Gitea deployed at {{ gitea_root_url }}
      Admin user:     {{ gitea_admin_user }}
      Admin password: {{ gitea_admin_password }}
      OIDC SSO:       {{ 'enabled (Keycloak)' if gitea_oauth_enabled else 'disabled' }}
