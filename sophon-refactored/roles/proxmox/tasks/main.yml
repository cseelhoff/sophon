---
# Authenticate and snapshot what vm.yml needs to decide. Sets proxmox_ticket,
# proxmox_csrf, proxmox_api, proxmox_vms and proxmox_iso_content.

- name: Set Proxmox API URL
  ansible.builtin.set_fact:
    proxmox_api: "https://{{ proxmox_host }}:{{ proxmox_port }}/api2/json"

- name: Authenticate to Proxmox API
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ proxmox_user }}"
      password: "{{ proxmox_password }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_auth

- name: Remember the session
  ansible.builtin.set_fact:
    proxmox_ticket: "{{ proxmox_auth.json.data.ticket }}"
    proxmox_csrf: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"

# Templates are listed alongside VMs; vm.yml refuses to adopt one.
- name: List guests
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/cluster/resources?type=vm"
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_vms

- name: List ISO storage content
  ansible.builtin.uri:
    url: "{{ proxmox_api }}/nodes/{{ proxmox_node }}/storage/{{ proxmox_iso_storage_id }}/content?content=iso"
    headers:
      Cookie: "PVEAuthCookie={{ proxmox_ticket }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_iso_content
