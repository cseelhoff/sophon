---
# =============================================================================
# Portainer VM Deployment
# =============================================================================
# Deploys a CoreOS VM with Portainer stack via the portainer role.
# The portainer role depends on coreos_base which handles VM creation.
#
# Usage:
#   ansible-playbook portainer.yml -e proxmox_host=10.1.1.2 -e coreos_ip=10.1.1.100

- name: Deploy Portainer VM
  hosts: localhost
  gather_facts: true
  roles:
    - portainer
