---
# =============================================================================
# InfraVM Deployment
# =============================================================================
# Deploys a CoreOS VM with all infrastructure services via the infravm role.
#
# Usage:
#   ansible-playbook infravm.yml -e proxmox_host=10.1.1.2 -e infravm_ip=10.1.1.100

- name: Deploy InfraVM
  hosts: localhost
  gather_facts: true
  roles:
    - infravm
