---
# Hot-insert sophon-secrets.iso (`SOPHON_CERTS`) into a Sophon-managed InfraVM across Proxmox, vCenter, or Hyper-V.
- name: Mount Sophon secrets ISO onto a managed VM
  hosts: localhost
  gather_facts: false
  vars:
    mount_secrets_vm_name: "{{ lookup('env', 'SOPHON_MOUNT_SECRETS_VM_NAME') | default(infravm_vm_name, true) }}"
    mount_secrets_vm_marker: "{{ lookup('env', 'SOPHON_MOUNT_SECRETS_VM_MARKER') | default(infravm_marker, true) }}"
    mount_secrets_iso_path: "{{ lookup('env', 'SOPHON_SECRETS_ISO') | default(playbook_dir ~ '/artifacts/secrets/sophon-secrets.iso', true) }}"
  tasks:
    - name: Validate target VM and secrets ISO file
      ansible.builtin.stat:
        path: "{{ mount_secrets_iso_path }}"
      register: mount_secrets_local_stat

    - name: Require existing regular secrets ISO file
      ansible.builtin.assert:
        that:
          - hypervisor_provider in ['proxmox', 'vcenter', 'hyperv']
          - mount_secrets_vm_name | length > 0
          - mount_secrets_local_stat.stat.exists
          - mount_secrets_local_stat.stat.isreg
          - not (mount_secrets_local_stat.stat.islnk | default(false))
        fail_msg: "Missing secrets ISO '{{ mount_secrets_iso_path }}' (run: sh sophon-build-isos.sh)."

    - name: Authenticate with Proxmox
      ansible.builtin.include_role:
        name: proxmox
      when: hypervisor_provider == 'proxmox'

    - name: Authenticate with vCenter
      ansible.builtin.include_role:
        name: vcenter
      when: hypervisor_provider == 'vcenter'

    - name: Authenticate with Hyper-V
      ansible.builtin.include_role:
        name: hyperv
      when: hypervisor_provider == 'hyperv'

    - name: Hot-insert secrets ISO into managed VM
      ansible.builtin.include_role:
        name: "{{ hypervisor_provider }}"
        tasks_from: mount_secrets
