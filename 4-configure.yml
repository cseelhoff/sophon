---
# Step 4 - runs inside the InfraVM's runner container (via sophon-deploy).
# Deploys Compose stacks directly over the rootless Podman socket; no hypervisor access, no SSH.
- name: Deploy services from InfraVM
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Require the InfraVM runner and no hypervisor credentials
      ansible.builtin.assert:
        that:
          - lookup('env', 'SOPHON_DEPLOYMENT_STEP') == 'configure'
          - lookup('env', 'SOPHON_PROXMOX_PASSWORD') == ''
          - lookup('env', 'SOPHON_VCENTER_PASSWORD') == ''
          - lookup('env', 'SOPHON_KOPIA_PREFLIGHT_COMPLETE') == 'true'
        fail_msg: "Run sophon-deploy on the installed InfraVM to complete SFTP preflight before stack deployment. Provisioning is a separate laptop step."
      tags: [always]
    - name: Validate service credentials
      ansible.builtin.assert:
        that:
          - lookup('vars', item) is string
          - lookup('vars', item) | trim | length > 0
        fail_msg: "Supply SOPHON_{{ item | upper }} through sophon-deploy on InfraVM."
        quiet: true
      loop:
        - arcane_admin_password
        - keycloak_admin_password
        - keycloak_db_password
        - keycloak_arcane_client_secret
        - gitea_admin_password
        - nexus_admin_password
        - openldap_admin_password
        - openldap_example_user_password
        - openldap_example_admin_password
        - gitea_db_password
        - nexus_db_password
        - arcane_encryption_key
        - kopia_password
        - kopia_server_password
        - kopia_sftp_private_key_b64
        - kopia_sftp_known_hosts_b64
      tags: [always]
    - name: Validate the Arcane password length
      ansible.builtin.assert:
        that: arcane_admin_password | length >= 12
        fail_msg: "SOPHON_ARCANE_ADMIN_PASSWORD must contain at least 12 characters."
      tags: [always]
    - name: Validate domain and InfraVM address
      ansible.builtin.assert:
        that:
          - domain_name | length > 0
          - domain_name | length <= 253
          - domain_name is match('^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.?\Z')
          - infravm_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}\Z')
          - infravm_ip.split('.') | map('int') | max <= 255
        fail_msg: "Supply a valid SOPHON_DOMAIN and SOPHON_INFRAVM_IP on InfraVM."
      tags: [always]
    # CoreDNS is not running yet, so the runner resolves service names itself.
    - name: Point service names at InfraVM inside the runner
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} SOPHON SERVICE NAMES"
        unsafe_writes: true
        block: |
          {% for name in ['', 'status', 'traefik', 'auth', 'ldap', 'git', 'nexus', 'registry', 'registry-push', 'arcane', 'dns', 'kopia'] %}
          {{ infravm_ip }} {{ (name ~ '.' if name else '') ~ (domain_name | lower | regex_replace('\.$', '')) }}
          {% endfor %}
      tags: [always]
  tasks:
    - name: Deploy CoreDNS
      ansible.builtin.include_role:
        name: coredns
    - name: Deploy Traefik
      ansible.builtin.include_role:
        name: traefik
    - name: Connect the Cloudflare tunnel
      ansible.builtin.include_role:
        name: cloudflared
    - name: Deploy OpenLDAP
      ansible.builtin.include_role:
        name: openldap
    - name: Deploy Keycloak
      ansible.builtin.include_role:
        name: keycloak
    - name: Deploy Gitea
      ansible.builtin.include_role:
        name: gitea
    - name: Deploy Nexus
      ansible.builtin.include_role:
        name: nexus
    - name: Deploy Arcane
      ansible.builtin.include_role:
        name: arcane
    - name: Deploy Appliance Status and Cutover UI
      ansible.builtin.include_role:
        name: status
    - name: Deploy Kopia after source volumes exist
      ansible.builtin.include_role:
        name: kopia
    - name: Finish service deployment
      ansible.builtin.debug:
        msg: "Deployment complete. Status & Cutover: https://status.{{ domain_name | lower | regex_replace('\\.$', '') }} | Arcane: {{ arcane_url }}. Retain credentials in your password manager."
