---
# =============================================================================
# Sophon Prestage Playbook
# =============================================================================
# Pre-stages container images locally before deployment.
# Images are pulled and saved to tar files for efficient distribution via NFS.
#
# Usage:
#   ansible-playbook prestage.yml

- name: Prestage container images
  hosts: localhost
  vars:
    prestage_containers_dir: "{{ playbook_dir }}/nfs/containers"
    prestage_container_images:
      - "docker.io/portainer/portainer-ce:2.27.1"
      - "docker.io/coredns/coredns:1.12.0"
      - "docker.io/library/busybox:stable"
      - "docker.io/library/traefik:v3.2"
      - "docker.io/gitea/gitea:1.21"
      - "docker.io/sonatype/nexus3:3.72.0"
      - "docker.io/osixia/openldap:1.5.0"
      - "docker.io/osixia/phpldapadmin:0.9.0"
      - "docker.io/cloudflare/cloudflared:latest"
  tasks:
    - name: Create containers staging directory
      ansible.builtin.file:
        path: "{{ prestage_containers_dir }}"
        state: directory
        mode: "0755"

    - name: Process container images
      ansible.builtin.shell: |
        TAR_FILE="{{ prestage_containers_dir }}/{{ (item.split(':')[0].split('/')[-2:] | join('-')) }}_{{ item.split(':')[-1] }}.tar"
        [ ! -f "$TAR_FILE" ] && podman pull "{{ item }}" && podman save -o "$TAR_FILE" "{{ item }}"
      loop: "{{ prestage_container_images }}"
      loop_control:
        label: "{{ item }}"
      register: process_result
      failed_when: false
      changed_when: process_result.rc == 0
