---
# =============================================================================
# Sophon Prestage Playbook
# =============================================================================
# Populates artifacts/ with everything Deploy needs: container image tars, the
# offline runner, Ansible collections, the stock CoreOS ISO and the artifact ISO.
# bootstrap.yml runs these tasks automatically. Site network settings are
# entered later at the live console, not during connected preparation.
#
# Usage:
#   ansible-playbook prestage.yml
#   ansible-playbook prestage.yml -e prestage_force=true   # refresh everything

- name: Prestage deployment artifacts
  hosts: localhost
  tasks:
    - name: Stage artifacts
      ansible.builtin.include_role:
        name: prestage
        tasks_from: bootstrap
