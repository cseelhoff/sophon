---
# =============================================================================
# Sophon Prestage Playbook
# =============================================================================
# Phase 1 of Air-Gapped Deployment: Downloads all artifacts while on internet
#
# Usage: Run this playbook while connected to the internet, before switching
# to the air-gapped network.
#
#   ansible-playbook prestage.yml
#
# After completion, switch to the air-gapped network and run:
#   ansible-playbook nfs-upload.yml -i inventories/production/inventory.yml

- name: Prestage Sophon Artifacts for Air-Gapped Deployment
  hosts: localhost

  pre_tasks:
    - name: Display prestage information
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════════
          SOPHON PRESTAGE - Air-Gapped Deployment Phase 1
          ═══════════════════════════════════════════════════════════════════════

          This playbook downloads all required artifacts for CoreOS deployment:
          - Fedora CoreOS QCOW2 image
          - Alpine Linux cloud image (for bastion)
          - Container images (Portainer, CoreDNS, Traefik, etc.)
          - RPM packages (qemu-guest-agent and dependencies)
          - Butane binary

          Artifacts will be saved to: {{ prestage_local_dir | default('/tmp/sophon_prestage') }}

          After completion:
          1. Switch to the air-gapped network
          2. Run: ansible-playbook nfs-upload.yml -i inventories/production/inventory.yml

          ═══════════════════════════════════════════════════════════════════════

  roles:
    - role: nfs_content
      vars:
        nfs_content_mode: "download_only"
        nfs_content_local_staging_dir: "{{ prestage_local_dir | default('/tmp/sophon_prestage') }}"

  post_tasks:
    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════════
          PRESTAGE COMPLETE
          ═══════════════════════════════════════════════════════════════════════

          All artifacts have been downloaded to: {{ prestage_local_dir | default('/tmp/sophon_prestage') }}

          NEXT STEPS:
          1. Disconnect from the internet
          2. Connect to the air-gapped network (where Proxmox and NFS are accessible)
          3. Run: ansible-playbook nfs-upload.yml -i inventories/production/inventory.yml

          ═══════════════════════════════════════════════════════════════════════
