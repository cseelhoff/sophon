---
# =============================================================================
# Sophon Prestage Playbook
# =============================================================================
# Populates artifacts/ with everything Deploy needs: container image tars, the
# CoreDNS Docker Discovery build, and the Alpine NFS VM disk.
#
# site.yml runs the same role automatically, so this playbook is only needed
# when Prestage and Deploy happen on different machines — build artifacts on a
# connected host, carry artifacts/ to the disconnected site, deploy there.
#
# Usage:
#   ansible-playbook prestage.yml
#   ansible-playbook prestage.yml -e prestage_force=true   # refresh everything

- name: Prestage deployment artifacts
  hosts: localhost
  tasks:
    - name: Stage artifacts
      ansible.builtin.include_role:
        name: prestage
