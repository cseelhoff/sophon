---
# Test playbook: deploy a whoami container with Traefik labels to verify
# automatic route discovery via the Docker provider.
#
# Usage:
#   ansible-playbook test-traefik-routing.yml \
#     -e infravm_portainer_url=https://portainer.177cpt.com \
#     -e portainer_admin_password=testpass1234 \
#     -e infravm_ip=10.0.60.3 \
#     -e test_hostname=whoami.177cpt.com
#
# Verify:
#   curl -H "Host: whoami.177cpt.com" http://<infravm_ip>/
#   → should return whoami response with headers

- name: Test Traefik routing via Docker labels
  hosts: localhost
  gather_facts: false
  vars:
    test_hostname: "whoami.{{ domain_name | default('example.local') }}"
  tasks:
    - name: Deploy whoami test stack via Portainer
      ansible.builtin.include_role:
        name: portainer_stack
      vars:
        portainer_stack_name: "whoami-test"
        portainer_stack_compose_content: |
          services:
            whoami:
              image: docker.io/traefik/whoami:latest
              container_name: whoami-test
              restart: unless-stopped
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.whoami-test.rule=Host(`{{ test_hostname }}`)"
                - "traefik.http.routers.whoami-test.entrypoints=web"
                - "traefik.http.services.whoami-test.loadbalancer.server.port=80"

    - name: Wait for whoami container to be routable via Traefik
      ansible.builtin.uri:
        url: "http://{{ infravm_ip }}"
        method: GET
        headers:
          Host: "{{ test_hostname }}"
        status_code: [200]
        validate_certs: false
      register: whoami_result
      until: whoami_result.status | default(-1) == 200
      retries: 15
      delay: 2
      changed_when: false

    - name: Display test result
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════════════════
          Traefik routing test PASSED!
          ═══════════════════════════════════════════════════════════════════

          Request: curl -H "Host: {{ test_hostname }}" http://{{ infravm_ip }}/
          Status:  {{ whoami_result.status }}

          Response body (first 500 chars):
          {{ whoami_result.content[:500] | default('(empty)') }}

          ═══════════════════════════════════════════════════════════════════

          To clean up, delete the "whoami-test" stack from Portainer.
