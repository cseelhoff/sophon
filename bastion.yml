---
# =============================================================================
# Bastion Deployment Playbook
# =============================================================================
# Deploys a CoreOS bastion VM on Proxmox for running Sophon playbooks from
# within the target network. Uses coreos_base role for VM provisioning.
#
# This solves the bootstrapping problem: users who can access Proxmox but
# don't have a machine inside the network where the Portainer VM gets deployed.
#
# Usage:
#   ansible-playbook bastion.yml -e proxmox_host=10.1.1.2 -e coreos_base_ip=10.1.1.50
#
#   # Then SSH into the bastion and run the main playbook
#   ssh admin@<bastion_ip>
#   cd ~/sophon
#   ansible-playbook site.yml
#
# =============================================================================

- name: Deploy Sophon Bastion VM
  hosts: localhost
  gather_facts: true
  vars_prompt:
    - name: coreos_base_ip
      prompt: "Enter static IP for bastion VM"
      private: false
      default: ""
    - name: coreos_base_gateway
      prompt: "Enter gateway IP"
      private: false
      default: ""

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - coreos_base_ip | length > 0
          - coreos_base_gateway | length > 0
        fail_msg: "coreos_base_ip and coreos_base_gateway are required"

  roles:
    - role: bastion
