name: Ansible Lint

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ansible/**'
      - '.gitea/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: Run yamllint
        run: |
          yamllint -d relaxed ansible/

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint --force-color

  syntax-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Check playbook syntax
        run: |
          cd ansible
          for playbook in *.yml; do
            echo "Checking $playbook..."
            ansible-playbook --syntax-check "$playbook" || true
          done
