---
# Safely stop and delete a Sophon-managed VM across Proxmox, vCenter, or Hyper-V.
- name: Destroy a Sophon-managed VM
  hosts: localhost
  gather_facts: false
  vars:
    destroy_vm_name: "{{ lookup('env', 'SOPHON_DESTROY_VM_NAME') | default('', true) }}"
    destroy_vm_marker: >-
      {{ lookup('env', 'SOPHON_DESTROY_VM_MARKER')
         | default((backup_vm_marker if destroy_vm_name == backup_vm_name else infravm_marker), true) }}
    allow_production_destroy: "{{ (lookup('env', 'SOPHON_ALLOW_PRODUCTION_DESTROY') | default('false', true) | lower) == 'true' }}"
  tasks:
    - name: Validate target VM name and production guard
      ansible.builtin.assert:
        that:
          - hypervisor_provider in ['proxmox', 'vcenter', 'hyperv']
          - destroy_vm_name | length > 0
          - allow_production_destroy or (destroy_vm_name != 'sophon-infravm' and destroy_vm_name != 'sophon-backup' and destroy_vm_name != infravm_vm_name and destroy_vm_name != backup_vm_name)
        fail_msg: "Refusing to destroy production VM name '{{ destroy_vm_name }}' without SOPHON_ALLOW_PRODUCTION_DESTROY=true."
    - name: Authenticate with Proxmox
      ansible.builtin.include_role:
        name: proxmox
      when: hypervisor_provider == 'proxmox'
    - name: Authenticate with vCenter
      ansible.builtin.include_role:
        name: vcenter
      when: hypervisor_provider == 'vcenter'
    - name: Authenticate with Hyper-V
      ansible.builtin.include_role:
        name: hyperv
      when: hypervisor_provider == 'hyperv'
    - name: Delete managed VM on hypervisor
      ansible.builtin.include_role:
        name: "{{ hypervisor_provider }}"
        tasks_from: destroy
