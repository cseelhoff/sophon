---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Get running containers
      ansible.builtin.command: podman ps --format json
      register: running_containers
      changed_when: false
      failed_when: false

    - name: Parse container list
      ansible.builtin.set_fact:
        containers: "{{ running_containers.stdout | default('[]') | from_json }}"

    - name: Display running containers
      ansible.builtin.debug:
        msg: "Running containers: {{ containers | map(attribute='Names') | list }}"
      when: containers | length > 0
