---
- name: Prepare
  hosts: all
  tasks:
    - name: Install required Python packages
      ansible.builtin.pip:
        name:
          - docker
          - requests
        state: present

    - name: Install podman-docker compatibility layer
      ansible.builtin.package:
        name: podman-docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure podman socket is running
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"
      failed_when: false
