---
# Test configuration for Vagrant and CI integration testing
# Overrides production values for safe local testing

# Use localhost for testing
coreos_ip: "172.30.1.10"
http_file_server_ip: "172.30.1.10"

# Test domain
domain_name: "sophon.test"

# Disable services that require external resources
traefik_acme_enabled: false
validate_certs: false

# Enable all core services for full integration test
portainer_enabled: true
coredns_enabled: true
openldap_enabled: true
keycloak_enabled: true
traefik_enabled: true
gitea_enabled: true
kopia_enabled: true

# Test credentials - generated at runtime for security
# Uses Ansible's password lookup to generate random passwords
# Passwords are displayed at end of playbook run
portainer_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
openldap_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
keycloak_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
gitea_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
