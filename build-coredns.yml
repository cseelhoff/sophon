---
# Build CoreDNS with dockerdiscovery plugin
# Run with: ansible-playbook build-coredns.yml
#
# To force rebuild: ansible-playbook build-coredns.yml -e coredns_force_rebuild=true

- name: Build CoreDNS with dockerdiscovery plugin
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  roles:
    - coredns_build
